 scénario n’établit fabrication, paiement ou marché réels. Un nouvel essai physique exigerait autorisation, ressources et traitement des obligations antérieures."}]}, {"id": "w11", "lesson": "L7", "kicker": "Mise en situation · Journal des décisions", "title": "Montrer ce qui fait évoluer la décision", "blocks": [{"type": "table", "headers": ["Étape", "Poursuivre / suspendre / arrêter et motif", "Responsable / preuve"], "rows": [["K0–K1 · engagement initial", "", ""], ["K2–K3 · capacité et accord", "", ""], ["K4 · financement", "", ""], ["K5 · dossier R1 en échec", "", ""], ["K6 · R2 distinct, si utilisé", "", ""]], "widths": [0.31, 0.45, 0.24]}, {"type": "field", "label": "Quel arrangement complet proposez-vous?", "prompt": "Acheteur, vendeur, prestataire, bénéficiaire; moyens construits; droits; capacité; prix et conditions d’échec librement acceptés.", "lines": 3}, {"type": "field", "label": "Qu’est-ce qui est dû après R1, avec quels fonds?", "prompt": "Fonds disponibles, recettes conditionnelles exclues, inspection, base de remboursement, réparations non résolues et prochaine décision autorisée.", "lines": 3}, {"type": "field", "label": "Quelle est votre meilleure solution de remplacement?", "prompt": "Même promesse et mêmes ressources. Expliquer pourquoi choisir cette voie, la réviser ou ne pas acheter; nommer toute comparaison non exécutée.", "lines": 2}, {"type": "p", "text": "Un arrêt constructif nomme l’obstacle précis et une proposition suivante viable. Ne pas corriger le cahier en modifiant la quantité ou l’échéance initiale."}]}, {"id": "w12", "lesson": "L7", "kicker": "Mise en situation · Passeport et retour des pairs", "title": "Énoncer un résultat défendable", "blocks": [{"type": "table", "headers": ["Affirmation", "Verdict", "Preuve / limite"], "rows": [["Engagement P1 reconstitué", "", ""], ["Préparation modélisée de la voie", "", ""], ["Résultat de simulation R1", "", ""], ["Résultat de simulation R2, si utilisé", "", ""], ["Livraison physique réelle", "", ""], ["Valeur commerciale réelle", "", ""]], "widths": [0.39, 0.22, 0.39]}, {"type": "field", "label": "Sur quoi le prochain lecteur peut-il s’appuyer?", "prompt": "Promesse/version, périmètre, pièces, évaluateur et liens, incertitudes, expiration ou déclencheur de réexamen.", "lines": 3}, {"type": "p", "text": "Six critères : promesse; moyens construits/capacité; arrangement volontaire; coûts complets/fonds; preuves/verdicts délimités; comparaison équitable/prochaine étape utile. Pour chacun : 0 = absent/erroné, 1 = partiel, 2 = étayé. Cette grille pédagogique sur 12 n’est pas validée et ne certifie pas une entreprise."}, {"type": "field", "label": "Quelle révision serait la plus utile?", "prompt": "Inscrire le total /12, les preuves qui le justifient et une amélioration. Les repères détaillés figurent dans le guide d’animation.", "lines": 2}, {"type": "callout", "label": "Avant de remettre", "text": "Conserver l’échec R1. Ne pas compter les 2 100 conditionnels après refus. Ne pas présenter biens fictifs et paiements simulés comme réels. Corriger ces erreurs quel que soit le score."}]}, {"id": "w13", "lesson": "L8", "kicker": "Exercice · Réutilisation et prochaine action", "title": "Donner au nouvel usage son propre test", "blocks": [{"type": "p", "text": "La capacité conservée peut être un format d’engagement approuvé, une méthode de revue des sources ou une procédure de réservation. Une seconde vente d’étiquettes teste la demande répétée. Une autre tâche exige ses propres preuves. [C2, pp. 23–24]"}, {"type": "field", "label": "Quelle capacité mérite d’être conservée?", "prompt": "Nommer élément ou méthode, droits, coûts, échecs connus et mises à jour nécessaires.", "lines": 2}, {"type": "field", "label": "Quelle promesse différente pourrait-elle aider?", "prompt": "Par exemple, honorer les réservations d’un loueur d’outils après une panne de planning. Préciser bénéficiaire et résultat accepté.", "lines": 2}, {"type": "field", "label": "Comment éprouver son apport?", "prompt": "Comparer avec et sans cette capacité, à ressources équivalentes. Inclure adaptation, requalification, effort humain et coût complet; marquer NON EXÉCUTÉ ce qui ne l’a pas été.", "lines": 3}, {"type": "field", "label": "Que ferez-vous ensuite dans votre contexte?", "prompt": "Une préparation réversible, son responsable, les preuves nécessaires et une date de revue. Toute activation exige autorité, accords, capacité et fonds nouveaux.", "lines": 2}, {"type": "p", "text": "Répondre à Q12, puis revoir votre hypothèse initiale. Dire ce qui a changé votre jugement et ce qui reste inconnu. Finir le cours marque un apprentissage, sans démontrer un service de continuité opérationnel."}]}, {"id": "quiz_1", "lesson": "REF", "kicker": "Vérification des acquis", "title": "Choisir une réponse par question · 1–4", "blocks": [{"type": "p", "text": "**Q01 · Quel événement respecte la promesse fixée P1?**"}, {"type": "bullets", "items": ["A · L’imprimeur B redémarre son équipement.", "B · 10 000 étiquettes quittent B avant 16 h.", "C · Morgan reçoit et accepte 10 000 étiquettes v3 conformes au site M1 avant l’échéance."]}, {"type": "p", "text": "**Q02 · P1 interdit l’acceptation partielle. Seules 9 800 étiquettes conformes arrivent à temps. Comment consigner le résultat initial?**"}, {"type": "bullets", "items": ["A · Échec par rapport à P1; consigner séparément tout nouvel accord.", "B · Ramener P1 à 9 800 et déclarer la réussite.", "C · Réussite, puisque 98 % sont arrivés à temps."]}, {"type": "p", "text": "**Q03 · Le point de reprise indique 8 000. Une modification autorisée ajoute 2 000 avant la borne. Quelle quantité retenir pour l’engagement reconstitué?**"}, {"type": "bullets", "items": ["A · 8 000, puisque la base restaurée fonctionne.", "B · 10 000, après contrôle de l’autorité de la modification et de la couverture jusqu’à la borne.", "C · 12 000, puisque c’est la capacité de l’autre imprimeur."]}, {"type": "p", "text": "**Q04 · Les deux imprimeurs dépendent du même accès indisponible pour obtenir le visuel approuvé. Qu’est-ce qui comble directement ce manque?**"}, {"type": "bullets", "items": ["A · Déclarer B indépendant et poursuivre.", "B · Construire et éprouver un dossier à jour et un canal de lancement autorisés, accessibles séparément.", "C · Transmettre le visuel dont quelqu’un se souvient."]}, {"type": "field", "label": "Vos réponses et une incertitude", "prompt": "Inscrire les quatre lettres. Signaler une réponse à discuter. Ce bilan porte sur les acquis, sans certification.", "lines": 2}]}, {"id": "quiz_2", "lesson": "REF", "kicker": "Vérification des acquis", "title": "Choisir une réponse par question · 5–8", "blocks": [{"type": "p", "text": "**Q05 · La capacité est de 12 000; 2 000 sont protégées; P1 en exige 10 000. Une autre demande simultanée exige 5 000. Quelle conclusion tirer?**"}, {"type": "bullets", "items": ["A · Les deux demandes tiennent, car chacune est inférieure à 12 000.", "B · Il reste 5 000 unités pour la nouvelle demande.", "C · La demande totale atteint 17 000 pour 12 000 disponibles; les deux ne peuvent être couvertes sans condition."]}, {"type": "p", "text": "**Q06 · L’imprimeur B dit : « Nous pourrions probablement aider. » Qu’est-ce que cela établit?**"}, {"type": "bullets", "items": ["A · Un intérêt; la réservation utilisable et ses conditions restent à confirmer.", "B · Une réservation ferme et utilisable pour P1.", "C · Une valeur commerciale encaissée par le coordinateur."]}, {"type": "p", "text": "**Q07 · Le prix modélisé est de 5 600 CAD et le coût complet modélisé de 5 000 CAD. Quelle est la contribution prévue?**"}, {"type": "bullets", "items": ["A · 1 800 CAD.", "B · 600 CAD.", "C · 5 600 CAD."]}, {"type": "p", "text": "**Q08 · 4 700 CAD sont exigibles avant acceptation; 1 200 sont disponibles. L’avance de 3 500 est comprise dans le prix de 5 600. Quelle affirmation est correcte?**"}, {"type": "bullets", "items": ["A · Le revenu total du service devient 9 100 CAD.", "B · Une avance proposée constitue automatiquement des fonds disponibles.", "C · Le manque est de 3 500 CAD; le solde de 2 100 dépend de l’acceptation complète."]}, {"type": "field", "label": "Vos réponses et une incertitude", "prompt": "Inscrire les quatre lettres. Signaler une réponse à discuter. Ce bilan porte sur les acquis, sans certification.", "lines": 2}]}, {"id": "quiz_3", "lesson": "REF", "kicker": "Vérification des acquis", "title": "Choisir une réponse par question · 9–12", "blocks": [{"type": "p", "text": "**Q09 · La réception fictive R1 consigne 9 800 unités conformes. La trésorerie est nulle après les coûts modélisés préalables. Que consigner ensuite?**"}, {"type": "bullets", "items": ["A · Échec de P1 dans la simulation; ne pas compter les 2 100 conditionnels; consigner l’inspection impayée et la décision suivante.", "B · P1 a réussi et le prix complet de 5 600 est acquis.", "C · La livraison physique réelle est certifiée indépendamment."]}, {"type": "p", "text": "**Q10 · Un évaluateur est rémunéré par le fournisseur. Quelle description de son indépendance est défendable?**"}, {"type": "bullets", "items": ["A · Un logiciel distinct démontre une indépendance institutionnelle complète.", "B · Déclarer le lien, la méthode, la garde des sources et les limites; apprécier l’indépendance pour l’affirmation précise.", "C · Un rapport favorable garantit toutes les livraisons futures."]}, {"type": "p", "text": "**Q11 · Quelle comparaison pourrait étayer une décision d’achat utile?**"}, {"type": "bullets", "items": ["A · Donner seulement à CONTINUITY Ω la modification approuvée et l’autre imprimeur.", "B · Comparer uniquement le temps d’exécution du logiciel.", "C · Garder la même promesse, les mêmes sources et ressources utilisables; compter coûts complets et travail humain; accepter un gagnant conventionnel."]}, {"type": "p", "text": "**Q12 · Qu’est-ce qui pourrait étayer l’affirmation qu’une capacité conservée a permis un nouvel usage distinct?**"}, {"type": "bullets", "items": ["A · Une tâche nouvelle et distincte comparée avec et sans cette capacité, à ressources équivalentes, coûts d’adaptation compris.", "B · Une autre description de la même commande d’étiquettes réussie.", "C · Conserver un fichier et l’appeler un cercle vertueux."]}, {"type": "field", "label": "Vos réponses et une incertitude", "prompt": "Inscrire les quatre lettres. Signaler une réponse à discuter. Ce bilan porte sur les acquis, sans certification.", "lines": 2}]}]}}, "facilitator": {"en": {"document": "facilitator", "lang": "en", "title": "Teach, question and give useful feedback", "subtitle": "Facilitator script, worked answers and formative assessment", "sources": ["C1", "P1", "P2"], "pages": [{"id": "f01", "lesson": "O", "kicker": "Facilitator preparation and live timetable", "title": "Run a focused 180-minute class", "blocks": [{"type": "p", "text": "Prepare the learner guide, workbook and answer guide. Learners need a calculator and space to write; the case works offline. Keep the answers separate. Invite oral or typed responses and provide thinking time before asking for volunteers. Practice, feedback and assessment should serve the stated objectives. [P1]"}, {"type": "table", "headers": ["Elapsed minutes", "Activity", "Knowledge check included"], "rows": [["0–10", "Orientation", "Starting hypothesis"], ["10–25", "L1 · Promise", "Q01–Q02"], ["25–45", "L2 · Missing means", "Q03–Q04"], ["45–65", "L3 · Arrangement", "Q05–Q06"], ["65–85", "L4 · Costs and cash", "Q07–Q08"], ["85–95", "Break", ""], ["95–115", "L5 · Verification", "Q10"], ["115–130", "L6 · Comparison", "Q11"], ["130–165", "L7 · Capstone", "Q09 after K5"], ["165–180", "L8 · Successor", "Q12 and next action"]], "widths": [0.22, 0.39, 0.39]}, {"type": "p", "text": "**Orientation:** 0–2 minutes, ask what the customer must still receive after a disruption. At 2–6, learners write their starting hypothesis and choose roles. At 6–10, introduce the fictional case and distinguish a useful tabletop decision from actual business performance."}, {"type": "callout", "label": "Time boundary", "text": "The twelve questions are distributed inside the lesson times. An optional pretest, repeated posttest or later follow-up adds time; it is not silently included in these 180 minutes."}]}, {"id": "f02", "lesson": "REF", "kicker": "Instructor case key · all facts are invented", "title": "Keep one stable case throughout", "blocks": [{"type": "p", "text": "Printer A buys the continuity service from the coordinator. Printer B supplies the alternate production. The original customer receives the labels; Morgan is its acceptance lead. The customer’s original invoice is outside the service ledger."}, {"type": "table", "headers": ["Record", "Authoritative teaching facts"], "rows": [["K0 / P1", "10,000 labels; artwork v3; matte white self-adhesive stock; 50 × 30 mm ±0.5 mm; readable approved code; damaged units excluded; no partial acceptance."], ["Place / deadline", "Montréal warehouse, dock 3, M1; Thursday 12 November 2026, 16:00, America/Toronto; received and accepted by Morgan."], ["K1 / A-02 / C-01", "Checkpoint Tuesday 10 November 12:00: 8,000. Authorized amendment Tuesday 14:00: +2,000. Separate custodian log covers through Wednesday 11 November 12:00; no other changes."], ["K2", "12,000 qualified units less 2,000 protected = 10,000. Extra simultaneous request: 5,000."], ["K3", "CONS-A, CONS-M, RES-B: simulated activation, limited data consent and 10,000-unit reservation; separate packet/release access."], ["K4", "Fee 5,600; complete cost 5,000; 4,700 due first; opening cash 1,200; advance 3,500 included in fee; conditional balance 2,100."]], "widths": [0.22, 0.78]}, {"type": "p", "text": "K5 supplies failed R1 and an explicit 300 inspection invoice. K6 supplies a separate positive-control R2 from a fresh assumed starting state. The workbook prints all cards. Treat their claims as scenario assumptions; they do not authenticate any real customer, payment or product."}]}, {"id": "f03", "lesson": "L1", "kicker": "10–25 minutes · output: Promise card", "title": "Teach acceptance before recovery", "blocks": [{"type": "p", "text": "**Objective:** learners write a promise that another person can use to accept or reject the result. Begin with the customer, not the failed application. [C1, pp. 7–8]"}, {"type": "numbered", "items": ["0–3 minutes: read K0. Ask, “If the server restarts but the customer receives nothing, what succeeded?” Elicit the difference between a means and the accepted result.", "3–8: learners complete the Promise card. Ask the customer role to specify quantity, specification, clock, location and decision authority.", "8–12: exchange cards. Test one short shipment and one late shipment; revise unclear wording.", "12–15: answer Q01–Q02, reveal the explanations and ask one learner to justify a correction."]}, {"type": "callout", "label": "Worked answer", "text": "P1 requires 10,000 conforming labels, artwork v3 and the stated material/dimensions/quality, received and accepted by Morgan at M1 by 12 November 2026, 16:00 America/Toronto. Partial acceptance is excluded. A timestamped receipt, inspection/count record and authorized acceptance are required."}, {"type": "callout", "label": "If learners say “98% is close enough”", "text": "Ask whether the original agreement permits that tolerance. It does not. A later compromise can be negotiated, but the original promise still failed. Record the new agreement as a new version, not a correction of history."}, {"type": "p", "text": "**Observe:** the card makes the rejection decidable. For participants’ own businesses, an unknown authority or deadline is a gap to resolve, not permission for the class to invent one."}]}, {"id": "f04", "lesson": "L2", "kicker": "25–45 minutes · output: Route card", "title": "Turn an obstacle into a constructed route", "blocks": [{"type": "p", "text": "**Objective:** identify the missing complements and specify a usable way to construct or obtain them. Continuity requires records, rights, capacity and coordination to work together. [C1, pp. 9–13]"}, {"type": "numbered", "items": ["0–4 minutes: show the 8,000 checkpoint and A-02. Ask which source changes what is owed and why the cutoff matters.", "4–10: pairs build the Route card. Require a concrete output, owner, access route and completion check for each missing means.", "10–17: introduce the shared unavailable artwork login and extra 5,000-unit request. Have teams revise their route and capacity decision.", "17–20: answer Q03–Q04 and give corrective feedback."]}, {"type": "table", "headers": ["Problem", "Worked construction"], "rows": [["Missing amendment", "Reconcile 8,000 + authorized 2,000 = 10,000; check C-01 coverage, origin and authority."], ["Shared unavailable login", "Build an authorized current production packet and release channel accessible outside that failure."], ["Concurrent demand", "2,000 + 10,000 + 5,000 = 17,000 against 12,000. Decline or condition the extra request unless new qualified capacity is evidenced."]], "widths": [0.3, 0.7]}, {"type": "callout", "label": "Coach for specificity", "text": "“Find another supplier” is incomplete. Ask what that supplier must receive, be permitted to do and reserve. A useful answer may create a new packet, reservation protocol or coordination service; include the labor, cost and failure conditions of creating it."}, {"type": "p", "text": "Do not treat a matching checksum as proof that all accepted changes were captured."}]}, {"id": "f05", "lesson": "L3", "kicker": "45–65 minutes · output: Arrangement map", "title": "Make the offer worth accepting", "blocks": [{"type": "p", "text": "**Objective:** connect each participant’s contribution, benefit and voluntary commitment. A technically possible route may still be unacceptable or commercially unworkable. [C1, pp. 11–13, 17–18]"}, {"type": "numbered", "items": ["0–4 minutes: assign buyer, provider, customer, coordinator and reviewer roles. Read K3’s initial interest-only position.", "4–10: let each role say what it gives, needs and can refuse. Capture missing terms before revealing the K3 update.", "10–17: use CONS-A, CONS-M and RES-B to complete the arrangement. Ask the buyer to challenge price, advance and failure risk; accept a reasoned counteroffer or no-buy decision.", "17–20: answer Q05–Q06 and distinguish interest, commitment and usable capacity."]}, {"type": "callout", "label": "Worked arrangement", "text": "A buys a scoped continuity service from the coordinator; B commits the qualified 10,000-unit slot. The customer permits only the P1 artwork/specification/quantity/destination to B and the coordinator, without onward sharing. Copies are deleted seven days after case closure. Morgan retains acceptance authority. The packet and release channel work separately from the failed login."}, {"type": "p", "text": "The reviewer needs source access, a defined method and disclosed relationships/incentives. One person may hold multiple roles, but that limits the independence claim."}, {"type": "callout", "label": "Useful challenge", "text": "“Why would A accept an advance that may pay nonrecoverable costs without full delivery?” Do not force agreement. Compare direct supplier purchase, different risk allocation, finance or no purchase. Changed terms require a new cost/cash check; willingness assumed in the case is not observed demand."}]}, {"id": "f06", "lesson": "L4", "kicker": "65–85 minutes · first 8 minutes · cost answers", "title": "Separate margin from available funds", "blocks": [{"type": "p", "text": "**Objective:** calculate complete modeled cost, projected contribution and the payment-date gap without double-counting receipts. Use the six supplied costs; do not add the original customer invoice. [C1, pp. 17–19]"}, {"type": "table", "headers": ["Supplied modeled cost", "CAD"], "rows": [["Alternate production", "3,200"], ["Prepared and checked packet", "550"], ["Transport", "400"], ["Coordination and allocated overhead", "350"], ["Readiness test", "200"], ["Final inspection", "300"], ["Complete modeled cost", "5,000"]], "widths": [0.78, 0.22]}, {"type": "p", "text": "**0–3 minutes:** let learners calculate before revealing totals. **3–8:** compare answers and ask which costs a real service ledger would still need to investigate. The case assumes this scope complete; real acquisition, internal time, failed trials, support, financing, insurance, refund duties and other items cannot be silently omitted."}, {"type": "callout", "label": "Worked arithmetic", "text": "Fee 5,600 − cost 5,000 = projected contribution 600. The first five costs total 4,700 before acceptance. Opening uncommitted cash is 1,200. The original plan therefore lacks 3,500 before it can make those commitments."}, {"type": "callout", "label": "Misconception to repair", "text": "“It makes 600, so it can pay.” Ask for the balance at the next payment date. Profitability on paper and timely funding are different conditions. The 600 is modeled, not realized profit."}, {"type": "p", "text": "Continue on the next page for minutes 8–20 of this same lesson; the two pages do not add teaching time."}]}, {"id": "f07", "lesson": "L4", "kicker": "L4 minutes 8–20 · cash and terms answers", "title": "Close the gap without inventing money", "blocks": [{"type": "p", "text": "At 8–11 minutes, reveal K4’s voluntarily agreed simulated advance and its restrictions. At 11–17, learners complete the favorable branch and challenge the terms. At 17–20, answer Q07–Q08. Then take the scheduled ten-minute break."}, {"type": "table", "headers": ["Favorable teaching branch", "Change", "Cash"], "rows": [["Opening uncommitted funds", "", "1,200"], ["Advance received", "+3,500", "4,700"], ["Preacceptance costs paid", "−4,700", "0"], ["Full acceptance; balance received", "+2,100", "2,100"], ["Final inspection paid", "−300", "1,800"]], "widths": [0.62, 0.18, 0.2]}, {"type": "p", "text": "The advance is included in 5,600, not an extra 3,500 of revenue. Ending cash of 1,800 equals starting money of 1,200 plus modeled contribution of 600. This path requires full acceptance, receipt of the balance and payment of all 5,000 costs."}, {"type": "callout", "label": "Terms are part of the design", "text": "The advance may offset authorized, documented nonrecoverable preacceptance costs; unspent funds are refundable. The balance is due only after full acceptance. A proposed advance is unavailable until received and usable under those terms. Do not assume every real buyer would accept this allocation."}, {"type": "p", "text": "K5 later creates an explicit failure invoice: 300 is due even after rejection. Its treatment is part of the failed branch, not an excuse to count the conditional 2,100. If learners propose financing or revised milestones, ask who agrees, when funds arrive and what obligations remain."}]}, {"id": "f08", "lesson": "L5", "kicker": "95–115 minutes · output: Claim and evidence record", "title": "Make the verification claim precise", "blocks": [{"type": "p", "text": "**Objective:** separate evidence about records, readiness, outcomes and commerce; explain the limits of independence. [C1, pp. 13–14]"}, {"type": "numbered", "items": ["0–4 minutes: ask what the supplied records establish and which real-world facts they do not establish.", "4–11: groups complete the claim table. Ask for an evidence ID and a boundary beside every favorable statement.", "11–18: another learner challenges one conclusion. Discuss raw sources, source custody, control of execution and organizational incentives.", "18–20: answer Q10. Keep Q09 for after the K5 capstone reveal."]}, {"type": "table", "headers": ["Claim at this stage", "Defensible teaching answer"], "rows": [["Reconstructed obligation", "10,000 within supplied K1 assumptions; real source authentication remains outside the class."], ["Fallback readiness", "Conditional on the complete K2–K4 arrangement and stated assumptions; not observed physical execution."], ["Actual customer delivery", "NOT ESTABLISHED; no actual goods exist in the course."], ["Real commercial value", "NOT ESTABLISHED; case payments and cost scope are simulated."]], "widths": [0.34, 0.66]}, {"type": "callout", "label": "Challenge the checker", "text": "A separate code path can reduce some shared implementation risks; it does not by itself establish institutional independence. A paid reviewer should disclose relationships and incentives. Ask what source assertions remain trusted and what a fresh check would need."}, {"type": "p", "text": "Do not mark an unknown “FAILED” merely because evidence is absent. Conversely, a demonstrated shortfall is not just an unknown. These distinctions make the Passport useful to its next reader."}]}, {"id": "f09", "lesson": "L6", "kicker": "115–130 minutes · output: Comparison card", "title": "Compare the best complete alternatives", "blocks": [{"type": "p", "text": "**Objective:** design a comparison that could change a buyer’s decision. No measured route advantage is supplied by this course. [C1, pp. 19–20]"}, {"type": "numbered", "items": ["0–3 minutes: nominate a competent conventional operations team as the baseline. Give it the same approved packet, provider, capacity and funding.", "3–9: pairs choose outcome, full-cost and effort measures. Include human rescue, setup, repeated attempts and remaining duties.", "9–14: challenge one unfair comparison and decide what evidence would support purchase, revision or no purchase.", "14–15: answer Q11 and state why the correct choice permits a conventional winner."]}, {"type": "table", "headers": ["Keep equivalent", "Observe separately"], "rows": [["Customer promise and difficulty", "Correct accepted units, quality and time"], ["Usable records, permissions and provider", "Missing/duplicate obligations and interventions"], ["Starting capacity, funds and access to help", "Complete cost, staff time, construction and remaining duties"]], "widths": [0.5, 0.5]}, {"type": "callout", "label": "Worked answer", "text": "“We will compare the conventional team and the proposed method on P1 using the same facts and resources. We will record accepted results, all effort and complete costs. An AI-assisted route that was not executed stays NOT RUN. A cheaper equally capable route wins.”"}, {"type": "p", "text": "A baseline denied the amendment or qualified provider is not equally equipped. A software runtime alone does not price a complete service. A favorable estimated price may justify a next test; it does not establish measured superiority or actual willingness to pay."}]}, {"id": "f10", "lesson": "L7", "kicker": "130–165 minutes · 35-minute facilitation script", "title": "Run the capstone as a sequence of decisions", "blocks": [{"type": "p", "text": "Have learners cover K5–K6. The exercise combines earlier work; it is not a surprise-memory test. Require a decision, owner and evidence at each stage. Role-play consent applies only within this tabletop."}, {"type": "table", "headers": ["Capstone minute", "Release / task", "Watch for"], "rows": [["0–4", "Read P1; choose roles and scope", "Unchanged acceptance conditions"], ["4–10", "K1–K3: construct route and exchange", "Source coverage; shared login; 5,000 conflict"], ["10–15", "K4: price, terms and funding", "Advance included in fee; genuine buyer choice"], ["15–22", "Release K5: adjudicate R1", "9,800; balance withheld; 300 due"], ["22–28", "Optional K6: separate positive control", "Fresh assumed state; do not erase R1"], ["28–34", "Passport; peer rubric; one revision", "Bounded claims and preserved liabilities"], ["34–35", "Q09 and one-sentence debrief", "The next decision follows the evidence"]], "widths": [0.2, 0.42, 0.38]}, {"type": "p", "text": "If time is tight, use minutes 22–28 to strengthen the R1 decision and mark R2 NOT RUN. Do not invent a favorable result to finish the worksheet. A team can rationally reject K4’s terms and retain an unfunded route; assess the reasoning."}, {"type": "callout", "label": "One helpful prompt at a time", "text": "“What exactly blocks the next step?” Then: “What could you construct or negotiate to remove that block?” Finally: “Which evidence would let somebody else decide?” Avoid giving the whole answer before learners try."}, {"type": "p", "text": "The next two pages give the worked branch decisions. Keep them out of learner view until feedback."}]}, {"id": "f11", "lesson": "L7", "kicker": "Answer guide · K5 / R1", "title": "Preserve the failed result and its costs", "blocks": [{"type": "callout", "label": "Customer outcome", "text": "R1 records 9,800 conforming labels at 15:40. The time and specification do not cure the 200-unit shortfall. P1 requires 10,000 and forbids partial acceptance. Verdict: FAILED for the R1 tabletop customer outcome. Actual physical delivery remains NOT ESTABLISHED."}, {"type": "table", "headers": ["R1 financial fact", "Worked answer"], "rows": [["Opening funds + advance", "1,200 + 3,500 = 4,700 available in the simulation."], ["Preacceptance costs paid", "4,700 paid; remaining cash = 0."], ["Conditional balance", "2,100 is not due or received without full acceptance."], ["Inspection failure invoice", "300 is due under K5’s explicit trigger; its funding is missing."], ["Advance/refund basis", "K5 says the 3,500 funded documented eligible nonrecoverable costs. No unspent advance is shown; do not infer absence of all other duties."]], "widths": [0.32, 0.68]}, {"type": "p", "text": "The team should hold further commitments, preserve the invoice and request an authorized resolution. It may propose a funded repair, negotiated settlement or another complete route. It must price and authorize that next action; no repair agreement is supplied."}, {"type": "callout", "label": "What not to repair on paper", "text": "Do not reduce P1 to 9,800, book the full 5,600 fee, count the conditional 2,100 as available, or borrow R2’s hypothetical ending cash. Record remaining repair duties and uncertainty; the class does not invent a liability-free settlement."}, {"type": "p", "text": "A sound failure record is useful work. It identifies the unpaid 300 and the decision needed before more promises are made."}]}, {"id": "f12", "lesson": "L7", "kicker": "Answer guide · optional K6 / R2", "title": "Pass the exercise without overstating it", "blocks": [{"type": "p", "text": "R2 is a **separate positive-control tabletop branch from a fresh assumed starting state**. It has its own simulated approval and mock receipt. It is not evidence that the actual R1 operation was repaired or rerun."}, {"type": "callout", "label": "Scoped outcome", "text": "The new mock receipt records all 10,000 conforming labels accepted by Morgan at M1 at 15:40, before the 16:00 deadline. Another learner checks the supplied records. Verdict: DEMONSTRATED for the stated R2 tabletop acceptance claim, subject to its printed assumptions."}, {"type": "table", "headers": ["R2 claim", "Boundary"], "rows": [["Modeled cash completion", "1,200 + 3,500 − 4,700 + 2,100 − 300 = 1,800. All 5,000 modeled costs paid."], ["Modeled contribution", "600; the other 1,200 of ending cash is starting money."], ["Actual physical delivery", "NOT ESTABLISHED: the labels and receipt are simulated."], ["Real commercial value", "NOT ESTABLISHED: no real buyer, cleared payment or observed complete cost."], ["Independence", "Peer checking inside a class; disclose roles, method and trusted scenario facts."]], "widths": [0.34, 0.66]}, {"type": "p", "text": "Keep R1’s failed verdict, costs, debt and unresolved duties alongside R2. Do not add the branch cash balances together. An actual successor run would need fresh consent, real available capacity and funds, and explicit treatment of the earlier obligations."}, {"type": "callout", "label": "Debrief question", "text": "“What improved: the quality of our exercise record, the actual business outcome, or both?” Only the first has evidence in this classroom."}]}, {"id": "f13", "lesson": "L7", "kicker": "Formative performance rubric · maximum 12", "title": "Score the work, then improve it", "blocks": [{"type": "p", "text": "Use 0 = absent or materially wrong; 1 = partly correct but missing a material element; 2 = the supported anchor below. Cite something in the learner’s work for each score. This course-designed rubric is unvalidated and does not certify operational readiness."}, {"type": "table", "headers": ["Criterion", "Anchor for 2 points"], "rows": [["Promise", "Preserves quantity, specification, deadline, place and authorized acceptance; no retrospective easing."], ["Constructed means", "Reconciles amendment/cutoff; supplies a permitted packet and access route; resolves the capacity conflict."], ["Voluntary arrangement", "Names buyer/seller/provider/beneficiary; records consent, reservation, price and failure/refund terms."], ["Cost and cash", "Shows 5,000 cost, 3,500 initial gap, included advance, conditional 2,100, R1’s unpaid 300 and separate R2 cash."], ["Evidence and verdict", "R1 fails; R2 is scoped tabletop only; real delivery/market remain unestablished; checker limits are disclosed."], ["Comparison and next decision", "Uses a capable equally equipped baseline, counts complete effort and proposes an evidence-based next action."]], "widths": [0.3, 0.7]}, {"type": "callout", "label": "Mandatory correction before closing", "text": "Ask for revision if the learner erases R1, treats the advance as extra revenue, counts the 2,100 after rejection, or calls mock delivery/payments real. A high total does not cancel these errors."}, {"type": "p", "text": "Peer and facilitator scores may differ. Discuss the evidence rather than treating the number as objective truth. Record one specific revision and, if useful, a revised score. Report knowledge-check and performance scores separately; do not combine them into a resilience rating."}]}, {"id": "f14", "lesson": "L8", "kicker": "165–180 minutes · output: Reuse test and Next action", "title": "Transfer a capability, then test its value", "blocks": [{"type": "p", "text": "**Objective:** propose a distinct next use and a comparison that could establish the retained capability’s contribution. Reuse, repeat demand and an improved discovery process are different claims. [C1, p. 21]"}, {"type": "numbered", "items": ["0–4 minutes: name an artifact or method worth retaining and its rights, costs and known limits.", "4–9: apply it to a different promise. Ask what must change and how a competent team without that retained capability would approach the same task.", "9–13: complete a specific next action, owner, evidence requirement and review date. Invite one changed starting hypothesis.", "13–15: answer Q12, collect one useful course improvement and close."]}, {"type": "callout", "label": "Worked example", "text": "Retain the versioned obligation format and source-review procedure. Test them with a tool-rental company honoring bookings after a scheduling outage. Define the new accepted result, permissions and capacity rules. Compare with and without the retained method using equivalent starting information and resources; include adaptation, requalification and human effort."}, {"type": "p", "text": "No successor was executed in this course. Mark the proposed test NOT RUN. A second sale of the same label service would instead inform repeat demand; it would not alone establish that the retained method enables a different task."}, {"type": "callout", "label": "Constructive next step", "text": "A learner may draft one real promise card or identify its acceptance owner. Actual activation still needs fresh permission, sources, capacity and funding. A completed course form is not authority to act."}]}, {"id": "f15", "lesson": "REF", "kicker": "Knowledge-check answer key · one point per question", "title": "Answers 1–4", "blocks": [{"type": "heading", "text": "Q01 · C"}, {"type": "p", "text": "**Morgan receives and accepts 10,000 conforming v3 labels at site M1 by the deadline.** The promise concerns the customer’s accepted result: quantity, specification, place and time. A restart or dispatch may support the route but does not establish receipt and acceptance. In this course, even a matching mock receipt establishes only the tabletop result."}, {"type": "heading", "text": "Q02 · A"}, {"type": "p", "text": "**Failed against P1; record any new agreement separately.** The original acceptance conditions remain authoritative. A later compromise or a new run may be useful, but it cannot change the historical result. The shortfall is 200 labels."}, {"type": "heading", "text": "Q03 · B"}, {"type": "p", "text": "**10,000, after checking the amendment’s authority and coverage through the cutoff.** 8,000 + 2,000 = 10,000. The amendment matters because it changes what is owed. Source origin, authority and completeness through the agreed cutoff still need checking; a matching checksum does not establish those facts."}, {"type": "heading", "text": "Q04 · B"}, {"type": "p", "text": "**Build and test an authorized, separately accessible current packet and release channel.** A second supplier does not remove a shared dependency. The useful intervention creates a permitted, current and usable way to obtain and release the right work. Its construction, rights and cost belong in the service."}]}, {"id": "f16", "lesson": "REF", "kicker": "Knowledge-check answer key · one point per question", "title": "Answers 5–8", "blocks": [{"type": "heading", "text": "Q05 · C"}, {"type": "p", "text": "**Total demand is 17,000 against 12,000; both cannot receive unconditional coverage.** Protected work and simultaneous promises share the same resource. The new request adds a 5,000-unit shortfall. A qualified additional slot, a voluntarily agreed priority rule or a declined request may solve it; silently double-booking does not."}, {"type": "heading", "text": "Q06 · A"}, {"type": "p", "text": "**Interest; a usable reservation and its terms still need confirmation.** Willingness, authorized commitment, usable capacity and collected payment are different evidence states. The parties must voluntarily settle the product, window, rights, price, activation and failure terms."}, {"type": "heading", "text": "Q07 · B"}, {"type": "p", "text": "**CAD 600.** 5,600 − 5,000 = 600. Ending cash of 1,800 on the favorable teaching branch includes 1,200 of starting money. Neither calculation is observed profit or real market evidence."}, {"type": "heading", "text": "Q08 · C"}, {"type": "p", "text": "**The gap is CAD 3,500; CAD 2,100 remains conditional on full acceptance.** The advance closes this modeled gap only when received and available under the agreed terms. It is part of the fee, not extra revenue. Restrictions, refund duties and payment conditions remain relevant."}]}, {"id": "f17", "lesson": "REF", "kicker": "Knowledge-check answer key · one point per question", "title": "Answers 9–12", "blocks": [{"type": "heading", "text": "Q09 · A"}, {"type": "p", "text": "**P1 failed in the tabletop; do not count the conditional CAD 2,100; record the unpaid inspection and next decision.** A mock receipt of 9,800 does not meet the 10,000-unit promise. K5 makes the CAD 300 inspection charge due despite failure; its funding is missing. Actual goods, actual payment and real commercial value remain not established."}, {"type": "heading", "text": "Q10 · B"}, {"type": "p", "text": "**Disclose the relationship, method, source custody and limits; assess independence for the particular claim.** Independent checking has several dimensions. Separate code, protected source evidence, control of execution and organizational incentives are not interchangeable. A reviewer’s report must identify what was checked and what remains trusted or unknown."}, {"type": "heading", "text": "Q11 · C"}, {"type": "p", "text": "**Use the same promise, usable records and resources; count complete costs and human work; allow a conventional winner.** A capable conventional route is the relevant baseline. An AI-assisted route must actually run before its performance is claimed. Quote, modeled estimate and measured result must remain distinguishable; no purchase can be the rational choice."}, {"type": "heading", "text": "Q12 · A"}, {"type": "p", "text": "**A fresh distinct task compared with and without that capability under equivalent resources, including adaptation costs.** Retention creates a candidate capability, not proof of its contribution. The next use needs its own promise, rights, funding and evidence. Repeat demand, successor enablement and improvement of the discovery process are different claims."}]}, {"id": "f18", "lesson": "REF", "kicker": "Feedback, self-study and responsible transfer", "title": "Make the learning useful after the class", "blocks": [{"type": "p", "text": "Give one point per correct knowledge-check answer, maximum 12. Keep the first responses and any corrected responses separate. Use the pattern of errors to choose the next explanation or exercise. The score describes responses to these twelve questions; it does not measure business resilience."}, {"type": "callout", "label": "A practical feedback conversation", "text": "Name the decision the learner made well, point to its evidence, identify one material gap, and ask for a revised action. For example: “Your capacity calculation protects the existing 2,000. Your funding line still counts 2,100 before acceptance. What can be committed with the cash actually available?”"}, {"type": "p", "text": "For self-study, cover the answers, complete each workbook task, then compare your reasoning with the key. Use K5 before K6. If working alone, record the absence of an independent peer check rather than inventing one."}, {"type": "p", "text": "Ask learners which preparation step they intend to use, what may prevent it and what support they need. A later review can examine whether that work was applied. End-of-course proficiency alone does not establish learning gain; satisfaction alone does not establish effectiveness. [P2]"}, {"type": "callout", "label": "Optional follow-up — outside the 180 minutes", "text": "Agree a later review date. Examine a permitted, anonymized promise card or decision record; ask what changed, what evidence was obtained and what remains blocked. New real-world action still needs its own approvals and resources. A repeated quiz or transfer review is optional extra time."}, {"type": "p", "text": "Record attendance or course completion only as such. This course issues no operational certification, accreditation, safety approval or guarantee."}]}]}, "fr": {"document": "facilitator", "lang": "fr", "title": "Animer, questionner et faire progresser", "subtitle": "Scénario d’animation, corrigés et évaluation formative", "sources": ["C2", "P1", "P2"], "pages": [{"id": "f01", "lesson": "O", "kicker": "Préparation et déroulement de la séance", "title": "Animer une séance ciblée de 180 minutes", "blocks": [{"type": "p", "text": "Préparer guide d’apprentissage, cahier et corrigé. Prévoir calculatrice et espace de rédaction; le cas fonctionne hors ligne. Séparer les réponses. Accepter des réponses orales ou écrites et laisser réfléchir avant de solliciter des volontaires. Exercices, retours et évaluation servent les objectifs annoncés. [P1]"}, {"type": "table", "headers": ["Minutes écoulées", "Activité", "Questions incluses"], "rows": [["0–10", "Orientation", "Hypothèse initiale"], ["10–25", "L1 · Promesse", "Q01–Q02"], ["25–45", "L2 · Moyens manquants", "Q03–Q04"], ["45–65", "L3 · Arrangement", "Q05–Q06"], ["65–85", "L4 · Coûts et fonds", "Q07–Q08"], ["85–95", "Pause", ""], ["95–115", "L5 · Vérification", "Q10"], ["115–130", "L6 · Comparaison", "Q11"], ["130–165", "L7 · Mise en situation", "Q09 après K5"], ["165–180", "L8 · Successeur", "Q12 et prochaine action"]], "widths": [0.22, 0.39, 0.39]}, {"type": "p", "text": "**Orientation :** minutes 0–2, demander ce que le client doit encore recevoir après une perturbation. De 2 à 6, faire écrire l’hypothèse initiale et choisir les rôles. De 6 à 10, présenter le cas fictif et distinguer une décision de simulation utile d’une performance réelle."}, {"type": "callout", "label": "Périmètre temporel", "text": "Les douze questions sont réparties dans les leçons. Un prétest facultatif, un nouveau posttest ou un suivi ultérieur ajoute du temps; il n’est pas implicitement compris dans les 180 minutes."}]}, {"id": "f02", "lesson": "REF", "kicker": "Clé du cas · tous les faits sont inventés", "title": "Garder un cas stable du début à la fin", "blocks": [{"type": "p", "text": "A achète le service de continuité au coordinateur. B assure la production de relève. Le client initial reçoit les étiquettes; Morgan est responsable de son acceptation. La facture initiale du client est exclue du registre du service."}, {"type": "table", "headers": ["Pièce", "Faits pédagogiques de référence"], "rows": [["K0 / P1", "10 000 étiquettes; visuel v3; support blanc mat autocollant; 50 × 30 mm ±0,5 mm; code approuvé lisible; unités endommagées exclues; aucune acceptation partielle."], ["Lieu / échéance", "Entrepôt de Montréal, quai 3, M1; jeudi 12 novembre 2026 à 16 h, America/Toronto; réception et acceptation par Morgan."], ["K1 / A-02 / C-01", "Reprise mardi 10 novembre à 12 h : 8 000. Modification autorisée mardi à 14 h : +2 000. Registre distinct jusqu’au mercredi 11 novembre à 12 h; aucun autre changement."], ["K2", "12 000 qualifiées moins 2 000 protégées = 10 000. Demande simultanée supplémentaire : 5 000."], ["K3", "CONS-A, CONS-M, RES-B : lancement simulé, partage limité, réservation de 10 000; accès distinct au dossier et au lancement."], ["K4", "Prix 5 600; coût complet 5 000; 4 700 dus d’abord; fonds initiaux 1 200; avance 3 500 comprise dans le prix; solde conditionnel 2 100."]], "widths": [0.22, 0.78]}, {"type": "p", "text": "K5 fournit l’échec R1 et une facture explicite de 300. K6 fournit un témoin positif R2 distinct, à partir d’un nouvel état initial supposé. Toutes les cartes figurent dans le cahier. Ce sont des hypothèses de scénario, sans authentification de client, paiement ou produit réels."}]}, {"id": "f03", "lesson": "L1", "kicker": "10–25 minutes · résultat : Fiche de promesse", "title": "Enseigner l’acceptation avant la reprise", "blocks": [{"type": "p", "text": "**Objectif :** écrire une promesse permettant à une autre personne d’accepter ou de refuser le résultat. Partir du client, avant l’application en panne. [C2, pp. 7–9]"}, {"type": "numbered", "items": ["0–3 minutes : lire K0. Demander ce qui a réussi si le serveur redémarre mais que le client ne reçoit rien. Distinguer moyen et résultat accepté.", "3–8 : remplir la fiche. Le rôle client précise quantité, spécification, heure, lieu et autorité de décision.", "8–12 : échanger les fiches. Éprouver une livraison incomplète puis tardive; corriger les formulations ambiguës.", "12–15 : répondre à Q01–Q02, dévoiler les explications et faire justifier une correction."]}, {"type": "callout", "label": "Corrigé", "text": "P1 exige 10 000 étiquettes conformes, visuel v3 et matériau/dimensions/qualité prévus, reçues et acceptées par Morgan à M1 le 12 novembre 2026 avant 16 h, America/Toronto. Aucune acceptation partielle. Exiger réception horodatée, décompte, contrôle qualité et acceptation autorisée."}, {"type": "callout", "label": "Si l’on juge « 98 % suffisant »", "text": "Demander si l’accord initial autorise cette tolérance. Ce n’est pas le cas. Un compromis ultérieur reste négociable, mais la promesse initiale a échoué. Le nouvel accord constitue une nouvelle version, sans réécrire l’histoire."}, {"type": "p", "text": "**À observer :** la fiche permet de trancher le refus. Pour leur entreprise, les participants doivent résoudre une autorité ou une échéance inconnue; la classe ne les invente pas."}]}, {"id": "f04", "lesson": "L2", "kicker": "25–45 minutes · résultat : Fiche de réalisation", "title": "Transformer l’obstacle en solution construite", "blocks": [{"type": "p", "text": "**Objectif :** identifier les compléments manquants et définir comment les construire ou les obtenir. Sources, droits, capacité et coordination doivent fonctionner ensemble. [C2, pp. 9–13]"}, {"type": "numbered", "items": ["0–4 minutes : montrer la reprise à 8 000 et A-02. Demander quelle source modifie l’engagement et pourquoi la borne compte.", "4–10 : construire la fiche à deux. Exiger résultat concret, responsable, accès et contrôle d’achèvement pour chaque moyen manquant.", "10–17 : introduire l’accès commun indisponible et la demande de 5 000 supplémentaires. Réviser la solution et la décision de capacité.", "17–20 : répondre à Q03–Q04 et expliquer les corrections."]}, {"type": "table", "headers": ["Problème", "Construction attendue"], "rows": [["Modification absente", "8 000 + 2 000 autorisées = 10 000; vérifier couverture, origine et autorité de C-01."], ["Accès commun indisponible", "Créer un dossier de production actuel et un canal de lancement autorisés, accessibles hors de cette panne."], ["Demandes simultanées", "2 000 + 10 000 + 5 000 = 17 000 pour 12 000. Refuser ou conditionner la demande supplémentaire sans capacité qualifiée nouvelle."]], "widths": [0.3, 0.7]}, {"type": "callout", "label": "Demander du concret", "text": "« Trouver un autre fournisseur » ne suffit pas. Que doit-il recevoir, être autorisé à faire et réserver? La solution peut créer dossier, protocole de réservation ou service de coordination. Compter travail, coût et conditions d’échec de cette construction."}, {"type": "p", "text": "Une empreinte concordante ne prouve pas que toutes les modifications acceptées ont été capturées."}]}, {"id": "f05", "lesson": "L3", "kicker": "45–65 minutes · résultat : Carte de l’arrangement", "title": "Construire une offre que l’on veut accepter", "blocks": [{"type": "p", "text": "**Objectif :** relier contribution, intérêt et engagement volontaire de chacun. Une voie techniquement possible peut rester inacceptable ou économiquement impraticable. [C2, pp. 12–13, 18–19]"}, {"type": "numbered", "items": ["0–4 minutes : répartir acheteur, prestataire, client, coordinateur et évaluateur. Lire la situation initiale de K3 : simple intérêt.", "4–10 : chaque rôle dit ce qu’il apporte, exige et peut refuser. Noter les conditions manquantes avant la mise à jour K3.", "10–17 : compléter avec CONS-A, CONS-M et RES-B. L’acheteur conteste prix, avance et risque d’échec; accepter une contre-offre ou un refus raisonné.", "17–20 : répondre à Q05–Q06; distinguer intérêt, engagement et capacité utilisable."]}, {"type": "callout", "label": "Arrangement attendu", "text": "A achète un service délimité au coordinateur; B réserve 10 000 unités qualifiées. Le client permet seulement le partage des visuel/spécification/quantité/destination P1 avec B et le coordinateur, sans retransmission. Supprimer les copies sept jours après clôture. Morgan garde l’autorité d’acceptation. Dossier et lancement restent accessibles sans l’accès défaillant."}, {"type": "p", "text": "L’évaluateur doit disposer des sources et d’une méthode, avec liens et incitations déclarés. Cumuler des rôles limite l’affirmation d’indépendance."}, {"type": "callout", "label": "Objection utile", "text": "Pourquoi A accepterait-il une avance couvrant des coûts non récupérables sans livraison complète? Ne pas imposer l’accord. Comparer achat direct, répartition du risque, financement ou absence d’achat. Tout changement exige un nouveau calcul. La volonté supposée dans le cas n’est pas une demande observée."}]}, {"id": "f06", "lesson": "L4", "kicker": "65–85 minutes · premières 8 minutes · coûts", "title": "Séparer contribution et fonds disponibles", "blocks": [{"type": "p", "text": "**Objectif :** calculer coût complet, contribution prévue et manque à l’échéance sans compter deux fois les recettes. Utiliser les six coûts fournis; exclure la facture du client initial. [C2, pp. 18–20]"}, {"type": "table", "headers": ["Coût modélisé fourni", "CAD"], "rows": [["Production de relève", "3 200"], ["Dossier préparé et vérifié", "550"], ["Transport", "400"], ["Coordination et frais généraux affectés", "350"], ["Essai de préparation", "200"], ["Inspection finale", "300"], ["Coût complet modélisé", "5 000"]], "widths": [0.78, 0.22]}, {"type": "p", "text": "**Minutes 0–3 :** calculer avant de montrer les totaux. **3–8 :** comparer et demander ce qu’un registre réel doit encore examiner. Le périmètre fourni est supposé complet ici; prospection, temps interne, essais ratés, soutien, financement, assurance, remboursements et autres coûts ne peuvent être omis silencieusement en pratique."}, {"type": "callout", "label": "Calcul attendu", "text": "Prix 5 600 − coût 5 000 = contribution prévue 600. Les cinq premières lignes totalisent 4 700 avant acceptation. Les fonds initiaux libres sont de 1 200. Il manque donc 3 500 au plan initial avant ces engagements."}, {"type": "callout", "label": "Idée à corriger", "text": "« Cela rapporte 600, donc on peut payer. » Demander le solde à la prochaine échéance. Rentabilité sur papier et financement à temps sont deux conditions distinctes. Les 600 sont modélisés, sans bénéfice réalisé."}, {"type": "p", "text": "La page suivante couvre les minutes 8–20 de la même leçon; ces deux pages n’ajoutent pas de temps à la séance."}]}, {"id": "f07", "lesson": "L4", "kicker": "L4, minutes 8–20 · fonds et conditions", "title": "Combler le manque sans inventer de recettes", "blocks": [{"type": "p", "text": "De 8 à 11 minutes, présenter l’avance simulée librement convenue et ses restrictions. De 11 à 17, compléter le scénario favorable et contester les conditions. De 17 à 20, répondre à Q07–Q08. Prendre ensuite la pause prévue de dix minutes."}, {"type": "table", "headers": ["Scénario pédagogique favorable", "Variation", "Fonds"], "rows": [["Fonds initiaux libres", "", "1 200"], ["Avance reçue", "+3 500", "4 700"], ["Coûts préalables payés", "−4 700", "0"], ["Acceptation complète; solde reçu", "+2 100", "2 100"], ["Inspection finale payée", "−300", "1 800"]], "widths": [0.62, 0.18, 0.2]}, {"type": "p", "text": "L’avance est comprise dans 5 600 : elle n’ajoute pas 3 500 de revenus. Les fonds finaux de 1 800 comprennent 1 200 initiaux et 600 de contribution modélisée. Ce scénario exige acceptation complète, solde reçu et paiement des 5 000 de coûts."}, {"type": "callout", "label": "Les conditions font partie de la conception", "text": "L’avance couvre des coûts préalables autorisés, documentés et non récupérables; les fonds inutilisés sont remboursables. Le solde dépend de l’acceptation complète. Une avance proposée reste indisponible tant qu’elle n’est pas reçue et utilisable selon l’accord. Tout acheteur réel n’accepterait pas forcément cette répartition."}, {"type": "p", "text": "K5 déclenche ensuite une facture d’échec explicite : 300 sont dus malgré le refus. Ce scénario ne permet pas de compter les 2 100 conditionnels. Face à un financement ou des étapes de paiement révisées, demander qui accepte, quand les fonds arrivent et quelles obligations demeurent."}]}, {"id": "f08", "lesson": "L5", "kicker": "95–115 minutes · résultat : Affirmations et preuves", "title": "Préciser ce que la vérification établit", "blocks": [{"type": "p", "text": "**Objectif :** séparer preuves de sources, préparation, résultats et commerce; expliquer les limites de l’indépendance. [C2, pp. 13–15]"}, {"type": "numbered", "items": ["0–4 minutes : demander ce qu’établissent les pièces fournies et quels faits réels elles n’établissent pas.", "4–11 : remplir le tableau des affirmations. Exiger une pièce et une limite pour chaque conclusion favorable.", "11–18 : un autre participant conteste une conclusion. Discuter sources brutes, garde, contrôle d’exécution et intérêts organisationnels.", "18–20 : répondre à Q10. Réserver Q09 à la révélation K5 de la mise en situation."]}, {"type": "table", "headers": ["Affirmation à ce stade", "Réponse pédagogique défendable"], "rows": [["Engagement reconstitué", "10 000 selon les hypothèses K1; authentification réelle des sources hors du cours."], ["Préparation de la relève", "Conditionnelle à l’arrangement complet K2–K4 et aux hypothèses; aucune exécution physique observée."], ["Livraison réelle au client", "NON ÉTABLI : aucun bien réel dans ce cours."], ["Valeur commerciale réelle", "NON ÉTABLI : paiements et périmètre des coûts simulés."]], "widths": [0.34, 0.66]}, {"type": "callout", "label": "Mettre le vérificateur à l’épreuve", "text": "Un code distinct peut réduire certains défauts communs d’implémentation sans établir une indépendance institutionnelle. Un évaluateur payé déclare ses liens et incitations. Quelles affirmations sources restent des hypothèses de confiance? Que faudrait-il pour revérifier?"}, {"type": "p", "text": "Ne pas inscrire ÉCHEC seulement parce qu’une preuve manque. Inversement, un manque démontré n’est pas une simple inconnue. Ces distinctions rendent le Passeport utile au prochain lecteur."}]}, {"id": "f09", "lesson": "L6", "kicker": "115–130 minutes · résultat : Fiche de comparaison", "title": "Comparer les meilleures solutions complètes", "blocks": [{"type": "p", "text": "**Objectif :** construire une comparaison pouvant modifier la décision d’achat. Ce cours ne fournit aucun avantage de performance mesuré. [C2, pp. 21–22]"}, {"type": "numbered", "items": ["0–3 minutes : choisir comme référence une équipe d’exploitation conventionnelle compétente, avec les mêmes dossier approuvé, prestataire, capacité et fonds.", "3–9 : choisir en binôme les mesures du résultat, du coût complet et de l’effort. Inclure secours humain, préparation, essais répétés et obligations restantes.", "9–14 : contester une comparaison inéquitable; décider quelles preuves justifieraient achat, révision ou absence d’achat.", "14–15 : répondre à Q11; expliquer pourquoi une solution conventionnelle peut gagner."]}, {"type": "table", "headers": ["À rendre équivalent", "À observer séparément"], "rows": [["Promesse et difficulté", "Unités correctes acceptées, qualité et délai"], ["Sources, droits et prestataire utilisables", "Engagements absents/doublés et interventions"], ["Capacité, fonds initiaux et accès à l’aide", "Coût complet, temps humain, construction et obligations restantes"]], "widths": [0.5, 0.5]}, {"type": "callout", "label": "Réponse attendue", "text": "Comparer l’équipe conventionnelle et la méthode proposée sur P1, avec les mêmes faits et ressources. Consigner résultats acceptés, effort total et coûts complets. Une voie IA non réalisée reste NON EXÉCUTÉE. Une voie également capable et moins chère gagne."}, {"type": "p", "text": "Priver la référence de la modification ou du prestataire qualifié fausse la comparaison. Le temps logiciel seul ne chiffre pas le service. Un prix estimé favorable peut justifier un essai, sans établir supériorité mesurée ni volonté réelle de payer."}]}, {"id": "f10", "lesson": "L7", "kicker": "130–165 minutes · scénario d’animation de 35 minutes", "title": "Enchaîner les décisions de la mise en situation", "blocks": [{"type": "p", "text": "Faire masquer K5–K6. L’exercice réunit les travaux précédents; ce n’est pas un test-surprise de mémoire. À chaque étape, exiger décision, responsable et preuve. Le consentement joué ne vaut que dans cette simulation."}, {"type": "table", "headers": ["Minute", "Carte / travail", "Point à observer"], "rows": [["0–4", "Lire P1; choisir rôles et périmètre", "Acceptation inchangée"], ["4–10", "K1–K3 : voie et échange", "Couverture; accès commun; conflit de 5 000"], ["10–15", "K4 : prix, conditions et fonds", "Avance comprise; choix réel de l’acheteur"], ["15–22", "Dévoiler K5 : juger R1", "9 800; solde retenu; 300 dus"], ["22–28", "K6 facultatif : témoin distinct", "État initial nouveau; préserver R1"], ["28–34", "Passeport; grille; une révision", "Affirmations délimitées, dettes conservées"], ["34–35", "Q09 et retour en une phrase", "La décision suit les preuves"]], "widths": [0.2, 0.42, 0.38]}, {"type": "p", "text": "Si le temps manque, consacrer 22–28 à renforcer la décision R1 et marquer R2 NON EXÉCUTÉ. Ne pas inventer une réussite pour finir la fiche. Une équipe peut refuser rationnellement K4 et conserver une voie non financée; apprécier son raisonnement."}, {"type": "callout", "label": "Une question utile à la fois", "text": "Qu’est-ce qui bloque précisément? Que pourriez-vous construire ou négocier pour lever cet obstacle? Quelle preuve permettrait à une autre personne de décider? Laisser les participants essayer avant de livrer le corrigé."}, {"type": "p", "text": "Les deux pages suivantes donnent les décisions attendues. Les garder hors de vue jusqu’au retour pédagogique."}]}, {"id": "f11", "lesson": "L7", "kicker": "Corrigé · K5 / R1", "title": "Conserver l’échec et ses coûts", "blocks": [{"type": "callout", "label": "Résultat client", "text": "R1 consigne 9 800 étiquettes conformes à 15 h 40. L’heure et la spécification ne compensent pas les 200 manquantes. P1 exige 10 000 et interdit l’acceptation partielle. Verdict : ÉCHEC du résultat client de la simulation R1. La livraison physique réelle reste NON ÉTABLIE."}, {"type": "table", "headers": ["Fait financier R1", "Réponse attendue"], "rows": [["Fonds initiaux + avance", "1 200 + 3 500 = 4 700 disponibles dans la simulation."], ["Coûts préalables payés", "4 700 payés; fonds restants = 0."], ["Solde conditionnel", "2 100 ni exigibles ni reçus sans acceptation complète."], ["Facture d’inspection en échec", "300 exigibles selon K5; financement manquant."], ["Avance / remboursement", "K5 affecte 3 500 à des coûts admissibles documentés non récupérables. Aucune avance inutilisée n’est indiquée; cela n’exclut pas toutes les autres obligations."]], "widths": [0.32, 0.68]}, {"type": "p", "text": "Suspendre les engagements supplémentaires, conserver la facture et demander une résolution autorisée. Proposer réparation financée, règlement négocié ou autre voie complète. Chiffrer et autoriser cette suite; aucun accord de réparation n’est fourni."}, {"type": "callout", "label": "Ce qu’il ne faut pas corriger sur papier", "text": "Ne pas ramener P1 à 9 800, compter le prix complet de 5 600, rendre les 2 100 disponibles ni emprunter les fonds hypothétiques R2. Consigner réparations restantes et incertitudes; la classe n’invente pas un règlement sans responsabilité."}, {"type": "p", "text": "Un dossier d’échec rigoureux est un travail utile. Il identifie les 300 impayés et la décision nécessaire avant de nouvelles promesses."}]}, {"id": "f12", "lesson": "L7", "kicker": "Corrigé · K6 / R2 facultatif", "title": "Réussir l’exercice sans exagérer sa portée", "blocks": [{"type": "p", "text": "R2 est un **scénario témoin positif distinct, à partir d’un nouvel état initial supposé**. Il possède sa propre autorisation simulée et sa réception fictive. Il ne démontre pas que l’opération réelle R1 a été corrigée ou réexécutée."}, {"type": "callout", "label": "Résultat délimité", "text": "La nouvelle réception consigne 10 000 étiquettes conformes acceptées par Morgan à M1 à 15 h 40, avant 16 h. Un autre participant contrôle les pièces fournies. Verdict : DÉMONTRÉ pour l’affirmation d’acceptation simulée R2, selon les hypothèses imprimées."}, {"type": "table", "headers": ["Affirmation R2", "Limite"], "rows": [["Clôture financière modélisée", "1 200 + 3 500 − 4 700 + 2 100 − 300 = 1 800. Les 5 000 de coûts modélisés sont payés."], ["Contribution modélisée", "600; les autres 1 200 finaux sont les fonds initiaux."], ["Livraison physique réelle", "NON ÉTABLI : étiquettes et réception simulées."], ["Valeur commerciale réelle", "NON ÉTABLI : aucun acheteur réel, encaissement réel ni coût complet observé."], ["Indépendance", "Contrôle entre participants; déclarer rôles, méthode et faits du scénario tenus pour acquis."]], "widths": [0.34, 0.66]}, {"type": "p", "text": "Garder verdict d’échec, coûts, dette et obligations non résolues de R1 à côté de R2. Ne pas additionner leurs trésoreries. Un nouvel essai réel exige consentement neuf, capacité et fonds réellement disponibles, et traitement explicite des obligations antérieures."}, {"type": "callout", "label": "Question de retour", "text": "Qu’est-ce qui s’est amélioré : notre dossier d’exercice, le résultat réel de l’entreprise, ou les deux? Seul le premier dispose de preuves dans cette classe."}]}, {"id": "f13", "lesson": "L7", "kicker": "Grille formative de performance · maximum 12", "title": "Évaluer le travail, puis l’améliorer", "blocks": [{"type": "p", "text": "Attribuer 0 si absent ou substantiellement erroné; 1 si partiel, avec un manque important; 2 si le repère ci-dessous est étayé. Citer un élément du travail pour chaque note. Cette grille pédagogique non validée ne certifie pas la préparation opérationnelle."}, {"type": "table", "headers": ["Critère", "Repère pour 2 points"], "rows": [["Promesse", "Quantité, spécification, échéance, lieu et acceptation autorisée préservés; aucun assouplissement rétrospectif."], ["Moyens construits", "Modification/borne rapprochées; dossier et accès autorisés; conflit de capacité résolu."], ["Arrangement volontaire", "Acheteur/vendeur/prestataire/bénéficiaire nommés; droits, réservation, prix et conditions d’échec/remboursement."], ["Coûts et fonds", "Coût 5 000, manque 3 500, avance comprise, solde 2 100 conditionnel, 300 impayés R1 et fonds R2 distincts."], ["Preuves et verdict", "R1 échoue; R2 reste simulé; livraison/marché réels non établis; limites du contrôle déclarées."], ["Comparaison et suite", "Référence compétente également équipée, effort complet compté, prochaine action fondée sur des preuves."]], "widths": [0.3, 0.7]}, {"type": "callout", "label": "Correction obligatoire avant de conclure", "text": "Faire réviser tout travail qui efface R1, ajoute l’avance au revenu, compte les 2 100 après refus ou présente les biens/paiements fictifs comme réels. Un total élevé n’annule pas ces erreurs."}, {"type": "p", "text": "Les notes du pair et de l’animateur peuvent diverger. Discuter les preuves au lieu de traiter le chiffre comme une vérité objective. Consigner une révision précise et, au besoin, la nouvelle note. Séparer questionnaire et performance; ne pas en faire une cote de résilience."}]}, {"id": "f14", "lesson": "L8", "kicker": "165–180 minutes · Réutilisation et prochaine action", "title": "Transférer une capacité et éprouver sa valeur", "blocks": [{"type": "p", "text": "**Objectif :** proposer un usage distinct et une comparaison pouvant établir l’apport de la capacité conservée. Réutilisation, demande répétée et progrès du processus de découverte sont distincts. [C2, pp. 23–24]"}, {"type": "numbered", "items": ["0–4 minutes : nommer un élément ou une méthode à conserver, ses droits, ses coûts et ses limites connues.", "4–9 : l’appliquer à une promesse différente. Que faut-il changer? Comment une équipe compétente dépourvue de cette capacité aborderait-elle la tâche?", "9–13 : préciser prochaine action, responsable, preuves et date de revue. Inviter une personne à expliquer son hypothèse initiale révisée.", "13–15 : répondre à Q12, recueillir une amélioration du cours et conclure."]}, {"type": "callout", "label": "Exemple attendu", "text": "Conserver format d’engagement versionné et méthode de revue des sources. Les éprouver chez un loueur d’outils qui doit honorer ses réservations après une panne de planning. Définir résultat accepté, droits et capacité. Comparer avec et sans la méthode conservée, avec informations et ressources initiales équivalentes; inclure adaptation, requalification et effort humain."}, {"type": "p", "text": "Aucun successeur n’a été exécuté ici : marquer l’essai proposé NON EXÉCUTÉ. Une deuxième vente du même service d’étiquettes renseignerait la demande répétée; elle ne démontrerait pas à elle seule un nouvel usage distinct."}, {"type": "callout", "label": "Une suite constructive", "text": "Rédiger une vraie fiche de promesse ou identifier son autorité d’acceptation. Toute activation exige encore des autorisations, sources, capacité et fonds nouveaux. Un formulaire de cours rempli n’autorise pas l’action."}]}, {"id": "f15", "lesson": "REF", "kicker": "Corrigé du questionnaire · un point par question", "title": "Réponses 1–4", "blocks": [{"type": "heading", "text": "Q01 · C"}, {"type": "p", "text": "**Morgan reçoit et accepte 10 000 étiquettes v3 conformes au site M1 avant l’échéance.** La promesse porte sur le résultat accepté par le client : quantité, spécification, lieu et heure. Un redémarrage ou une expédition aide la réalisation sans établir la réception et l’acceptation. Dans ce cours, même une réception fictive conforme établit seulement le résultat de simulation."}, {"type": "heading", "text": "Q02 · A"}, {"type": "p", "text": "**Échec par rapport à P1; consigner séparément tout nouvel accord.** Les conditions d’acceptation initiales restent la référence. Un compromis ultérieur ou un nouvel essai peut être utile, sans modifier le résultat historique. Il manque 200 étiquettes."}, {"type": "heading", "text": "Q03 · B"}, {"type": "p", "text": "**10 000, après contrôle de l’autorité de la modification et de la couverture jusqu’à la borne.** 8 000 + 2 000 = 10 000. La modification change ce qui est dû. Il faut encore contrôler origine, autorité et couverture jusqu’à la borne convenue; une empreinte concordante ne démontre pas ces faits."}, {"type": "heading", "text": "Q04 · B"}, {"type": "p", "text": "**Construire et éprouver un dossier à jour et un canal de lancement autorisés, accessibles séparément.** Un second fournisseur ne supprime pas une dépendance commune. L’intervention utile crée un moyen autorisé, à jour et utilisable d’obtenir puis de lancer le bon travail. Sa construction, ses droits et son coût font partie du service."}]}, {"id": "f16", "lesson": "REF", "kicker": "Corrigé du questionnaire · un point par question", "title": "Réponses 5–8", "blocks": [{"type": "heading", "text": "Q05 · C"}, {"type": "p", "text": "**La demande totale atteint 17 000 pour 12 000 disponibles; les deux ne peuvent être couvertes sans condition.** Le travail protégé et les promesses simultanées partagent la même ressource. La nouvelle demande crée un manque de 5 000 unités. Un créneau supplémentaire qualifié, une priorité librement convenue ou un refus peut le résoudre; une double réservation cachée ne le peut pas."}, {"type": "heading", "text": "Q06 · A"}, {"type": "p", "text": "**Un intérêt; la réservation utilisable et ses conditions restent à confirmer.** Volonté, engagement autorisé, capacité utilisable et paiement encaissé correspondent à des preuves différentes. Les parties doivent convenir librement du produit, du créneau, des droits, du prix, du lancement et des conditions d’échec."}, {"type": "heading", "text": "Q07 · B"}, {"type": "p", "text": "**600 CAD.** 5 600 − 5 000 = 600. La trésorerie finale de 1 800 dans le scénario pédagogique favorable comprend 1 200 de fonds initiaux. Aucun calcul ne constitue un bénéfice observé ou une preuve de marché réelle."}, {"type": "heading", "text": "Q08 · C"}, {"type": "p", "text": "**Le manque est de 3 500 CAD; le solde de 2 100 dépend de l’acceptation complète.** L’avance comble ce manque modélisé seulement lorsqu’elle est reçue et disponible selon les conditions convenues. Elle fait partie du prix; ce n’est pas un revenu supplémentaire. Restrictions, remboursements et conditions de paiement restent à considérer."}]}, {"id": "f17", "lesson": "REF", "kicker": "Corrigé du questionnaire · un point par question", "title": "Réponses 9–12", "blocks": [{"type": "heading", "text": "Q09 · A"}, {"type": "p", "text": "**Échec de P1 dans la simulation; ne pas compter les 2 100 conditionnels; consigner l’inspection impayée et la décision suivante.** Une réception fictive de 9 800 ne respecte pas la promesse de 10 000. K5 rend les 300 CAD d’inspection exigibles malgré l’échec; leur financement manque. Biens réels, paiement réel et valeur commerciale réelle restent non établis."}, {"type": "heading", "text": "Q10 · B"}, {"type": "p", "text": "**Déclarer le lien, la méthode, la garde des sources et les limites; apprécier l’indépendance pour l’affirmation précise.** L’indépendance de la vérification comporte plusieurs dimensions. Code distinct, sources protégées, contrôle de l’exécution et intérêts organisationnels ne sont pas interchangeables. Le rapport doit préciser les contrôles, les hypothèses de confiance et les inconnues."}, {"type": "heading", "text": "Q11 · C"}, {"type": "p", "text": "**Garder la même promesse, les mêmes sources et ressources utilisables; compter coûts complets et travail humain; accepter un gagnant conventionnel.** Une voie conventionnelle compétente constitue la référence utile. Une voie assistée par IA doit être exécutée avant qu’on affirme ses performances. Devis, estimation modélisée et résultat mesuré restent distincts; ne pas acheter peut être rationnel."}, {"type": "heading", "text": "Q12 · A"}, {"type": "p", "text": "**Une tâche nouvelle et distincte comparée avec et sans cette capacité, à ressources équivalentes, coûts d’adaptation compris.** La conservation crée une capacité candidate, pas la preuve de son apport. L’usage suivant exige sa propre promesse, ses droits, son financement et ses preuves. Demande répétée, apport au successeur et amélioration du processus de découverte sont des affirmations différentes."}]}, {"id": "f18", "lesson": "REF", "kicker": "Retours, autonomie et application responsable", "title": "Rendre les acquis utiles après la séance", "blocks": [{"type": "p", "text": "Attribuer un point par réponse correcte, sur 12. Séparer premières réponses et corrections. Utiliser les erreurs pour choisir la prochaine explication ou le prochain exercice. La note décrit les réponses à douze questions; elle ne mesure pas la résilience d’une entreprise."}, {"type": "callout", "label": "Un retour pédagogique concret", "text": "Nommer la décision bien prise, citer sa preuve, identifier un manque important et demander une action révisée. Exemple : « Votre calcul protège les 2 000 déjà engagées. Votre ligne de financement compte encore 2 100 avant acceptation. Que pouvez-vous engager avec les fonds réellement disponibles? »"}, {"type": "p", "text": "En autonomie, masquer le corrigé, réaliser chaque tâche, puis comparer le raisonnement. Utiliser K5 avant K6. Si vous êtes seul, consigner l’absence de contrôle par un pair indépendant au lieu d’en inventer un."}, {"type": "p", "text": "Demander quelle préparation sera utilisée, quels obstacles peuvent la bloquer et quel soutien serait utile. Une revue ultérieure peut examiner son application. Le niveau atteint en fin de cours ne démontre pas seul un gain d’apprentissage; la satisfaction seule ne démontre pas l’efficacité. [P2]"}, {"type": "callout", "label": "Suivi facultatif — hors des 180 minutes", "text": "Convenir d’une date de revue. Examiner une fiche de promesse ou une décision anonymisée et autorisée; demander ce qui a changé, les preuves obtenues et les obstacles restants. Une action réelle exige encore ses propres autorisations et ressources. Répéter le questionnaire ou revoir l’application ajoute un temps facultatif."}, {"type": "p", "text": "Consigner uniquement la participation ou l’achèvement du cours comme tels. Le cours ne délivre aucune certification opérationnelle, accréditation, autorisation de sécurité ou garantie."}]}]}}, "quick_reference": {"en": {"document": "quick_reference", "lang": "en", "title": "Continuity at a glance", "subtitle": "A two-page companion for your first scoped exercise", "sources": ["C1", "F2"], "pages": [{"id": "qr_decision", "lesson": "REF", "kicker": "DESK REFERENCE 1 OF 2", "title": "The continuity decision", "blocks": [{"type": "p", "text": "Start with a customer promise whose failure matters. Establish a usable way to deliver it and an arrangement that willing participants can carry out. Judge the result against the agreed promise. [C1; F2]"}, {"type": "table", "headers": ["Step", "The question to answer"], "widths": [0.27, 0.73], "rows": [["1  Promise", "What output, quantity, quality, place and deadline will the named customer authority accept?"], ["2  Missing means", "Which unavailable record, permission, capability or dependency blocks delivery? What must be constructed?"], ["3  Arrangement", "Who agrees to provide what, on which terms? What capacity is actually reserved, including simultaneous demand?"], ["4  Money", "What does the complete service cost? Is money available before each payment, including failure obligations?"], ["5  Verification", "What evidence would establish or disprove the outcome? Who checks it, with what independence?"], ["6  Comparison", "Could a capable conventional option meet the same promise under the same conditions?"], ["7  Next use", "What reusable capability remains? Does it help on a different task after transfer costs? Preserve failures too."]]}, {"type": "heading", "text": "State each claim separately"}, {"type": "table", "headers": ["Claim", "Evidence you need"], "widths": [0.27, 0.73], "rows": [["Outcome", "The required output, actually received and accepted within the frozen conditions."], ["Service feasibility", "Consenting participants, usable capacity, permissions, complete costs, timely funds and workable obligations."], ["Market evidence", "Real independent buying, accepted value, collections and complete costs. Repeated demand supports repeatability."]]}, {"type": "p", "text": "Give a scoped verdict: supported, failed, or not established. Name the tested setting: tabletop, digital product, physical delivery or real transaction. A completed form does not prove delivery."}]}, {"id": "qr_cash", "lesson": "REF", "kicker": "DESK REFERENCE 2 OF 2", "title": "The cash timing check", "blocks": [{"type": "p", "text": "Fictional teaching case. The continuity service fee is CAD 5,600. Complete modeled cost is CAD 5,000, leaving a projected contribution of CAD 600. Before acceptance, CAD 4,700 is due but only CAD 1,200 is available. The initial funding gap is CAD 3,500."}, {"type": "heading", "text": "Funded positive-control branch"}, {"type": "table", "headers": ["Event", "Cash change", "Available cash"], "widths": [0.5, 0.25, 0.25], "rows": [["Starting money", "—", "1,200"], ["Receive advance", "+3,500", "4,700"], ["Pay before acceptance", "−4,700", "0"], ["Receive balance after full acceptance", "+2,100", "2,100"], ["Pay final inspection", "−300", "1,800"]]}, {"type": "callout", "label": "The reconciliation", "text": "The advance and balance total 5,600. Ending cash of 1,800 contains the original 1,200 plus the 600 contribution. The advance is part of the fee. The original customer’s order invoice is outside this service ledger."}, {"type": "heading", "text": "When the receipt says 9,800"}, {"type": "p", "text": "The promise requires 10,000, with no authorized short shipment. The failed tabletop branch cannot collect the acceptance-dependent 2,100 balance. After the 4,700 payments, cash is zero; the case’s 300 inspection invoice remains unpaid. Record that obligation and any unresolved repair duty. The separate positive-control branch does not erase or fund this failure."}, {"type": "heading", "text": "Your first useful action"}, {"type": "p", "text": "Choose one commitment, name its owner and acceptance authority, and draft the promise card. Gather the existing recovery plan and a credible alternative. Identify the first missing fact or capability and arrange a bounded tabletop with willing participants. Use the workbook to preserve decisions and the facilitator guide to challenge them."}, {"type": "p", "text": "Course edition 1.0. All amounts and case events above are invented. Your real case needs its own complete cost scope, actual cash timing, consent, failure terms and evidence. Research sources: C1 CONTINUITY Ω, edition 1.1.1; F2 Invent the Economy, October 2026. Originals are included in the archive.", "role": "source_note"}]}]}, "fr": {"document": "quick_reference", "la
