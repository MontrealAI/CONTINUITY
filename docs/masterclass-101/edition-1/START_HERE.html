participation, l’engagement nécessaire et les preuves actuelles. Un bon arrangement relie ces contributions; il ne traite pas tous les intervenants autres que l’acheteur comme des ressources gratuites. [C2, pp. 18–20]"}, {"type": "callout", "label": "Exercice", "text": "A accepte un prix; B possède une capacité; le visuel approuvé reste accessible uniquement par l’accès défaillant. Que construire maintenant? Précisez une diffusion autorisée, les consentements nécessaires et la condition rendant l’offre utilisable."}, {"type": "callout", "label": "Retour", "text": "Le prix accepté et le créneau disponible n’éliminent pas cette dépendance informationnelle. Un dossier actuel autorisé et un canal joignable distinct pourraient le faire. Qualifiez-les avec le titulaire des droits et l’opérateur de B, puis actualisez l’arrangement complet. Ne payez pas la réservation en supposant que l’accès se réglera seul."}, {"type": "callout", "label": "Idée reçue à corriger", "text": "« Une bonne simulation signifie qu’il existe un marché. » Un modèle montre les conséquences des hypothèses fournies. Conditions acceptées, échange réalisé et demande répétée exigent d’autres observations. Même un véritable paiement pour la préparation établit uniquement l’achat de cette étape. [F2, p. 3; C2, pp. 8, 20]"}, {"type": "p", "text": "**Production :** une Carte de l’arrangement distinguant contributions acceptées, proposées et manquantes. **Autocontrôle :** chacun peut-il refuser, et la proposition respecte-t-elle ses obligations et ses autres options? **Suite :** calculer le coût complet et vérifier le paiement des factures à leur échéance."}]}, {"id": "l4_01", "lesson": "L4", "kicker": "Leçon 4 · 5 min", "title": "Compter le coût complet du service", "blocks": [{"type": "callout", "label": "Objectif", "text": "Calculer la contribution projetée, repérer le manque de trésorerie maximal et expliquer les conditions d’une révision financée."}, {"type": "p", "text": "Tous les montants sont fictifs, en dollars canadiens, du point de vue du coordonnateur. A propose d’acheter le service de continuité distinct pour 5 600 $. La facture initiale du client final est exclue. Le modèle suppose ce périmètre de coûts complet et exprimé sur une base cohérente."}, {"type": "table", "headers": ["Coût modélisé", "CAD", "Paiement"], "rows": [["Production de relève", "3 200", "Avant acceptation"], ["Dossier préparé et contrôlé", "550", "Avant acceptation"], ["Transport", "400", "Avant acceptation"], ["Coordination, frais généraux répartis compris", "350", "Avant acceptation"], ["Frais d’essai de préparation", "200", "Avant acceptation"], ["Inspection finale", "300", "Après acceptation"], ["Total", "5 000", "4 700 avant; 300 après"]], "widths": [0.58, 0.14, 0.28]}, {"type": "callout", "label": "Exemple résolu", "text": "5 600 − 5 000 = 600 $ de contribution projetée. Ce calcul dépend du périmètre, de l’exécution, de l’acceptation et du paiement modélisés. Ce n’est ni une recette encaissée, ni un solde bancaire, ni un bénéfice réalisé."}, {"type": "p", "text": "Un registre réel doit établir son périmètre complet : travail humain, acquisition et tentatives échouées, préparation, ressources techniques ou d’IA, financement, reprises, suivi et devoirs restants, selon le cas. Ne comptez pas deux fois une ressource et ne la dissimulez pas hors du périmètre. [C2, pp. 18–20; F2, p. 6]"}, {"type": "p", "text": "La ligne d’inspection indique quand sa facture est payée; elle ne reporte pas les contrôles de qualité requis après l’acceptation. **Suite :** placer factures et encaissements dans le temps."}]}, {"id": "l4_02", "lesson": "L4", "kicker": "Leçon 4 · 5 min", "title": "Une marge ne suffit pas à payer à temps", "blocks": [{"type": "p", "text": "L’offre initiale prévoit le paiement après acceptation complète. Le coordonnateur dispose de 1 200 $ après ses obligations protégées. Il doit payer 4 700 $ avant l’acceptation. Le prix promis pour plus tard ne finance pas une obligation antérieure. [C2, pp. 19–20; F2, p. 6]"}, {"type": "figure", "name": "cash_timing", "caption": "Plan initial : 1 200 disponibles contre 4 700 exigibles avant acceptation, soit 3 500 manquants. La branche favorable révisée exige une avance de 3 500 comprise dans les 5 600, puis 2 100 encaissés et 300 payés après acceptation."}, {"type": "callout", "label": "Exemple résolu", "text": "Manque initial = 4 700 − 1 200 = 3 500 $. N’activez pas ce plan de paiement. Construisez un autre calendrier accepté, obtenez un fonds de roulement autorisé ou qualifiez une solution complète moins coûteuse."}, {"type": "callout", "label": "Vérifiez votre compréhension", "text": "Un prix plus élevé, toujours payable après acceptation, supprime-t-il ce manque? Non. Il peut améliorer la contribution projetée sans changer les fonds disponibles avant l’échéance des factures."}, {"type": "p", "text": "**Suite :** tester une avance volontaire comme réparation possible."}]}, {"id": "l4_03", "lesson": "L4", "kicker": "Leçon 4 · 4 min", "title": "Réparer le calendrier sans compter deux fois", "blocks": [{"type": "p", "text": "Dans la variante financée, A accepte volontairement une avance de 3 500 $, comprise dans le prix de 5 600 $. L’exercice la suppose reçue, encaissée et autorisée pour les coûts préalables non récupérables documentés; les fonds inutilisés sont remboursables. Les 2 100 $ restants deviennent payables seulement après acceptation complète. Ces conditions n’effacent pas les autres devoirs en cas d’échec."}, {"type": "table", "headers": ["Branche favorable conditionnelle", "Trésorerie, CAD"], "rows": [["Fonds initiaux non engagés", "1 200"], ["Recevoir l’avance +3 500", "4 700"], ["Payer les coûts préalables −4 700", "0"], ["Acceptation complète; encaisser +2 100", "2 100"], ["Payer l’inspection −300", "1 800"]], "widths": [0.71, 0.29]}, {"type": "callout", "label": "Rapprochement résolu", "text": "Les recettes totales restent 3 500 + 2 100 = 5 600. Le solde de 1 800 comprend les 1 200 initiaux et la contribution modélisée de 600. Traiter l’avance comme recette supplémentaire compterait deux fois une partie du prix."}, {"type": "callout", "label": "Exercice", "text": "Si l’acceptation complète n’arrive pas, pouvez-vous inscrire l’encaissement de 2 100 et annoncer le même solde final? Expliquez en une phrase."}, {"type": "callout", "label": "Retour", "text": "Non. Cette recette dépend de l’acceptation complète et de l’encaissement. Conservez les soldes observés, réels ou simulés, les factures impayées et les obligations de remboursement ou de reprise."}, {"type": "p", "text": "**Suite :** consigner la branche favorable financée et les questions d’échec encore à résoudre. [C2, pp. 19–22]"}]}, {"id": "l4_04", "lesson": "L4", "kicker": "Leçon 4 · 6 min", "title": "Rendre la décision de financement vérifiable", "blocks": [{"type": "p", "text": "Dans le Tableau des coûts et des fonds, séparez prix proposé, coûts complets modélisés, encaissements, paiements et devoirs restants. Marquez chaque entrée comme supposée, convenue ou observée dans l’exercice. Une avance inscrite sur une facture provisoire n’est pas un encaissement."}, {"type": "numbered", "items": ["Retrouvez la contribution de 600 $ et le manque initial de 3 500 $.", "Inscrivez l’avance dans le prix total, avec utilisation permise et conditions de remboursement.", "Retrouvez le solde favorable de 1 800 $, dont les 1 200 $ initiaux.", "Précisez ce qui change si l’acceptation échoue ou si le solde arrive tard."]}, {"type": "callout", "label": "Exercice", "text": "Une collègue dit : « La solution est prête : sa trésorerie préalable ne devient jamais négative. » Corrigez cette conclusion sans rejeter la réparation utile."}, {"type": "callout", "label": "Retour", "text": "L’avance répare le calendrier modélisé de la branche favorable. Il faut encore des fonds réellement disponibles, une solution autorisée avec une capacité utilisable, et un traitement des obligations d’échec ou de paiement tardif. Un solde nul avant acceptation n’offre aucune réserve pour un élément non modélisé. La prochaine tâche constructive consiste à résoudre ces conditions, pas à répéter « trop risqué »."}, {"type": "callout", "label": "Idée reçue à corriger", "text": "« Marge, trésorerie et bénéfice sont interchangeables. » Ils décrivent respectivement une différence modélisée, l’argent disponible à un instant et le résultat final après les coûts et obligations applicables. [F2, p. 6; C2, pp. 18–20]"}, {"type": "p", "text": "**Production :** un registre rapproché et une décision précise. **Prenez maintenant la pause de dix minutes. Suite :** déterminer les preuves justifiant une affirmation de réussite."}]}, {"id": "l5_01", "lesson": "L5", "kicker": "Leçon 5 · 5 min", "title": "Dire exactement ce qui est établi", "blocks": [{"type": "callout", "label": "Objectif", "text": "Attribuer un verdict étayé à une affirmation précise, expliquer son périmètre de preuve et nommer la prochaine observation décisive."}, {"type": "p", "text": "Trois réalisations peuvent progresser ensemble sans devenir interchangeables. Le résultat client concerne l’engagement accepté. La faisabilité du service concerne l’arrangement complet dans ses conditions déclarées. La preuve commerciale concerne ce que de vrais participants ont choisi, reçu et payé. Une colonne ne remplit pas automatiquement les autres. [C2, pp. 8, 14–15, 18–22; F2, p. 3]"}, {"type": "table", "headers": ["Affirmation", "Question à trancher"], "rows": [["Résultat", "Le résultat respecte-t-il les conditions d’acceptation initiales?"], ["Faisabilité du service", "Permissions, capacité, financement et obligations permettent-ils le service complet?"], ["Preuve commerciale", "De vraies conditions ont-elles été acceptées, la valeur livrée et le paiement encaissé, avec coûts complets et devoirs restants consignés?"]], "widths": [0.28, 0.72]}, {"type": "callout", "label": "Exemple résolu", "text": "Un dossier correct peut être démontré alors que la livraison réelle reste non établie. Une commande reçue incomplète peut établir l’échec de P1 même si logiciel et transport ont fonctionné."}, {"type": "callout", "label": "Trois verdicts", "text": "DÉMONTRÉ : exigences annoncées satisfaites dans l’exercice déclaré. ÉCHEC : exigence applicable violée. NON ÉTABLI : preuve décisive absente ou hors périmètre. Une méthode non exécutée reste NON EXÉCUTÉE; cela ne prouve pas son échec."}, {"type": "p", "text": "**Exercice :** classez « le plan semble complet » et « le reçu autorisé indique moins que P1 ». Le premier demande des preuves; le second étaye un échec dans le périmètre du reçu. **Suite :** examiner qui a vérifié, et sur quoi."}]}, {"id": "l5_02", "lesson": "L5", "kicker": "Leçon 5 · 5 min", "title": "Contrôler le vérificateur et ses sources", "blocks": [{"type": "p", "text": "Il faut préciser l’objet de l’« indépendance ». Une garde distincte protège la référence; un contrôle programmé séparément peut révéler une erreur commune; un évaluateur externe ajoute une séparation organisationnelle. Ces mesures répondent à des risques différents. Un autre modèle du même projet ne les procure pas automatiquement. [C2, pp. 9–10, 14, 24–25]"}, {"type": "figure", "name": "verification_loop", "caption": "L’objection devient utile lorsque les preuves la tranchent et qu’une réparation autorisée est revérifiée contre la promesse initiale. Une objection correcte peut aussi établir un obstacle."}, {"type": "callout", "label": "Exemple résolu", "text": "Deux examinateurs lisant le même point de reprise incomplet peuvent s’accorder sur la mauvaise commande. Fournissez C-01 et A-02, puis vérifiez la détection d’un dossier omettant volontairement la modification dans l’exercice isolé."}, {"type": "callout", "label": "Exercice et retour", "text": "Quel est le témoin positif? Un dossier complet et correct que le contrôle devrait accepter. Un vérificateur qui refuse tout n’est pas un test d’acceptation utile."}, {"type": "p", "text": "**Suite :** appliquer ces distinctions aux preuves logicielles publiées du projet."}]}, {"id": "l5_03", "lesson": "L5", "kicker": "Leçon 5 · 5 min", "title": "Lire les preuves logicielles à leur juste portée", "blocks": [{"type": "p", "text": "Le dossier v0.2 du dépôt, fixé pour ce cours, rapporte un contenu numérique substantiel de travaux d’étiquetage produit puis transféré à un processus récepteur local distinct. Celui-ci importe le contenu, le contrôle contre sa spécification conservée et consigne l’acceptation. Cela dépasse une simple déclaration du producteur, tout en restant un exercice numérique borné. [R21; R22]"}, {"type": "p", "text": "Une réexécution locale distincte a échoué pendant la finalisation des preuves et reste non qualifiée; des contrôles ultérieurs réussis n’effacent pas cet échec. [R46; R47]"}, {"type": "table", "headers": ["Preuve du dossier", "Ce qu’elle établit ou laisse ouvert"], "rows": [["Contenu importé et contrôlé", "Résultat logiciel précis; aucune étiquette physique, qualité d’impression ni acceptation d’un client authentique."], ["Règles et monnaie modélisées", "Résultats sous hypothèses rédigées; aucun consentement, paiement ou demande réels."], ["Récepteur et vérificateur distincts", "Contrôles locaux sous auteurs et hôte partagés; aucune certification tierce."], ["IA NON EXÉCUTÉE", "Aucune performance ni supériorité d’IA observée dans ces dossiers."]], "widths": [0.37, 0.63]}, {"type": "callout", "label": "Exercice", "text": "Réécrivez : « Les tests prouvent un marché de continuité physique certifiée indépendamment. »"}, {"type": "callout", "label": "Retour modèle", "text": "« L’expérience locale rapportée exerce et vérifie séparément un résultat numérique et des arrangements modélisés; elle n’établit ni livraison physique, ni demande réelle, ni certification tierce. » Cette formulation préserve l’acquis technique sans l’amplifier ni le nier. [R21; R22; R23]"}, {"type": "p", "text": "Un Passeport sauvegardé résume une évaluation. Une nouvelle vérification réexamine preuves et référence originale; elle ne crée pas les observations réelles absentes. Garde des sources et hypothèses de confiance restent pertinentes. **Suite :** rédiger votre propre fiche de preuves."}]}, {"id": "l5_04", "lesson": "L5", "kicker": "Leçon 5 · 5 min", "title": "Transformer le constat en prochaine action", "blocks": [{"type": "p", "text": "Pour une affirmation, consignez exigence, source ou observation, vérificateur, méthode, résultat, limite et prochaine action. Ajoutez la version et les conditions imposant un nouveau contrôle. Le Passeport de continuité sert à cela : permettre au lecteur de comprendre l’acquis et ce sur quoi il peut compter maintenant. [C2, pp. 14–15]"}, {"type": "callout", "label": "Exercice", "text": "Un récepteur autorisé refuse un visuel périmé. Le test de refus fonctionne, mais aucune étiquette correcte n’arrive dans le délai de P1. Écrivez deux verdicts distincts et une prochaine action constructive."}, {"type": "callout", "label": "Retour", "text": "Le contrôle de refus peut être DÉMONTRÉ dans ce test. La livraison complète de P1 est en ÉCHEC. L’action suivante pourrait construire et qualifier le dossier actuel et une production distincte financée; elle ne peut transformer l’échéance initiale manquée en réussite."}, {"type": "callout", "label": "Une critique utile", "text": "Demandez : « Quelle exigence cette preuve pourrait-elle contredire? » Puis : « Quelle construction ou observation permise réglerait le problème? » Conservez les observations défavorables et contrôlez la version réparée. Un avertissement général ne produit ni verdict précis ni réparation."}, {"type": "p", "text": "**Production :** une Fiche des affirmations et des preuves, avec verdict délimité et prochaine décision. **Autocontrôle :** avez-vous séparé test d’un composant, résultat complet, conditions du service et preuve commerciale? Avez-vous nommé l’indépendance réelle et l’observation manquante?"}, {"type": "p", "text": "**Suite :** même un arrangement fonctionnel doit justifier son choix face à des solutions compétentes."}]}, {"id": "l6_01", "lesson": "L6", "kicker": "Leçon 6 · 5 min", "title": "Comparer des solutions capables de gagner", "blocks": [{"type": "callout", "label": "Objectif", "text": "Concevoir une comparaison équitable et distinguer un résultat utile de la preuve qu’une méthode apporte un avantage."}, {"type": "p", "text": "Une équipe conventionnelle compétente peut rapprocher la même modification, construire un dossier et organiser la relève. Donnez-lui les informations, l’autorité et les possibilités pertinentes. CONTINUITÉ Ω doit justifier son choix par le résultat complet, le travail économisé ou une activité rendue possible, sans rival artificiellement affaibli. [C2, pp. 19–22]"}, {"type": "table", "headers": ["Candidat", "Rendre la comparaison crédible"], "rows": [["Service conventionnel ou existant", "Permettre reprise, coordination, production de relève et contrôle compétents."], ["Voie directement assistée par l’IA", "Si disponible et autorisée, fournir entrées, outils et possibilités de ressources équivalents."], ["Critique et construction explicites", "Compter critique, arbitrage, réparation et vérification supplémentaires, ainsi que leurs bénéfices."]], "widths": [0.34, 0.66]}, {"type": "p", "text": "Conservez P1, accès aux sources, permissions, règles d’acceptation et budgets pertinents comparables. Fixez la méthode avant l’exécution. Distinguez devis, exercices réalisés et candidats indisponibles. L’acheteur peut aussi choisir raisonnablement de ne rien acheter."}, {"type": "callout", "label": "Exemple résolu", "text": "Si seule la nouvelle méthode reçoit A-02, sa meilleure quantité n’isole pas un avantage de méthode. Fournissez la même modification pertinente à la voie conventionnelle et refaites la comparaison dans le périmètre convenu."}, {"type": "p", "text": "**Suite :** choisir les observations susceptibles de modifier réellement le choix."}]}, {"id": "l6_02", "lesson": "L6", "kicker": "Leçon 6 · 5 min", "title": "Une égalité est une information", "blocks": [{"type": "p", "text": "Dans la qualification v0.2 rapportée, les procédures conventionnelle et Harness ont obtenu les mêmes résultats de base et prix modélisés. Les deux ont aussi réalisé un successeur modifié précis. Cela étaye des affirmations bornées d’exécution et de transfert, sans établir un avantage supplémentaire de méthode ou d’IA. La comparaison avec l’IA n’a pas été exécutée. [R22]"}, {"type": "callout", "label": "Comparaison résolue", "text": "Deux voies autorisées respectent les mêmes conditions d’acceptation. L’une fournit une trace de preuves utile, mais demande davantage de travail humain. La livraison seule ne désigne pas un gagnant. Mesurez l’effort complet et demandez si les preuves supplémentaires changent une décision valorisée par l’acheteur."}, {"type": "table", "headers": ["Observer", "Pourquoi cela compte"], "rows": [["Résultat correct accepté à temps", "Le résultat client complet."], ["Omissions, défauts et questions ouvertes", "Les limites cachées par une réussite globale."], ["Travail humain, reprises et vérification", "L’effort réellement nécessaire au fonctionnement."], ["Coûts complets, trésorerie et devoirs", "Ce que les participants doivent financer et assumer."]], "widths": [0.4, 0.6]}, {"type": "callout", "label": "Exercice", "text": "Faute de modèle autorisé accessible, une voie d’IA est NON EXÉCUTÉE. Peut-on la compter comme plus lente, plus chère ou infructueuse?"}, {"type": "callout", "label": "Retour", "text": "Non : sa performance est inconnue. De même, un essai borné et un faible écart de temps n’établissent pas une supériorité fiable. Une préparation ou adaptation non mesurée empêche une conclusion de coût complet. [R21; R22; R23]"}, {"type": "p", "text": "**Suite :** rédiger une comparaison pouvant choisir un service existant, la solution construite ou aucun achat."}]}, {"id": "l6_03", "lesson": "L6", "kicker": "Leçon 6 · 5 min", "title": "Rédiger une Fiche de comparaison", "blocks": [{"type": "p", "text": "Choisissez la meilleure solution de rechange crédible à votre Fiche de réalisation. Précisez ce qu’une observation comparable devrait montrer pour préférer l’une des options. Le but est une meilleure décision, y compris découvrir qu’un service ordinaire fait déjà bien le travail."}, {"type": "numbered", "items": ["Nommez la promesse client et les solutions complètes en concurrence.", "Donnez à chacune les mêmes sources pertinentes, permissions, conditions d’acceptation et possibilités déclarées.", "Choisissez les mesures utiles, dont effort total, coûts et financement.", "Marquez chaque résultat : devis, exécuté, simulé ou NON EXÉCUTÉ. Nommez les lacunes restantes."]}, {"type": "callout", "label": "Exercice", "text": "Une proposition annonce « 20 % de mieux » grâce à une étape logicielle plus rapide, mais omet deux heures de préparation manuelle et ne mesure pas la livraison acceptée. Que doit indiquer la fiche?"}, {"type": "callout", "label": "Retour", "text": "Consignez l’étape mesurée à sa portée réelle. L’amélioration complète est NON ÉTABLIE. Ajoutez préparation et acceptation, définissez le périmètre, puis recueillez des observations comparables. Un coût ou temps incomplet ne devient pas silencieusement un avantage du service entier. [C2, pp. 21–22]"}, {"type": "p", "text": "**Production :** une Fiche de comparaison avec règle de décision définie d’avance. **Autocontrôle :** l’option conventionnelle peut-elle vraiment gagner? Une égalité resterait-elle visible? Un candidat non exécuté garderait-il ce statut?"}, {"type": "p", "text": "**Suite :** réunir promesse, construction, arrangement, finances, preuves et comparaison dans une mise en situation sur table."}]}, {"id": "l7_01", "lesson": "L7", "kicker": "Leçon 7 · 5 min", "title": "Réaliser la mise en situation", "blocks": [{"type": "callout", "label": "Objectif", "text": "Produire un Passeport défendable : préserver P1, construire la solution manquante, rapprocher les finances et séparer verdicts de résultat, de faisabilité et de preuve commerciale."}, {"type": "p", "text": "Cet exercice sur table utilise les pièces K0–K6, dévoilées progressivement. Aucune entreprise n’est contactée; aucun produit n’est fabriqué; aucun argent ne circule. Lisez chaque pièce comme une hypothèse fournie ou une observation simulée. Votre tâche est de raisonner de façon cohérente, même quand une pièce contredit une proposition favorable."}, {"type": "numbered", "items": ["Attribuez les rôles de coordonnateur, imprimeur A, imprimeur B et client/vérificateur. Si vous cumulez des rôles, rendez ce cumul explicite.", "Ouvrez d’abord K0–K3. Réglez les décisions concernant promesse, sources, solution et arrangement.", "Ouvrez K4 pour le financement, puis K5 pour le premier résultat. Consignez R1 sans le réécrire.", "Si le temps le permet, ouvrez K6 comme branche témoin positive distincte, R2. Elle part d’un nouvel état supposé; ce n’est pas une réparation gratuite de R1."]}, {"type": "callout", "label": "Avant de découvrir le résultat", "text": "Écrivez l’affirmation à tester et le résultat qui vous obligerait à la réviser. Le reçu décidera ainsi du verdict, plutôt que votre préférence."}, {"type": "p", "text": "**Production attendue :** promesse, réalisation, arrangement et finances alimentent un Passeport. Préparez une explication de deux minutes sur l’échec et la prochaine décision constructive. **Suite :** établir la commande et la voie permise."}]}, {"id": "l7_02", "lesson": "L7", "kicker": "Leçon 7 · 7 min", "title": "Décider de la commande et de la solution", "blocks": [{"type": "p", "text": "Utilisez K0–K3. K0 définit P1 et l’autorité de Morgan. K1 fournit le point de reprise, A-02 et C-01. K2 donne le créneau et la demande simultanée supplémentaire. K3 fournit les permissions et engagements à examiner."}, {"type": "numbered", "items": ["Reconstituez la quantité jusqu’à la limite figée. Nommez la source comprenant la modification et la couverture supposée.", "Repérez la construction permettant de transmettre un dossier actuel et utilisable par le canal autorisé. Indiquez toute permission encore absente.", "Calculez la capacité disponible et traitez la demande supplémentaire de 5 000.", "Nommez l’observation établissant la préparation de la voie et celle établissant l’acceptation client."]}, {"type": "callout", "label": "Retour modèle — après votre décision", "text": "La quantité acceptée est 10 000 : 8 000 + 2 000. C-01 fournit, dans le cas imprimé, la couverture jusqu’à mercredi midi sans autre changement. Le calcul de capacité est 12 000 − 2 000 = 10 000. P1 tient; ajouter inconditionnellement 5 000 surchargerait le créneau."}, {"type": "callout", "label": "Réparation constructive", "text": "Trouvez une capacité qualifiée supplémentaire, un autre créneau réellement compatible ou une offre conditionnelle acceptée. Ne déplacez pas silencieusement le travail protégé. Une permission de partager le fichier n’autorise pas automatiquement la production : examinez séparément ces engagements."}, {"type": "p", "text": "**Point de contrôle :** votre solution nomme dossier réel, autorité et capacité, au-delà de « utiliser B ». Conservez les conditions ouvertes. **Suite :** vérifier si le coordonnateur peut financer la voie convenue."}]}, {"id": "l7_03", "lesson": "L7", "kicker": "Leçon 7 · 8 min", "title": "Rapprocher la proposition financée", "blocks": [{"type": "p", "text": "Ouvrez K4. Travaillez dans le registre du service du coordonnateur; la facture initiale du client reste exclue. Conservez d’abord l’offre initiale, puis ajoutez la révision avec avance volontaire comme version distincte."}, {"type": "table", "headers": ["Votre calcul", "Résultat attendu, CAD"], "rows": [["Prix moins coût complet modélisé", "5 600 − 5 000 = 600"], ["Manque préalable initial", "4 700 − 1 200 = 3 500"], ["Fonds initiaux et avance comprise", "1 200 + 3 500 = 4 700"], ["Après les paiements préalables", "4 700 − 4 700 = 0"], ["Solde conditionnel à l’acceptation complète", "5 600 − 3 500 = 2 100"]], "widths": [0.69, 0.31]}, {"type": "callout", "label": "Exercice", "text": "Expliquez l’utilité du calendrier révisé, puis nommez deux faits qu’il n’établit pas. Consignez utilisation permise de l’avance, remboursement des fonds inutilisés et inspection restant à payer."}, {"type": "callout", "label": "Retour", "text": "Il supprime le manque initial dans la branche favorable fournie parce que l’avance est reçue et disponible avant les factures. Il n’établit ni livraison réelle ni véritable achat. Il n’établit pas davantage le financement de chaque scénario d’échec. Le solde demeure conditionnel, pas déjà disponible."}, {"type": "p", "text": "Une branche réussie et entièrement payée terminerait à 1 800 $ après le paiement final de 300 $. Ces fonds comprennent les 1 200 $ initiaux. N’inscrivez pas le solde favorable avant que les conditions d’acceptation et d’encaissement de la branche soient fournies."}, {"type": "p", "text": "**Point de contrôle :** conservez les deux versions et leurs verdicts de financement distincts. **Suite :** découvrir le premier reçu et actualiser honnêtement la proposition."}]}, {"id": "l7_04", "lesson": "L7", "kicker": "Leçon 7 · 8 min", "title": "Conserver l’échec et sa facture impayée", "blocks": [{"type": "p", "text": "Ouvrez K5. Dans R1, le reçu fictif rapporte 9 800 étiquettes conformes dans le délai. P1 en exige 10 000 sans acceptation partielle; Morgan refuse la commande complète. Le solde de 2 100 $, conditionnel à l’acceptation, est retenu. K5 ajoute une facture d’inspection de 300 $, exigible malgré la quantité insuffisante."}, {"type": "callout", "label": "Exercice", "text": "Écrivez le verdict de résultat, les fonds disponibles, l’obligation impayée et le verdict commercial. Proposez une décision utile. N’effacez pas R1 et ne supposez pas qu’une branche ultérieure paie ses factures."}, {"type": "table", "headers": ["Dossier R1", "Conclusion défendable"], "rows": [["Résultat P1 sur table", "ÉCHEC : 9 800 ne respecte pas 10 000."], ["Trésorerie et dette", "Fonds à 0; facture exigible de 300 non financée."], ["Service complet modélisé", "ÉCHEC pour cet essai : pas d’acceptation complète; facture exigible de 300 non financée."], ["Livraison et marché réels", "NON ÉTABLIS : pièces et événements sont simulés."]], "widths": [0.32, 0.68]}, {"type": "callout", "label": "Retour", "text": "La détection correcte d’un échec peut coexister avec l’échec du résultat client. Conservez reçu, coûts engagés, inspection impayée et devoirs de reprise ou remboursement. Décidez si une réparation autorisée et financée est possible. Si le délai de P1 ne peut être respecté, une nouvelle entente ne rend pas R1 réussi rétroactivement."}, {"type": "p", "text": "**Point de contrôle :** le Passeport consigne un échec utile, pas une réussite atténuée. **Suite :** distinguer une nouvelle branche témoin d’une histoire réécrite."}]}, {"id": "l7_05", "lesson": "L7", "kicker": "Leçon 7 · 7 min", "title": "Clore le Passeport sans dépasser les preuves", "blocks": [{"type": "p", "text": "K6 est une **branche témoin positive sur table, distincte, partant d’un nouvel état initial supposé**. Elle possède sa propre autorisation et un reçu fictif de 10 000 étiquettes conformes acceptées par Morgan dans les conditions de P1. Ce n’est ni une réimpression physique, ni une reprise gratuite, ni un financement ou remplacement de R1."}, {"type": "callout", "label": "Exercice", "text": "Si vous exécutez R2, consignez acceptation complète, encaissement simulé de 2 100 $ et paiement de 300 $. Retrouvez le solde de 1 800 $. Sinon, marquez R2 NON EXÉCUTÉE, sans affirmation de résultat."}, {"type": "callout", "label": "Retour", "text": "R2 peut démontrer la branche favorable sur table sous les hypothèses fournies. Livraison physique, consentement véritable, paiement réel et marché viable restent NON ÉTABLIS. R1 conserve son échec, ses coûts, sa dette de 300 $ et ses obligations ouvertes."}, {"type": "bullets", "items": ["Promesse : avez-vous conservé P1 et sa version faisant autorité?", "Construction : la voie est-elle utilisable, permise et compatible avec les autres demandes?", "Économie : avance comprise, solde conditionnel, fonds initiaux et dette d’échec sont-ils distincts?", "Preuves : chaque verdict précise-t-il son périmètre en conservant le premier échec?"]}, {"type": "p", "text": "**Production :** un Passeport distinguant R1 et, le cas échéant, R2, puis deux minutes d’explication de la prochaine décision. Ce sont des productions d’apprentissage, pas une certification d’entreprise."}, {"type": "p", "text": "**Suite :** choisir une capacité à conserver pour un autre engagement. [C2, pp. 14–15, 22–23]"}]}, {"id": "l8_01", "lesson": "L8", "kicker": "Leçon 8 · 4 min", "title": "Conserver une capacité, puis tester son apport", "blocks": [{"type": "callout", "label": "Objectif", "text": "Choisir une capacité réutilisable, préciser son domaine de transfert et concevoir un test équitable sur une autre tâche."}, {"type": "p", "text": "ALPHA GENESIS FLYWHEEL Ω demande si le travail validé laisse plus qu’un résultat ponctuel : outils, savoir, relations ou ressources gagnées pouvant aider à construire une capacité différente. Leur utilité conservée reste une hypothèse jusqu’aux preuves de la prochaine tâche. [F3, pp. 3, 8, 20; C2, p. 23]"}, {"type": "figure", "name": "successor_loop", "caption": "Conserver une capacité avec ses conditions, comparer son apport sur un travail nouveau et différent, puis garder le résultat, y compris un transfert échoué."}, {"type": "callout", "label": "Trois affirmations distinctes", "text": "Les ressources gagnées peuvent financer la suite. Une capacité héritée peut améliorer une nouvelle tâche. Une méthode de découverte améliorée peut mieux réussir dans de nouvelles campagnes. Chacune demande ses preuves; une seconde facture n’établit pas ces affirmations générales."}, {"type": "p", "text": "**Suite :** définir ce qui est réutilisable et ce qu’il faut qualifier de nouveau."}]}, {"id": "l8_02", "lesson": "L8", "kicker": "Leçon 8 · 4 min", "title": "Un héritage utile a des conditions", "blocks": [{"type": "p", "text": "Supposons qu’un travail réel accepté produise une méthode maintenue pour rapprocher les modifications approuvées et préparer un dossier contrôlé. Un nouveau client demande ensuite des encarts d’emballage fabriqués par un autre procédé. La méthode pourrait aider; les anciennes étiquettes, l’ancien reçu et la permission de l’ancien client ne deviennent pas les réponses du nouveau cas."}, {"type": "table", "headers": ["Conserver si autorisé", "Rétablir pour la nouvelle tâche"], "rows": [["Méthode, structure et contrôles", "Nouvelle promesse faisant autorité et historique complet."], ["Prérequis et exemples d’échecs connus", "Nouvelles matières, équipements, qualités et acceptations à tester."], ["Relations permises et savoir opérationnel", "Droits actuels, consentements, capacité et financement."]], "widths": [0.44, 0.56]}, {"type": "callout", "label": "Comparaison résolue", "text": "Donnez à une voie conventionnelle compétente des informations et possibilités de ressources équivalentes. Comparez la nouvelle tâche avec et sans la méthode conservée. Mesurez résultat accepté et effort complet de préparation, adaptation et contrôle. Un modèle familier qui n’économise aucun travail utile n’a pas démontré son avantage."}, {"type": "p", "text": "Une méthode préparatoire réutilisable pourrait réduire le coût des petits mandats. En faire un service exige encore capacité maintenue sans conflits, offre intéressante et vrais acheteurs. Un second client choisissant une offre semblable teste la demande répétée; cela ne prouve pas automatiquement qu’une tâche différente est devenue possible. [C2, p. 23; F3, pp. 8, 20]"}, {"type": "p", "text": "**Suite :** concevoir un Test de réutilisation pouvant révéler un transfert utile ou échoué."}]}, {"id": "l8_03", "lesson": "L8", "kicker": "Leçon 8 · 4 min", "title": "Concevoir le test du prochain usage", "blocks": [{"type": "p", "text": "Choisissez un acquis de votre mise en situation : méthode de rapprochement des sources, format autorisé, contrôle de capacité ou registre financier et de verdicts. Nommez le nouveau problème qu’il pourrait aider à résoudre et les changements nécessaires."}, {"type": "numbered", "items": ["Nommez un autre bénéficiaire, produit ou procédé et son résultat autorisé.", "Identifiez capacité conservée, version, permissions et prérequis. Préservez les échecs connus.", "Définissez une comparaison compétente sans cet héritage, avec informations initiales pertinentes et ressources équivalentes.", "Choisissez les mesures décisives de résultat et d’effort, la prochaine observation et son responsable."]}, {"type": "callout", "label": "Exercice", "text": "Une équipe réemploie le même formulaire pour une deuxième vente et annonce une « économie de continuité qui s’améliore elle-même ». Formulez une affirmation plus limitée et le test supplémentaire nécessaire."}, {"type": "callout", "label": "Retour", "text": "Une vente et un encaissement réels peuvent étayer une observation de nouvel achat à ce périmètre. Pour démontrer un héritage utile, montrez l’apport à une tâche distincte. Pour démontrer une meilleure découverte, comparez de nouvelles campagnes avec des alternatives fortes également équipées. Conservez coûts d’adaptation et échecs. [C2, p. 23; F3, pp. 3, 8, 20]"}, {"type": "p", "text": "**Production :** un Test de réutilisation dont l’apport annoncé peut être infirmé. Les 600 $ inventés de la mise en situation ne financent aucun projet réel. Il faut des ressources encaissées, libres d’usage après les obligations restantes."}, {"type": "p", "text": "**Suite :** choisir une action concrète dans votre contexte."}]}, {"id": "l8_04", "lesson": "L8", "kicker": "Leçon 8 · 3 min", "title": "Choisir votre prochaine action", "blocks": [{"type": "p", "text": "Reprenez votre réponse initiale : « L’application s’ouvre et la sauvegarde se charge. La promesse au client est-elle préservée? » Améliorez-la avec un engagement précis, une preuve nécessaire et une prochaine action."}, {"type": "callout", "label": "Une réponse finale solide", "text": "« L’application rétablie est un composant. Il faut encore établir la commande acceptée complète, une voie autorisée utilisable, capacité et financement, puis réception et acceptation réelles selon les conditions initiales. Je commencerais par examiner l’historique faisant autorité jusqu’à la limite convenue. »"}, {"type": "p", "text": "Choisissez un engagement important dans votre contexte. Limitez le premier exercice pour qu’il tranche une question utile : préciser l’acceptation, construire une transmission autorisée manquante ou mener un exercice comparatif avec des participants désignés. Ne commencez pas par promettre une garantie générale."}, {"type": "numbered", "items": ["Nommez le résultat réel et la personne pouvant l’autoriser ou l’accepter.", "Repérez la condition ouverte la plus déterminante.", "Choisissez une construction ou observation susceptible de changer la décision.", "Nommez responsable, date et périmètre autorisé. Conservez résultat et limites."]}, {"type": "callout", "label": "Votre vérification finale", "text": "Pouvez-vous expliquer pourquoi 10 000 fait autorité, pourquoi 5 000 de plus surcharge le créneau, pourquoi l’avance est comprise dans le prix, pourquoi R1 doit 300, pourquoi R2 ne l’efface pas, et ce qu’un successeur utile doit démontrer? Reprenez toute leçon dont le raisonnement demeure flou."}, {"type": "p", "text": "**Production :** votre Prochaine action et votre réponse initiale révisée. Le cours réussit lorsque vous savez prendre et expliquer une meilleure décision concrète : construire une capacité manquante, choisir un service existant ou arrêter un plan non étayé."}]}]}}, "workbook": {"en": {"document": "workbook", "lang": "en", "title": "Build a continuity route", "subtitle": "A practical workbook for CONTINUITY Ω MasterClass 101", "sources": ["C1"], "pages": [{"id": "w01", "lesson": "O", "kicker": "Orientation · 10 minutes", "title": "Choose a promise worth keeping", "blocks": [{"type": "p", "text": "By the end, you will have a usable promise card, a constructed alternative, a cost and cash ledger, and a bounded decision. Work in pairs or a small team. No coding is needed."}, {"type": "callout", "label": "Working rule", "text": "Every printed case record, approval, receipt and payment is fictional. Use the case for the exercises. For your own business, enter fresh evidence references or NOT ESTABLISHED. Completing this workbook gives no permission to activate a service."}, {"type": "field", "label": "Which customer result matters in your work?", "prompt": "Name one beneficiary, result and deadline. Keep confidential details in their authorized location.", "lines": 3}, {"type": "field", "label": "What is your starting hypothesis?", "prompt": "How might the usual route fail? What would you need to construct so the customer still receives the promised result?", "lines": 3}, {"type": "field", "label": "Who will do what in the exercise?", "prompt": "Choose coordinator, customer/Morgan, provider and reviewer roles. One person may hold two roles; disclose that overlap.", "lines": 2}, {"type": "p", "text": "Keep facts, assumptions and missing evidence visible. Record FAILED when evidence shows the scoped claim failed; NOT ESTABLISHED when decisive evidence is missing. Preserve earlier attempts. [C1, pp. 7–8, 13–14]"}]}, {"id": "w02", "lesson": "L1", "kicker": "Case file · K0 and K1", "title": "The promise and its source records", "blocks": [{"type": "callout", "label": "K0 · Frozen promise P1", "text": "Printer A owes 10,000 packaging labels to its customer. They must be received and accepted by Thursday 12 November 2026, 16:00, America/Toronto, at the fictional Montréal warehouse, dock 3, site M1. Morgan is the customer’s named acceptance lead. No short shipment or quality substitution is authorized."}, {"type": "table", "headers": ["Acceptance item", "Printed teaching specification"], "rows": [["Artwork / material", "Approved artwork v3; matte white self-adhesive stock."], ["Dimensions / quality", "50 × 30 mm, tolerance ±0.5 mm; approved readable code; damaged labels do not count."], ["Receipt / decision", "Morgan checks count, specification, quality, place and receipt/acceptance times."], ["Disruption", "Printer A’s order system and production are unavailable; its normal artwork login is also unavailable."]], "widths": [0.28, 0.72]}, {"type": "callout", "label": "K1 · Reconstruct the obligation", "text": "The restored checkpoint covers Tuesday 10 November, 12:00 and shows 8,000 labels. Authorized amendment A-02, recorded Tuesday at 14:00, adds 2,000. Custodian log C-01 covers through the frozen cutoff: Wednesday 11 November, 12:00, America/Toronto. It lists no cancellation or further amendment. The supplied log is separately accessible from the affected system."}, {"type": "p", "text": "Treat these printed records as exercise assumptions. A real use would need authenticated origin, authority and coverage through the cutoff. A checksum alone cannot establish completeness. The original customer invoice is outside the continuity-service ledger. [C1, pp. 9–11]"}]}, {"id": "w03", "lesson": "L1", "kicker": "Practice · Promise card", "title": "Write what must remain true", "blocks": [{"type": "p", "text": "Use K0–K1. Write the customer’s result before discussing technology or suppliers. A server restart and a dispatched shipment are intermediate events. [C1, pp. 7–8]"}, {"type": "field", "label": "What exactly must be received and accepted?", "prompt": "Quantity, artwork/material, dimensions, quality and permitted partial delivery. Cite P1 and the amendment.", "lines": 3}, {"type": "field", "label": "When, where and by whose decision?", "prompt": "Calendar date, time zone, receipt and acceptance deadline, site and named authority.", "lines": 2}, {"type": "field", "label": "Which conditions define this exercise?", "prompt": "Unavailable systems, permitted actions and data, stop authority and excluded interventions.", "lines": 2}, {"type": "field", "label": "What evidence would establish this result?", "prompt": "Receipt, counts, quality check, authority and times. Name what a tabletop can establish and what requires actual goods.", "lines": 3}, {"type": "callout", "label": "Check with a partner", "text": "Could your partner reject 9,800 labels, an old artwork version or a late delivery using only this card? If not, sharpen the acceptance rule. Then answer Q01–Q02."}]}, {"id": "w04", "lesson": "L2", "kicker": "Practice · Route card", "title": "Construct the missing means", "blocks": [{"type": "callout", "label": "K2 · Capacity facts", "text": "Printer B can make 12,000 qualified units in the relevant window. Existing protected work uses 2,000. P1 needs 10,000. Another buyer now asks for 5,000 in the same window. These figures cover qualified materials, people, setup and transport in this fictional case; a real provider must evidence them."}, {"type": "table", "headers": ["Needed means", "Available evidence / missing part", "Construction or decision"], "rows": [["Current obligation", "", ""], ["Approved production packet", "", ""], ["Usable capacity window", "", ""], ["Rights and release channel", "", ""]], "widths": [0.25, 0.4, 0.35]}, {"type": "field", "label": "What will you build, obtain or change?", "prompt": "Name an owner, usable output and completion check. Include the work and cost of creating the alternative.", "lines": 3}, {"type": "field", "label": "What could disable both routes?", "prompt": "The shared artwork login is unavailable. Describe a permitted alternative and how you would check it.", "lines": 2}, {"type": "field", "label": "What happens to the extra 5,000-unit request?", "prompt": "Calculate total simultaneous demand. Choose an honest reservation, additional qualified capacity or a refusal.", "lines": 2}, {"type": "p", "text": "A useful route joins the missing complements; identifying the vulnerability alone has not built them. Answer Q03–Q04. [C1, pp. 11–13]"}]}, {"id": "w05", "lesson": "L3", "kicker": "Practice · Arrangement map", "title": "Make the exchange usable for each party", "blocks": [{"type": "callout", "label": "K3 · Initial position and update", "text": "Initially B expresses interest only; no reservation or data permission exists. In the update, simulated records CONS-A, CONS-M and RES-B authorize P1 activation, limited sharing and B’s 10,000-unit slot. The custodian releases the current packet through a separately accessible channel. No extra 5,000-unit reservation is accepted."}, {"type": "p", "text": "CONS-M permits artwork, specification, quantity and destination to B and the coordinator for P1 only; no onward sharing. Keep copies until case closure plus seven days, then delete them. Morgan retains acceptance authority. These are fictional terms for discussion, not recommended terms for every business."}, {"type": "table", "headers": ["Participant", "Contribution and return", "Evidence / unresolved term"], "rows": [["Printer A · service buyer", "", ""], ["Printer B · provider", "", ""], ["Customer / Morgan", "", ""], ["Coordinator · seller", "", ""], ["Reviewer", "", ""]], "widths": [0.28, 0.36, 0.36]}, {"type": "field", "label": "Which term would you accept, refuse or counteroffer?", "prompt": "Consider price, capacity, permissions, activation, failure and refund duties. Explain why another party would voluntarily agree.", "lines": 3}, {"type": "p", "text": "Interest is different from commitment; commitment is different from usable capacity or received money. Disclose overlapping roles and reviewer incentives. Answer Q05–Q06. [C1, pp. 11–13, 17–18]"}]}, {"id": "w06", "lesson": "L4", "kicker": "Practice · Cost and cash ledger, part 1", "title": "Price the complete teaching case", "blocks": [{"type": "p", "text": "All amounts are invented CAD on one consistent basis. The coordinator sells the continuity service to Printer A for 5,600. The original customer invoice is excluded. For this exercise only, the six rows are assumed to cover the complete scope and overhead; no other cash duties are initially assumed."}, {"type": "table", "headers": ["Modeled cost", "CAD", "Payment timing"], "rows": [["Alternate production", "3,200", "Before acceptance"], ["Prepared and checked packet", "550", "Before acceptance"], ["Transport", "400", "Before acceptance"], ["Coordination and allocated overhead", "350", "Before acceptance"], ["Readiness test", "200", "Before acceptance"], ["Final inspection", "300", "After acceptance; see K5 for failure trigger"]], "widths": [0.56, 0.12, 0.32]}, {"type": "table", "headers": ["Calculate", "Your amount"], "rows": [["Complete modeled cost", ""], ["Projected fee minus complete cost", ""], ["Preacceptance outflows", ""], ["Gap with 1,200 uncommitted cash", ""]], "widths": [0.7, 0.3]}, {"type": "field", "label": "What would a real complete-cost record still need?", "prompt": "Identify costs, duties or uncertainty you would investigate: acquisition, internal time, failed attempts, insurance, financing, refunds or support. Do not invent amounts.", "lines": 2}, {"type": "p", "text": "A positive projected contribution does not make each payment date fundable. A quoted price is not collected money. Answer Q07. [C1, pp. 17–19]"}]}, {"id": "w07", "lesson": "L4", "kicker": "Practice · Cost and cash ledger, part 2", "title": "Fund the route before committing", "blocks": [{"type": "callout", "label": "K4 · Funding extension and failure terms", "text": "Opening uncommitted cash is 1,200. Printer A voluntarily accepts a simulated 3,500 advance, included in the 5,600 fee. It is received and available before costs. It may offset authorized, documented nonrecoverable preacceptance costs; any unspent amount is refundable. The remaining 2,100 is due only after full acceptance. A real buyer may reject or renegotiate these terms."}, {"type": "p", "text": "Complete the favorable modeled path below. The full 5,000 cost must leave the ledger. No deposit is automatically unrestricted, and a promised receipt is not available cash. [C1, pp. 18–19]"}, {"type": "table", "headers": ["Stage", "In", "Out", "Cash after stage"], "rows": [["Opening state", "", "", ""], ["Advance received", "", "", ""], ["Preacceptance work paid", "", "", ""], ["Full acceptance + balance received", "", "", ""], ["Inspection paid", "", "", ""]], "widths": [0.46, 0.16, 0.16, 0.22]}, {"type": "field", "label": "What blocks the original plan without the advance?", "prompt": "Name the amount, decision point and a possible voluntary repair. Preserve the original unfunded plan.", "lines": 2}, {"type": "field", "label": "What must be checked before using an advance?", "prompt": "Authority, actual cleared funds, restrictions, eligible costs, refund duties and the next due payment.", "lines": 2}, {"type": "p", "text": "K5 later changes the outcome and triggers the failure invoice. Keep that failed branch separate. Answer Q08."}]}, {"id": "w08", "lesson": "L5", "kicker": "Practice · Claim and evidence record", "title": "Give each claim the evidence it needs", "blocks": [{"type": "p", "text": "Use DEMONSTRATED, FAILED or NOT ESTABLISHED for each precise claim. Add “within the tabletop” wherever the evidence is simulated. An accepted plan, an exercise result and actual accepted goods are different claims. [C1, pp. 7–8, 13–14]"}, {"type": "table", "headers": ["Claim", "Evidence / missing evidence", "Scoped status"], "rows": [["Obligation reconstructed", "", ""], ["Complete route ready", "", ""], ["Customer outcome accepted", "", ""], ["Whole-service feasibility", "", ""], ["Commercial value established", "", ""]], "widths": [0.31, 0.44, 0.25]}, {"type": "field", "label": "Who checks, and how independently?", "prompt": "Method, raw sources, custody, execution control, organizational relationships and incentives. Identify what the checker must trust.", "lines": 3}, {"type": "field", "label": "Which observation could overturn your preferred answer?", "prompt": "State a concrete challenge and the record or measurement that would settle it.", "lines": 2}, {"type": "callout", "label": "A useful boundary", "text": "A separate program is not automatically an independent institution. A saved favorable report is not necessarily a fresh check. The result applies only to its stated promise, conditions and evidence. Answer Q09–Q10 when the relevant facts have been discussed."}]}, {"id": "w09", "lesson": "L6", "kicker": "Practice · Comparison card", "title": "Let a capable alternative win", "blocks": [{"type": "p", "text": "The baseline is a competent operations team using the same approved packet, Printer B, capacity and financial terms. Compare it with the proposed CONTINUITY Ω method. A direct AI-assisted route is another candidate only if actually executed; otherwise mark NOT RUN. [C1, pp. 19–20]"}, {"type": "table", "headers": ["Candidate", "Outcome and complete-cost measures", "Evidence / status"], "rows": [["Competent conventional route", "", ""], ["CONTINUITY Ω route", "", ""], ["Direct AI-assisted route", "", ""], ["No purchase / self-provision", "", ""]], "widths": [0.31, 0.42, 0.27]}, {"type": "field", "label": "What must be equal for a fair comparison?", "prompt": "Promise, records, permissions, provider, capacity, starting resources, difficulty and access to human help.", "lines": 2}, {"type": "field", "label": "What would change the buying decision?", "prompt": "Define a useful improvement and the full effort/cost to measure. Distinguish a quote, estimate and observed result.", "lines": 3}, {"type": "field", "label": "What if the conventional route wins?", "prompt": "Record the stronger option and the evidence. Identify any remaining reason to buy or choose not to buy.", "lines": 2}, {"type": "p", "text": "No observed comparative performance is supplied in this course. Do not turn an attractive design into a measured advantage. Answer Q11."}]}, {"id": "w10", "lesson": "L7", "kicker": "Capstone · 35 minutes · release K5 and K6 in sequence", "title": "Two records, two separate histories", "blocks": [{"type": "p", "text": "Use K0–K4 from this workbook. Cover K5–K6 until requested. Agree on a route, its terms and funding first; then release K5. Your outputs are the decision log and Capstone Passport."}, {"type": "callout", "label": "K5 · R1 receipt and failure invoice", "text": "At 15:40 on 12 November, mock receipt R1 records 9,800 conforming v3 labels at M1. Morgan acknowledges those units but does not give P1 full acceptance. The 4,700 preacceptance costs were paid; the 3,500 advance was applied to documented eligible nonrecoverable costs. The simulated inspector invoices 300, due now even after failure: this explicit failure trigger supplements K4. No 2,100 balance payment or repair agreement is supplied. Any unused advance would remain refundable."}, {"type": "callout", "label": "K6 · Optional separate positive control", "text": "R2 is a separate positive-control tabletop branch from a fresh assumed starting state, with its own simulated approval and the same K0–K4 resources. Its new mock receipt records all 10,000 conforming labels received and accepted by Morgan at M1 at 15:40. A separate learner checks the records. Simulated settlement records receipt of the 2,100 balance and payment of the 300 inspection charge."}, {"type": "p", "text": "Do not replace R1 or use R2’s modeled money to settle it. Preserve R1 costs, debts and unresolved repair duties. Neither branch establishes actual manufacturing, actual payment or a real market. A physical rerun would require new authorization, resources and treatment of prior obligations."}]}, {"id": "w11", "lesson": "L7", "kicker": "Capstone · Decision log", "title": "Show what changed each decision", "blocks": [{"type": "table", "headers": ["Stage", "Proceed / hold / stop and reason", "Owner / evidence"], "rows": [["K0–K1 · original obligation", "", ""], ["K2–K3 · capacity and consent", "", ""], ["K4 · funding terms", "", ""], ["K5 · failed R1 record", "", ""], ["K6 · separate R2, if used", "", ""]], "widths": [0.31, 0.45, 0.24]}, {"type": "field", "label": "Which complete arrangement are you proposing?", "prompt": "Buyer, seller, provider, beneficiary; missing means constructed; permissions; capacity; voluntary price and failure terms.", "lines": 3}, {"type": "field", "label": "What is due after R1, and what funds it?", "prompt": "Available cash, conditional receipts excluded, inspection invoice, refund basis, unresolved repair duties and the next authorized decision.", "lines": 3}, {"type": "field", "label": "What is your strongest alternative?", "prompt": "Same promise and resources. Explain why the chosen route, a revision or no purchase is reasonable; name any comparison not run.", "lines": 2}, {"type": "p", "text": "A constructive stop records the exact obstacle and a viable next proposal. Do not repair the worksheet by changing the original quantity or deadline."}]}, {"id": "w12", "lesson": "L7", "kicker": "Capstone · Passport and peer feedback", "title": "State the result you can defend", "blocks": [{"type": "table", "headers": ["Claim", "Verdict", "Evidence / boundary"], "rows": [["P1 obligation reconstructed", "", ""], ["Modeled route readiness", "", ""], ["R1 tabletop outcome", "", ""], ["R2 tabletop outcome, if used", "", ""], ["Actual physical delivery", "", ""], ["Real commercial value", "", ""]], "widths": [0.39, 0.22, 0.39]}, {"type": "field", "label": "What can the next reader rely on?", "prompt": "Promise/version, scope, record IDs, reviewer and relationship, remaining uncertainty, expiry or recheck trigger.", "lines": 3}, {"type": "p", "text": "Peer feedback uses six criteria: promise; constructed means/capacity; voluntary arrangement; full cost/cash; evidence and bounded verdicts; fair comparison and useful next step. Score each 0 = missing/wrong, 1 = partial, 2 = supported. This 12-point teaching rubric is not validated and is not business certification."}, {"type": "field", "label": "What is the most useful revision?", "prompt": "Record total /12, the specific evidence supporting it and one change to improve the work. The facilitator guide contains anchors.", "lines": 2}, {"type": "callout", "label": "Before submitting", "text": "Retain the R1 failure. Do not count the conditional 2,100 after rejection. Do not describe mock goods or simulated payments as real. Rework those errors regardless of score."}]}, {"id": "w13", "lesson": "L8", "kicker": "Practice · Reuse test and next action", "title": "Give the next use its own test", "blocks": [{"type": "p", "text": "A useful retained capability might be the approved obligation format, source-review method or reservation procedure. A second label sale tests repeat demand. A different task needs its own promise and evidence. [C1, p. 21]"}, {"type": "field", "label": "What capability is worth retaining?", "prompt": "Name the artifact or method, rights, costs, known failures and what must be updated.", "lines": 2}, {"type": "field", "label": "Which different promise could it help fulfill?", "prompt": "For example, a tool-rental business honoring bookings after a scheduling outage. Specify the new beneficiary and accepted result.", "lines": 2}, {"type": "field", "label": "How will you test its contribution?", "prompt": "Compare with and without the retained capability under equivalent resources. Include adaptation, requalification, human effort and full cost; mark unrun work NOT RUN.", "lines": 3}, {"type": "field", "label": "What will you do next in your own setting?", "prompt": "One reversible preparation step, owner, evidence needed and a review date. Any activation requires fresh authority, consent, capacity and funds.", "lines": 2}, {"type": "p", "text": "Complete Q12, then revisit your starting hypothesis. State what changed your judgment and what remains unknown. Course completion is a learning milestone, not evidence of an operational continuity service."}]}, {"id": "quiz_1", "lesson": "REF", "kicker": "Learning check", "title": "Choose one answer per question · 1–4", "blocks": [{"type": "p", "text": "**Q01 · Which event meets the frozen promise P1?**"}, {"type": "bullets", "items": ["A · Printer B restarts its equipment.", "B · 10,000 labels leave Printer B by 16:00.", "C · Morgan receives and accepts 10,000 conforming v3 labels at site M1 by the deadline."]}, {"type": "p", "text": "**Q02 · P1 forbids partial acceptance. Only 9,800 conforming labels arrive on time. How should the original result be recorded?**"}, {"type": "bullets", "items": ["A · Failed against P1; record any new agreement separately.", "B · Change P1 to 9,800 and mark it passed.", "C · Passed, because 98% arrived on time."]}, {"type": "p", "text": "**Q03 · The checkpoint says 8,000. An authorized amendment adds 2,000 before the cutoff. What quantity should the reconstructed obligation use?**"}, {"type": "bullets", "items": ["A · 8,000, because the restored database is working.", "B · 10,000, after checking the amendment’s authority and coverage through the cutoff.", "C · 12,000, because that is the alternate printer’s capacity."]}, {"type": "p", "text": "**Q04 · Both printers need the same unavailable login to obtain approved artwork. What directly addresses the missing means?**"}, {"type": "bullets", "items": ["A · Describe Printer B as independent and proceed.", "B · Build and test an authorized, separately accessible current packet and release channel.", "C · Send whatever artwork someone remembers."]}, {"type": "field", "label": "Your choices and one uncertainty", "prompt": "Write the four letters. Mark any answer you want to discuss. This checks learning, not certification.", "lines": 2}]}, {"id": "quiz_2", "lesson": "REF", "kicker": "Learning check", "title": "Choose one answer per question · 5–8", "blocks": [{"type": "p", "text": "**Q05 · Capacity is 12,000; protected work is 2,000; P1 needs 10,000. Another simultaneous request needs 5,000. What follows?**"}, {"type": "bullets", "items": ["A · Both requests fit because each is below 12,000.", "B · There are 5,000 units left for the new request.", "C · Total demand is 17,000 against 12,000; both cannot receive unconditional coverage."]}, {"type": "p", "text": "**Q06 · Printer B says, “We could probably help.” What has this established?**"}, {"type": "bullets", "items": ["A · Interest; a usable reservation and its terms still need confirmation.", "B · A binding, usable reservation for P1.", "C · Collected commercial value for the coordinator."]}, {"type": "p", "text": "**Q07 · The modeled fee is CAD 5,600 and complete modeled cost is CAD 5,000. What is the projected contribution?**"}, {"type": "bullets", "items": ["A · CAD 1,800.", "B · CAD 600.", "C · CAD 5,600."]}, {"type": "p", "text": "**Q08 · CAD 4,700 is due before acceptance; CAD 1,200 is available. A CAD 3,500 advance is included in the CAD 5,600 fee. Which statement is correct?**"}, {"type": "bullets", "items": ["A · The total service revenue becomes CAD 9,100.", "B · A proposed advance is automatically available cash.", "C · The gap is CAD 3,500; CAD 2,100 remains conditional on full acceptance."]}, {"type": "field", "label": "Your choices and one uncertainty", "prompt": "Write the four letters. Mark any answer you want to discuss. This checks learning, not certification.", "lines": 2}]}, {"id": "quiz_3", "lesson": "REF", "kicker": "Learning check", "title": "Choose one answer per question · 9–12", "blocks": [{"type": "p", "text": "**Q09 · The mock R1 receipt records 9,800 conforming units. Cash is zero after the modeled preacceptance costs. What is the sound next record?**"}, {"type": "bullets", "items": ["A · P1 failed in the tabletop; do not count the conditional CAD 2,100; record the unpaid inspection and next decision.", "B · P1 passed and the full CAD 5,600 fee is earned.", "C · Actual physical delivery is independently certified."]}, {"type": "p", "text": "**Q10 · A reviewer is paid by the supplier. Which description of independence is defensible?**"}, {"type": "bullets", "items": ["A · A separate software checker proves complete institutional independence.", "B · Disclose the relationship, method, source custody and limits; assess independence for the particular claim.", "C · A favorable report guarantees all future deliveries."]}, {"type": "p", "text": "**Q11 · Which comparison could support a useful buying decision?**"}, {"type": "bullets", "items": ["A · Give only CONTINUITY Ω the approved amendment and alternate printer.", "B · Compare only software execution time.", "C · Use the same promise, usable records and resources; count complete costs and human work; allow a conventional winner."]}, {"type": "p", "text": "**Q12 · What would support the claim that a retained capability enabled a different next use?**"}, {"type": "bullets", "items": ["A · A fresh distinct task compared with and without that capability under equivalent resources, including adaptation costs.", "B · Another description of the same successful label order.", "C · Keeping a file and calling it a flywheel."]}, {"type": "field", "label": "Your choices and one uncertainty", "prompt": "Write the four letters. Mark any answer you want to discuss. This checks learning, not certification.", "lines": 2}]}]}, "fr": {"document": "workbook", "lang": "fr", "title": "Construire une voie de continuité", "subtitle": "Cahier pratique de CONTINUITÉ Ω Masterclass 101", "sources": ["C2"], "pages": [{"id": "w01", "lesson": "O", "kicker": "Orientation · 10 minutes", "title": "Choisir une promesse qui compte", "blocks": [{"type": "p", "text": "À la fin, vous disposerez d’une fiche de promesse, d’une solution de relève construite, d’un registre des coûts et fonds, puis d’une décision délimitée. Travailler à deux ou en petite équipe. Aucune programmation n’est requise."}, {"type": "callout", "label": "Règle de travail", "text": "Tous les dossiers, autorisations, réceptions et paiements du cas sont fictifs. Utiliser le cas pour les exercices. Pour votre entreprise, inscrire des références de preuves nouvelles ou NON ÉTABLI. Remplir ce cahier ne permet pas d’activer un service."}, {"type": "field", "label": "Quel résultat client compte dans votre activité?", "prompt": "Nommer un bénéficiaire, un résultat et une échéance. Garder les informations confidentielles à leur emplacement autorisé.", "lines": 3}, {"type": "field", "label": "Quelle est votre hypothèse de départ?", "prompt": "Comment la voie habituelle pourrait-elle échouer? Que faudrait-il construire pour que le client reçoive encore le résultat promis?", "lines": 3}, {"type": "field", "label": "Qui fait quoi dans l’exercice?", "prompt": "Choisir les rôles de coordinateur, client/Morgan, prestataire et évaluateur. Une personne peut cumuler deux rôles; déclarer ce cumul.", "lines": 2}, {"type": "p", "text": "Rendre visibles faits, hypothèses et preuves manquantes. Inscrire ÉCHEC si les preuves réfutent l’affirmation délimitée; NON ÉTABLI si une preuve décisive manque. Conserver les essais antérieurs. [C2, pp. 7–9, 13–15]"}]}, {"id": "w02", "lesson": "L1", "kicker": "Dossier du cas · K0 et K1", "title": "La promesse et les sources", "blocks": [{"type": "callout", "label": "K0 · Promesse fixée P1", "text": "L’imprimeur A doit fournir 10 000 étiquettes d’emballage à son client. Elles doivent être reçues et acceptées le jeudi 12 novembre 2026 avant 16 h, America/Toronto, à l’entrepôt fictif de Montréal, quai 3, site M1. Morgan est responsable de l’acceptation chez le client. Aucune livraison partielle ni substitution de qualité n’est autorisée."}, {"type": "table", "headers": ["Critère", "Spécification pédagogique fournie"], "rows": [["Visuel / matériau", "Visuel approuvé v3; support blanc mat autocollant."], ["Dimensions / qualité", "50 × 30 mm, tolérance ±0,5 mm; code approuvé lisible; les étiquettes endommagées ne comptent pas."], ["Réception / décision", "Morgan vérifie quantité, spécification, qualité, lieu et heures de réception et d’acceptation."], ["Perturbation", "Le système de commandes et la production de A sont indisponibles, ainsi que l’accès habituel au visuel."]], "widths": [0.28, 0.72]}, {"type": "callout", "label": "K1 · Reconstituer l’engagement", "text": "Le point de reprise couvre le mardi 10 novembre à 12 h et indique 8 000 étiquettes. La modification autorisée A-02, inscrite mardi à 14 h, en ajoute 2 000. Le registre du dépositaire C-01 couvre jusqu’à la borne fixée : mercredi 11 novembre à 12 h, America/Toronto. Il ne mentionne aucune annulation ni autre modification. Il est accessible séparément du système touché."}, {"type": "p", "text": "Ces documents sont des hypothèses d’exercice. Un usage réel exige origine authentifiée, autorité et couverture jusqu’à la borne. Une empreinte seule ne démontre pas la complétude. La facture du client initial est exclue du registre du service de continuité. [C2, pp. 9–12]"}]}, {"id": "w03", "lesson": "L1", "kicker": "Exercice · Fiche de promesse", "title": "Écrire ce qui doit rester vrai", "blocks": [{"type": "p", "text": "Utiliser K0–K1. Définir le résultat client avant les technologies et les fournisseurs. Redémarrer un serveur ou expédier un colis reste une étape intermédiaire. [C2, pp. 7–9]"}, {"type": "field", "label": "Que doit-on recevoir et accepter exactement?", "prompt": "Quantité, visuel/matériau, dimensions, qualité et livraison partielle permise. Référencer P1 et sa modification.", "lines": 3}, {"type": "field", "label": "Quand, où et par quelle autorité?", "prompt": "Date, fuseau, échéances de réception et d’acceptation, site et responsable nommé.", "lines": 2}, {"type": "field", "label": "Quelles conditions délimitent cet exercice?", "prompt": "Systèmes indisponibles, actions et données permises, autorité d’arrêt et interventions exclues.", "lines": 2}, {"type": "field", "label": "Quelles preuves établiraient ce résultat?", "prompt": "Réception, quantité, contrôle qualité, autorité et heures. Distinguer ce qu’établit la simulation de ce qui exige de vrais biens.", "lines": 3}, {"type": "callout", "label": "Vérification à deux", "text": "Votre partenaire peut-il refuser 9 800 étiquettes, un ancien visuel ou une livraison tardive à partir de cette seule fiche? Sinon, préciser la règle d’acceptation. Répondre ensuite à Q01–Q02."}]}, {"id": "w04", "lesson": "L2", "kicker": "Exercice · Fiche de réalisation", "title": "Construire les moyens manquants", "blocks": [{"type": "callout", "label": "K2 · Données de capacité", "text": "L’imprimeur B peut produire 12 000 unités qualifiées dans la période visée. Le travail déjà protégé en mobilise 2 000. P1 en exige 10 000. Un autre acheteur en demande 5 000 simultanément. Dans ce cas fictif, matériaux, personnel, réglages et transport sont couverts; un prestataire réel doit en fournir les preuves."}, {"type": "table", "headers": ["Moyen requis", "Preuve disponible / manque", "Construction ou décision"], "rows": [["Engagement à jour", "", ""], ["Dossier de production approuvé", "", ""], ["Créneau utilisable", "", ""], ["Droits et canal de lancement", "", ""]], "widths": [0.25, 0.4, 0.35]}, {"type": "field", "label": "Que construirez-vous, obtiendrez-vous ou changerez-vous?", "prompt": "Nommer un responsable, un résultat utilisable et un contrôle d’achèvement. Compter le travail et le coût de création de la solution.", "lines": 3}, {"type": "field", "label": "Qu’est-ce qui pourrait bloquer les deux voies?", "prompt": "L’accès commun au visuel est indisponible. Décrire une autre voie autorisée et son contrôle.", "lines": 2}, {"type": "field", "label": "Que devient la demande supplémentaire de 5 000?", "prompt": "Calculer la demande simultanée totale. Choisir une réservation honnête, une capacité qualifiée supplémentaire ou un refus.", "lines": 2}, {"type": "p", "text": "Une voie utile réunit les moyens complémentaires manquants; découvrir la vulnérabilité ne les construit pas. Répondre à Q03–Q04. [C2, pp. 11–13]"}]}, {"id": "w05", "lesson": "L3", "kicker": "Exercice · Carte de l’arrangement", "title": "Rendre l’échange acceptable et utilisable", "blocks": [{"type": "callout", "label": "K3 · Situation initiale et mise à jour", "text": "Au départ, B exprime seulement un intérêt : aucune réservation ni autorisation de données. Ensuite, les traces simulées CONS-A, CONS-M et RES-B autorisent le lancement de P1, un partage limité et le créneau de 10 000 unités. Le dépositaire fournit le dossier actuel par un canal accessible séparément. Aucune réservation supplémentaire de 5 000 n’est acceptée."}, {"type": "p", "text": "CONS-M permet de transmettre visuel, spécification, quantité et destination à B et au coordinateur pour P1 seulement, sans retransmission. Garder les copies jusqu’à sept jours après clôture du cas, puis les supprimer. Morgan conserve l’autorité d’acceptation. Ces conditions fictives servent à discuter; elles ne conviennent pas nécessairement à toute entreprise."}, {"type": "table", "headers": ["Participant", "Contribution et contrepartie", "Preuve / condition à régler"], "rows": [["Imprimeur A · acheteur", "", ""], ["Imprimeur B · prestataire", "", ""], ["Client / Morgan", "", ""], ["Coordinateur · vendeur", "", ""], ["Évaluateur", "", ""]], "widths": [0.28, 0.36, 0.36]}, {"type": "field", "label": "Quelle condition accepter, refuser ou renégocier?", "prompt": "Considérer prix, capacité, droits, lancement, échec et remboursement. Expliquer pourquoi l’autre partie accepterait librement.", "lines": 3}, {"type": "p", "text": "Intérêt, engagement, capacité utilisable et fonds reçus sont distincts. Déclarer cumuls de rôles et incitations de l’évaluateur. Répondre à Q05–Q06. [C2, pp. 12–13, 18–19]"}]}, {"id": "w06", "lesson": "L4", "kicker": "Exercice · Coûts et fonds, partie 1", "title": "Chiffrer le cas pédagogique complet", "blocks": [{"type": "p", "text": "Tous les montants sont fictifs, en CAD, sur une base cohérente. Le coordinateur vend le service de continuité à A pour 5 600. La facture du client initial est exclue. Pour cet exercice seulement, les six lignes couvrent le périmètre complet et les frais généraux; aucune autre obligation de trésorerie n’est supposée au départ."}, {"type": "table", "headers": ["Coût modélisé", "CAD", "Paiement"], "rows": [["Production de relève", "3 200", "Avant acceptation"], ["Dossier préparé et vérifié", "550", "Avant acceptation"], ["Transport", "400", "Avant acceptation"], ["Coordination et frais généraux affectés", "350", "Avant acceptation"], ["Essai de préparation", "200", "Avant acceptation"], ["Inspection finale", "300", "Après acceptation; voir K5 en cas d’échec"]], "widths": [0.56, 0.12, 0.32]}, {"type": "table", "headers": ["À calculer", "Votre montant"], "rows": [["Coût complet modélisé", ""], ["Prix prévu moins coût complet", ""], ["Sorties avant acceptation", ""], ["Manque avec 1 200 disponibles", ""]], "widths": [0.7, 0.3]}, {"type": "field", "label": "Que faudrait-il encore vérifier dans un coût réel?", "prompt": "Nommer coûts, obligations ou incertitudes à examiner : prospection, temps interne, échecs, assurance, financement, remboursements ou soutien. Ne pas inventer de montants.", "lines": 2}, {"type": "p", "text": "Une contribution prévue positive ne finance pas chaque échéance. Un prix proposé n’est pas un encaissement. Répondre à Q07. [C2, pp. 18–20]"}]}, {"id": "w07", "lesson": "L4", "kicker": "Exercice · Coûts et fonds, partie 2", "title": "Financer avant de s’engager", "blocks": [{"type": "callout", "label": "K4 · Financement et conditions d’échec", "text": "Les fonds initiaux libres sont de 1 200. A accepte volontairement une avance simulée de 3 500, comprise dans le prix de 5 600. Elle est reçue et disponible avant les coûts. Elle couvre des coûts préalables autorisés, documentés et non récupérables; toute part inutilisée est remboursable. Les 2 100 restants sont exigibles seulement après acceptation complète. Un vrai acheteur peut refuser ou renégocier ces conditions."}, {"type": "p", "text": "Compléter le scénario modélisé favorable. Les 5 000 de coûts doivent tous sortir du registre. Une avance n’est pas automatiquement libre d’emploi; une recette promise n’est pas disponible. [C2, pp. 19–20]"}, {"type": "table", "headers": ["Étape", "Entrée", "Sortie", "Fonds après étape"], "rows": [["Situation initiale", "", "", ""], ["Avance reçue", "", "", ""], ["Travail préalable payé", "", "", ""], ["Acceptation complète + solde reçu", "", "", ""], ["Inspection payée", "", "", ""]], "widths": [0.46, 0.16, 0.16, 0.22]}, {"type": "field", "label": "Que bloque le plan initial sans avance?", "prompt": "Nommer le montant, le point de décision et une solution volontaire possible. Conserver le plan initial non financé.", "lines": 2}, {"type": "field", "label": "Que contrôler avant d’utiliser une avance?", "prompt": "Autorité, fonds réellement reçus, restrictions, coûts admissibles, remboursement et prochaine échéance.", "lines": 2}, {"type": "p", "text": "K5 modifiera le résultat et déclenchera la facture d’échec. Garder ce scénario distinct. Répondre à Q08."}]}, {"id": "w08", "lesson": "L5", "kicker": "Exercice · Affirmations et preuves", "title": "Donner à chaque affirmation ses preuves", "blocks": [{"type": "p", "text": "Utiliser DÉMONTRÉ, ÉCHEC ou NON ÉTABLI pour chaque affirmation précise. Ajouter « dans la simulation » si les preuves sont fictives. Plan accepté, résultat d’exercice et biens réellement acceptés sont distincts. [C2, pp. 8, 13–15]"}, {"type": "table", "headers": ["Affirmation", "Preuve / preuve manquante", "Statut délimité"], "rows": [["Engagement reconstitué", "", ""], ["Voie complète prête", "", ""], ["Résultat client accepté", "", ""], ["Faisabilité du service complet", "", ""], ["Valeur commerciale établie", "", ""]], "widths": [0.31, 0.44, 0.25]}, {"type": "field", "label": "Qui vérifie, avec quelle indépendance?", "prompt": "Méthode, sources brutes, garde, contrôle d’exécution, relations organisationnelles et incitations. Préciser les hypothèses de confiance.", "lines": 3}, {"type": "field", "label": "Quelle observation pourrait renverser votre conclusion?", "prompt": "Formuler une objection concrète et nommer la pièce ou la mesure qui permettrait de trancher.", "lines": 2}, {"type": "callout", "label": "Une limite utile", "text": "Un programme distinct n’est pas automatiquement une institution indépendante. Un rapport favorable sauvegardé n’est pas forcément une nouvelle vérification. Le résultat concerne uniquement sa promesse, ses conditions et ses preuves. Répondre à Q09–Q10 après discussion des faits correspondants."}]}, {"id": "w09", "lesson": "L6", "kicker": "Exercice · Fiche de comparaison", "title": "Laisser gagner une solution compétente", "blocks": [{"type": "p", "text": "La référence est une équipe d’exploitation compétente utilisant le même dossier approuvé, B, sa capacité et les mêmes conditions financières. La comparer à la méthode CONTINUITÉ Ω. Une voie directement assistée par IA reste NON EXÉCUTÉE tant qu’elle n’a pas été réalisée. [C2, pp. 21–22]"}, {"type": "table", "headers": ["Solution", "Mesures du résultat et du coût complet", "Preuves / statut"], "rows": [["Voie conventionnelle compétente", "", ""], ["Voie CONTINUITÉ Ω", "", ""], ["Voie directement assistée par IA", "", ""], ["Sans achat / moyens propres", "", ""]], "widths": [0.31, 0.42, 0.27]}, {"type": "field", "label": "Que faut-il égaliser pour comparer équitablement?", "prompt": "Promesse, sources, droits, prestataire, capacité, ressources initiales, difficulté et accès à l’aide humaine.", "lines": 2}, {"type": "field", "label": "Qu’est-ce qui changerait la décision d’achat?", "prompt": "Définir une amélioration utile et l’effort/coût complet à mesurer. Distinguer devis, estimation et résultat observé.", "lines": 3}, {"type": "field", "label": "Que faire si la voie conventionnelle gagne?", "prompt": "Consigner la meilleure solution et les preuves. Identifier une éventuelle raison d’acheter ou de ne pas acheter.", "lines": 2}, {"type": "p", "text": "Ce cours ne fournit aucune performance comparative observée. Un concept séduisant n’est pas un avantage mesuré. Répondre à Q11."}]}, {"id": "w10", "lesson": "L7", "kicker": "Mise en situation · 35 minutes · dévoiler K5 puis K6", "title": "Deux dossiers, deux histoires distinctes", "blocks": [{"type": "p", "text": "Utiliser K0–K4 du cahier. Masquer K5–K6 jusqu’au moment demandé. Convenir d’abord d’une voie, de ses conditions et de son financement; dévoiler ensuite K5. Produire le journal des décisions et le Passeport."}, {"type": "callout", "label": "K5 · Réception R1 et facture d’échec", "text": "Le 12 novembre à 15 h 40, R1 consigne fictivement 9 800 étiquettes v3 conformes à M1. Morgan reconnaît ces unités sans accepter P1 intégralement. Les 4 700 de coûts préalables sont payés; l’avance de 3 500 couvre des coûts admissibles documentés et non récupérables. L’inspecteur fictif facture 300, exigibles maintenant même en cas d’échec : cette condition explicite complète K4. Aucun paiement de 2 100 ni accord de réparation n’est fourni. Toute avance inutilisée resterait remboursable."}, {"type": "callout", "label": "K6 · Témoin positif distinct, facultatif", "text": "R2 est un scénario témoin positif distinct, à partir d’un nouvel état initial supposé, avec sa propre autorisation simulée et les ressources K0–K4. Une nouvelle réception fictive consigne 10 000 étiquettes conformes, reçues et acceptées par Morgan à M1 à 15 h 40. Un autre participant contrôle les pièces. Le règlement simulé consigne les 2 100 reçus et les 300 d’inspection payés."}, {"type": "p", "text": "Ne pas remplacer R1 ni le financer avec les fonds modélisés de R2. Conserver coûts, dettes et obligations de réparation non résolues de R1. Aucun
