ng": "fr", "title": "La continuité en bref", "subtitle": "Un aide-mémoire de deux pages pour votre premier exercice délimité", "sources": ["C2", "F2"], "pages": [{"id": "qr_decision", "lesson": "REF", "kicker": "AIDE-MÉMOIRE 1 SUR 2", "title": "La décision de continuité", "blocks": [{"type": "p", "text": "Partez d’un engagement client dont l’échec aurait des conséquences. Établissez une solution utilisable et un arrangement que des participants volontaires peuvent exécuter. Évaluez le résultat selon l’engagement convenu. [C2; F2]"}, {"type": "table", "headers": ["Étape", "La question à résoudre"], "widths": [0.27, 0.73], "rows": [["1  Engagement", "Quel résultat l’autorité nommée doit-elle accepter? Préciser quantité, qualité, lieu et échéance."], ["2  Moyens manquants", "Quel dossier, droit, savoir-faire ou dépendance indisponible empêche la livraison? Que faut-il construire?"], ["3  Arrangement", "Qui accepte de fournir quoi, à quelles conditions? Quelle capacité est réellement réservée, compte tenu des demandes simultanées?"], ["4  Argent", "Quel est le coût complet du service? Les fonds sont-ils disponibles à chaque échéance, y compris les obligations en cas d’échec?"], ["5  Vérification", "Quelles preuves établiraient ou réfuteraient le résultat? Qui les examine, avec quelle indépendance?"], ["6  Comparaison", "Une solution conventionnelle compétente pourrait-elle tenir le même engagement dans les mêmes conditions?"], ["7  Usage suivant", "Quelle capacité réutilisable reste-t-il? Aide-t-elle une autre tâche après ses coûts de transfert? Conservez aussi les échecs."]]}, {"type": "heading", "text": "Distinguer chaque affirmation"}, {"type": "table", "headers": ["Affirmation", "Preuves nécessaires"], "widths": [0.27, 0.73], "rows": [["Résultat", "Le résultat requis, réellement reçu et accepté dans les conditions figées."], ["Faisabilité", "Consentement, capacité utilisable, droits, coûts complets, fonds à temps et obligations exécutables."], ["Marché", "Achats réels indépendants, valeur acceptée, encaissements et coûts complets. La demande répétée étaye la reproductibilité."]]}, {"type": "p", "text": "Rendez un verdict délimité : étayé, échec ou non établi. Précisez s’il concerne un exercice sur table, un produit numérique, une livraison physique ou une transaction commerciale réelle. Remplir une fiche ne suffit pas à établir ces faits."}]}, {"id": "qr_cash", "lesson": "REF", "kicker": "AIDE-MÉMOIRE 2 SUR 2", "title": "Vérifier le calendrier des fonds", "blocks": [{"type": "p", "text": "Cas pédagogique fictif. Le prix du service de continuité est de 5 600 CAD. Son coût complet modélisé de 5 000 CAD laisse une contribution prévue de 600 CAD. Avant l’acceptation, 4 700 CAD sont exigibles et seuls 1 200 CAD sont disponibles. Il manque donc 3 500 CAD."}, {"type": "heading", "text": "Branche témoin positive financée"}, {"type": "table", "headers": ["Événement", "Variation", "Trésorerie"], "widths": [0.5, 0.25, 0.25], "rows": [["Fonds de départ", "—", "1 200"], ["Réception de l’avance", "+3 500", "4 700"], ["Paiements avant acceptation", "−4 700", "0"], ["Solde reçu après acceptation complète", "+2 100", "2 100"], ["Paiement de l’inspection finale", "−300", "1 800"]]}, {"type": "callout", "label": "Le rapprochement", "text": "L’avance et le solde totalisent 5 600. La trésorerie finale de 1 800 comprend les 1 200 de départ et la contribution de 600. L’avance fait partie du prix. La facture de la commande du client initial reste hors du compte de ce service."}, {"type": "heading", "text": "Quand le reçu indique 9 800"}, {"type": "p", "text": "L’engagement exige 10 000 unités, sans livraison incomplète autorisée. Dans la branche en échec, le solde de 2 100 conditionné à l’acceptation n’est pas encaissable. Après les paiements de 4 700, la trésorerie est nulle et la facture d’inspection de 300 du cas reste impayée. Consignez cette dette et toute obligation de correction non résolue. La branche témoin positive distincte n’efface ni ne finance cet échec."}, {"type": "heading", "text": "Votre première action utile"}, {"type": "p", "text": "Choisissez un engagement, nommez son responsable et son autorité d’acceptation, puis rédigez la fiche. Réunissez le plan de reprise existant et une solution de rechange crédible. Repérez le premier fait ou moyen manquant et préparez un exercice sur table délimité avec des participants volontaires. Le cahier conserve les décisions; le guide d’animation aide à les contester."}, {"type": "p", "text": "Édition pédagogique 1.0. Montants et événements ci-dessus sont inventés. Un cas réel exige ses propres coûts complets, échéances, consentements, conditions d’échec et preuves. Sources de recherche : C2 CONTINUITÉ Ω, édition 1.1.1; F2 Invent the Economy, octobre 2026. Originaux inclus dans l’archive.", "role": "source_note"}]}]}}, "quiz": [{"id": "Q01", "lesson": "L1", "question": {"en": "Which event meets the frozen promise P1?", "fr": "Quel événement respecte la promesse fixée P1?"}, "options": {"en": ["Printer B restarts its equipment.", "10,000 labels leave Printer B by 16:00.", "Morgan receives and accepts 10,000 conforming v3 labels at site M1 by the deadline."], "fr": ["L’imprimeur B redémarre son équipement.", "10 000 étiquettes quittent B avant 16 h.", "Morgan reçoit et accepte 10 000 étiquettes v3 conformes au site M1 avant l’échéance."]}, "correct_index": 2, "explanation": {"en": "The promise concerns the customer’s accepted result: quantity, specification, place and time. A restart or dispatch may support the route but does not establish receipt and acceptance. In this course, even a matching mock receipt establishes only the tabletop result.", "fr": "La promesse porte sur le résultat accepté par le client : quantité, spécification, lieu et heure. Un redémarrage ou une expédition aide la réalisation sans établir la réception et l’acceptation. Dans ce cours, même une réception fictive conforme établit seulement le résultat de simulation."}}, {"id": "Q02", "lesson": "L1", "question": {"en": "P1 forbids partial acceptance. Only 9,800 conforming labels arrive on time. How should the original result be recorded?", "fr": "P1 interdit l’acceptation partielle. Seules 9 800 étiquettes conformes arrivent à temps. Comment consigner le résultat initial?"}, "options": {"en": ["Failed against P1; record any new agreement separately.", "Change P1 to 9,800 and mark it passed.", "Passed, because 98% arrived on time."], "fr": ["Échec par rapport à P1; consigner séparément tout nouvel accord.", "Ramener P1 à 9 800 et déclarer la réussite.", "Réussite, puisque 98 % sont arrivés à temps."]}, "correct_index": 0, "explanation": {"en": "The original acceptance conditions remain authoritative. A later compromise or a new run may be useful, but it cannot change the historical result. The shortfall is 200 labels.", "fr": "Les conditions d’acceptation initiales restent la référence. Un compromis ultérieur ou un nouvel essai peut être utile, sans modifier le résultat historique. Il manque 200 étiquettes."}}, {"id": "Q03", "lesson": "L2", "question": {"en": "The checkpoint says 8,000. An authorized amendment adds 2,000 before the cutoff. What quantity should the reconstructed obligation use?", "fr": "Le point de reprise indique 8 000. Une modification autorisée ajoute 2 000 avant la borne. Quelle quantité retenir pour l’engagement reconstitué?"}, "options": {"en": ["8,000, because the restored database is working.", "10,000, after checking the amendment’s authority and coverage through the cutoff.", "12,000, because that is the alternate printer’s capacity."], "fr": ["8 000, puisque la base restaurée fonctionne.", "10 000, après contrôle de l’autorité de la modification et de la couverture jusqu’à la borne.", "12 000, puisque c’est la capacité de l’autre imprimeur."]}, "correct_index": 1, "explanation": {"en": "8,000 + 2,000 = 10,000. The amendment matters because it changes what is owed. Source origin, authority and completeness through the agreed cutoff still need checking; a matching checksum does not establish those facts.", "fr": "8 000 + 2 000 = 10 000. La modification change ce qui est dû. Il faut encore contrôler origine, autorité et couverture jusqu’à la borne convenue; une empreinte concordante ne démontre pas ces faits."}}, {"id": "Q04", "lesson": "L2", "question": {"en": "Both printers need the same unavailable login to obtain approved artwork. What directly addresses the missing means?", "fr": "Les deux imprimeurs dépendent du même accès indisponible pour obtenir le visuel approuvé. Qu’est-ce qui comble directement ce manque?"}, "options": {"en": ["Describe Printer B as independent and proceed.", "Build and test an authorized, separately accessible current packet and release channel.", "Send whatever artwork someone remembers."], "fr": ["Déclarer B indépendant et poursuivre.", "Construire et éprouver un dossier à jour et un canal de lancement autorisés, accessibles séparément.", "Transmettre le visuel dont quelqu’un se souvient."]}, "correct_index": 1, "explanation": {"en": "A second supplier does not remove a shared dependency. The useful intervention creates a permitted, current and usable way to obtain and release the right work. Its construction, rights and cost belong in the service.", "fr": "Un second fournisseur ne supprime pas une dépendance commune. L’intervention utile crée un moyen autorisé, à jour et utilisable d’obtenir puis de lancer le bon travail. Sa construction, ses droits et son coût font partie du service."}}, {"id": "Q05", "lesson": "L3", "question": {"en": "Capacity is 12,000; protected work is 2,000; P1 needs 10,000. Another simultaneous request needs 5,000. What follows?", "fr": "La capacité est de 12 000; 2 000 sont protégées; P1 en exige 10 000. Une autre demande simultanée exige 5 000. Quelle conclusion tirer?"}, "options": {"en": ["Both requests fit because each is below 12,000.", "There are 5,000 units left for the new request.", "Total demand is 17,000 against 12,000; both cannot receive unconditional coverage."], "fr": ["Les deux demandes tiennent, car chacune est inférieure à 12 000.", "Il reste 5 000 unités pour la nouvelle demande.", "La demande totale atteint 17 000 pour 12 000 disponibles; les deux ne peuvent être couvertes sans condition."]}, "correct_index": 2, "explanation": {"en": "Protected work and simultaneous promises share the same resource. The new request adds a 5,000-unit shortfall. A qualified additional slot, a voluntarily agreed priority rule or a declined request may solve it; silently double-booking does not.", "fr": "Le travail protégé et les promesses simultanées partagent la même ressource. La nouvelle demande crée un manque de 5 000 unités. Un créneau supplémentaire qualifié, une priorité librement convenue ou un refus peut le résoudre; une double réservation cachée ne le peut pas."}}, {"id": "Q06", "lesson": "L3", "question": {"en": "Printer B says, “We could probably help.” What has this established?", "fr": "L’imprimeur B dit : « Nous pourrions probablement aider. » Qu’est-ce que cela établit?"}, "options": {"en": ["Interest; a usable reservation and its terms still need confirmation.", "A binding, usable reservation for P1.", "Collected commercial value for the coordinator."], "fr": ["Un intérêt; la réservation utilisable et ses conditions restent à confirmer.", "Une réservation ferme et utilisable pour P1.", "Une valeur commerciale encaissée par le coordinateur."]}, "correct_index": 0, "explanation": {"en": "Willingness, authorized commitment, usable capacity and collected payment are different evidence states. The parties must voluntarily settle the product, window, rights, price, activation and failure terms.", "fr": "Volonté, engagement autorisé, capacité utilisable et paiement encaissé correspondent à des preuves différentes. Les parties doivent convenir librement du produit, du créneau, des droits, du prix, du lancement et des conditions d’échec."}}, {"id": "Q07", "lesson": "L4", "question": {"en": "The modeled fee is CAD 5,600 and complete modeled cost is CAD 5,000. What is the projected contribution?", "fr": "Le prix modélisé est de 5 600 CAD et le coût complet modélisé de 5 000 CAD. Quelle est la contribution prévue?"}, "options": {"en": ["CAD 1,800.", "CAD 600.", "CAD 5,600."], "fr": ["1 800 CAD.", "600 CAD.", "5 600 CAD."]}, "correct_index": 1, "explanation": {"en": "5,600 − 5,000 = 600. Ending cash of 1,800 on the favorable teaching branch includes 1,200 of starting money. Neither calculation is observed profit or real market evidence.", "fr": "5 600 − 5 000 = 600. La trésorerie finale de 1 800 dans le scénario pédagogique favorable comprend 1 200 de fonds initiaux. Aucun calcul ne constitue un bénéfice observé ou une preuve de marché réelle."}}, {"id": "Q08", "lesson": "L4", "question": {"en": "CAD 4,700 is due before acceptance; CAD 1,200 is available. A CAD 3,500 advance is included in the CAD 5,600 fee. Which statement is correct?", "fr": "4 700 CAD sont exigibles avant acceptation; 1 200 sont disponibles. L’avance de 3 500 est comprise dans le prix de 5 600. Quelle affirmation est correcte?"}, "options": {"en": ["The total service revenue becomes CAD 9,100.", "A proposed advance is automatically available cash.", "The gap is CAD 3,500; CAD 2,100 remains conditional on full acceptance."], "fr": ["Le revenu total du service devient 9 100 CAD.", "Une avance proposée constitue automatiquement des fonds disponibles.", "Le manque est de 3 500 CAD; le solde de 2 100 dépend de l’acceptation complète."]}, "correct_index": 2, "explanation": {"en": "The advance closes this modeled gap only when received and available under the agreed terms. It is part of the fee, not extra revenue. Restrictions, refund duties and payment conditions remain relevant.", "fr": "L’avance comble ce manque modélisé seulement lorsqu’elle est reçue et disponible selon les conditions convenues. Elle fait partie du prix; ce n’est pas un revenu supplémentaire. Restrictions, remboursements et conditions de paiement restent à considérer."}}, {"id": "Q09", "lesson": "L5", "question": {"en": "The mock R1 receipt records 9,800 conforming units. Cash is zero after the modeled preacceptance costs. What is the sound next record?", "fr": "La réception fictive R1 consigne 9 800 unités conformes. La trésorerie est nulle après les coûts modélisés préalables. Que consigner ensuite?"}, "options": {"en": ["P1 failed in the tabletop; do not count the conditional CAD 2,100; record the unpaid inspection and next decision.", "P1 passed and the full CAD 5,600 fee is earned.", "Actual physical delivery is independently certified."], "fr": ["Échec de P1 dans la simulation; ne pas compter les 2 100 conditionnels; consigner l’inspection impayée et la décision suivante.", "P1 a réussi et le prix complet de 5 600 est acquis.", "La livraison physique réelle est certifiée indépendamment."]}, "correct_index": 0, "explanation": {"en": "A mock receipt of 9,800 does not meet the 10,000-unit promise. K5 makes the CAD 300 inspection charge due despite failure; its funding is missing. Actual goods, actual payment and real commercial value remain not established.", "fr": "Une réception fictive de 9 800 ne respecte pas la promesse de 10 000. K5 rend les 300 CAD d’inspection exigibles malgré l’échec; leur financement manque. Biens réels, paiement réel et valeur commerciale réelle restent non établis."}}, {"id": "Q10", "lesson": "L5", "question": {"en": "A reviewer is paid by the supplier. Which description of independence is defensible?", "fr": "Un évaluateur est rémunéré par le fournisseur. Quelle description de son indépendance est défendable?"}, "options": {"en": ["A separate software checker proves complete institutional independence.", "Disclose the relationship, method, source custody and limits; assess independence for the particular claim.", "A favorable report guarantees all future deliveries."], "fr": ["Un logiciel distinct démontre une indépendance institutionnelle complète.", "Déclarer le lien, la méthode, la garde des sources et les limites; apprécier l’indépendance pour l’affirmation précise.", "Un rapport favorable garantit toutes les livraisons futures."]}, "correct_index": 1, "explanation": {"en": "Independent checking has several dimensions. Separate code, protected source evidence, control of execution and organizational incentives are not interchangeable. A reviewer’s report must identify what was checked and what remains trusted or unknown.", "fr": "L’indépendance de la vérification comporte plusieurs dimensions. Code distinct, sources protégées, contrôle de l’exécution et intérêts organisationnels ne sont pas interchangeables. Le rapport doit préciser les contrôles, les hypothèses de confiance et les inconnues."}}, {"id": "Q11", "lesson": "L6", "question": {"en": "Which comparison could support a useful buying decision?", "fr": "Quelle comparaison pourrait étayer une décision d’achat utile?"}, "options": {"en": ["Give only CONTINUITY Ω the approved amendment and alternate printer.", "Compare only software execution time.", "Use the same promise, usable records and resources; count complete costs and human work; allow a conventional winner."], "fr": ["Donner seulement à CONTINUITY Ω la modification approuvée et l’autre imprimeur.", "Comparer uniquement le temps d’exécution du logiciel.", "Garder la même promesse, les mêmes sources et ressources utilisables; compter coûts complets et travail humain; accepter un gagnant conventionnel."]}, "correct_index": 2, "explanation": {"en": "A capable conventional route is the relevant baseline. An AI-assisted route must actually run before its performance is claimed. Quote, modeled estimate and measured result must remain distinguishable; no purchase can be the rational choice.", "fr": "Une voie conventionnelle compétente constitue la référence utile. Une voie assistée par IA doit être exécutée avant qu’on affirme ses performances. Devis, estimation modélisée et résultat mesuré restent distincts; ne pas acheter peut être rationnel."}}, {"id": "Q12", "lesson": "L8", "question": {"en": "What would support the claim that a retained capability enabled a different next use?", "fr": "Qu’est-ce qui pourrait étayer l’affirmation qu’une capacité conservée a permis un nouvel usage distinct?"}, "options": {"en": ["A fresh distinct task compared with and without that capability under equivalent resources, including adaptation costs.", "Another description of the same successful label order.", "Keeping a file and calling it a flywheel."], "fr": ["Une tâche nouvelle et distincte comparée avec et sans cette capacité, à ressources équivalentes, coûts d’adaptation compris.", "Une autre description de la même commande d’étiquettes réussie.", "Conserver un fichier et l’appeler un cercle vertueux."]}, "correct_index": 0, "explanation": {"en": "Retention creates a candidate capability, not proof of its contribution. The next use needs its own promise, rights, funding and evidence. Repeat demand, successor enablement and improvement of the discovery process are different claims.", "fr": "La conservation crée une capacité candidate, pas la preuve de son apport. L’usage suivant exige sa propre promesse, ses droits, son financement et ses preuves. Demande répétée, apport au successeur et amélioration du processus de découverte sont des affirmations différentes."}}], "prompts": [{"id": "AI1", "lesson": "L1", "title": {"en": "Define an exact customer promise", "fr": "Définir un engagement client précis"}, "text": {"en": "Help me prepare a continuity promise card using only the records I provide.\n\nMy case: [describe the customer commitment and disruption].\nAuthoritative records: [paste permitted, relevant extracts and their dates/versions].\nKnown acceptance authority: [name/role, or unknown].\n\nFirst distinguish what the records establish, what conflicts, and what is missing. Do not infer a quantity, amendment, permission or customer approval from a convenient assumption.\n\nProduce a draft with the recipient, output/specification version, quantity, quality/tolerances, delivery location, exact deadline/time zone, permitted substitutions or partial delivery, and acceptance authority. Cite the input record behind every material field. Mark unsupported fields NOT ESTABLISHED.\n\nList the smallest set of questions that would resolve the consequential gaps. Explain which candidate changes would require a new, explicitly accepted promise version. A changed promise must not retroactively turn the original failure into success.\n\nReturn the card, conflicts, missing facts and the next evidence to obtain. This draft does not establish anyone’s consent.", "fr": "Aidez-moi à préparer une fiche d’engagement de continuité en utilisant uniquement les dossiers que je fournis.\n\nMon cas : [engagement client et perturbation].\nDossiers faisant autorité : [extraits pertinents que vous pouvez partager, dates et versions].\nAutorité d’acceptation connue : [nom/rôle, ou inconnue].\n\nDistinguez les faits établis, les contradictions et les informations manquantes. N’inférez pas une quantité, une modification, un droit ou une approbation client à partir d’une hypothèse commode.\n\nRédigez une fiche précisant destinataire, résultat/version, quantité, qualité/tolérances, lieu, échéance exacte/fuseau horaire, substitutions ou livraison partielle permises et autorité d’acceptation. Reliez chaque champ important à sa pièce source. Marquez NON ÉTABLI ce qui n’est pas étayé.\n\nPosez le minimum de questions permettant de combler les lacunes importantes. Indiquez quels changements nécessiteraient une nouvelle version explicitement acceptée de l’engagement. Un changement ne doit pas transformer rétroactivement l’échec initial en réussite.\n\nRenvoyez la fiche, les contradictions, les faits manquants et les prochaines preuves à obtenir. Ce projet ne crée aucun consentement."}}, {"id": "AI2", "lesson": "L2", "title": {"en": "Construct the missing capability", "fr": "Construire la capacité manquante"}, "text": {"en": "Act as a practical continuity designer. Preserve the attached authoritative promise while exploring different ways to fulfill it.\n\nPromise card: [insert].\nAvailable means and constraints: [records, people, tools, permissions, materials, capacity, timing and funding].\nExisting recovery/backup option: [describe accurately].\n\nMap the complete route to accepted output. Identify the decisive missing capability, rather than assuming every necessary tool or agreement already exists. Consider an adapted existing solution and a genuinely constructed alternative. Name any common dependency that could disable both.\n\nBuild a concrete first version of one missing artifact that can be produced from these inputs: for example a transferable production packet, a reconciliation table, an acceptance checklist or an adapter specification. Include its inputs, outputs, authoritative sources and an explicit test. Label any invented illustration. Do not describe an unexecuted artifact as tested.\n\nExplain what this construction makes possible, who could use it, what still blocks delivery, and how to compare it with the capable existing option. Keep the original acceptance conditions intact. Return the artifact and a short construction/test plan with owners and unresolved facts.", "fr": "Agissez comme concepteur pratique de continuité. Préservez l’engagement faisant autorité tout en explorant différentes façons de le réaliser.\n\nFiche d’engagement : [insérer].\nMoyens et contraintes : [dossiers, personnes, outils, droits, matières, capacité, échéances et financement].\nSolution de reprise ou de secours existante : [description fidèle].\n\nCartographiez toute la voie menant au résultat accepté. Repérez la capacité manquante décisive sans supposer que tous les outils ou accords existent déjà. Envisagez une solution existante adaptée et une autre réellement construite. Nommez toute dépendance commune susceptible de bloquer les deux.\n\nConstruisez une première version concrète d’un élément réalisable à partir de ces données : dossier de production transférable, tableau de rapprochement, critères d’acceptation ou spécification d’adaptateur. Précisez entrées, sorties, sources faisant autorité et essai à effectuer. Signalez tout exemple inventé. Ne présentez pas un élément non testé comme validé.\n\nExpliquez ce que cette construction rend possible, qui peut l’utiliser, ce qui bloque encore la livraison et comment la comparer à la solution existante compétente. Conservez les conditions d’acceptation initiales. Renvoyez l’élément construit et un court plan de réalisation et d’essai avec responsables et inconnues."}}, {"id": "AI3", "lesson": "L3–L4", "title": {"en": "Make participation and cash workable", "fr": "Rendre participation et trésorerie possibles"}, "text": {"en": "Help me design and evaluate a voluntary continuity service for the attached promise. Treat every proposed price, cost and willingness estimate as an assumption unless a supplied record establishes it.\n\nPromise and candidate route: [insert].\nParticipants and credible outside alternatives: [insert].\nCapacity reservations, permissions and proposed terms: [insert].\nComplete cost items, payment dates, available uncommitted cash and liabilities: [insert].\n\nShow who buys the continuity service, who provides each contribution, who benefits, and why each participant might accept the complete arrangement compared with their alternative. Identify the missing evidence of actual agreement. Do not treat a checkbox as consent or idle equipment as a reservation.\n\nCreate a single-currency service ledger and a time-ordered cash schedule. Keep the original customer order invoice separate. Count an advance once as part of the total fee. Separate projected contribution from cash available before payment, collected revenue and starting capital. Include shared capacity, failure/refund terms and unpaid duties.\n\nGive a supported, failed or not-established conclusion for the stated modeled conditions. If blocked, propose a concrete revised arrangement and the evidence that would test it. Do not invent a willing buyer, financing source or actual sale.", "fr": "Aidez-moi à concevoir et évaluer un service volontaire de continuité pour l’engagement joint. Traitez prix, coûts et disposition à acheter comme des hypothèses, sauf si une pièce fournie les établit.\n\nEngagement et voie proposée : [insérer].\nParticipants et solutions de rechange crédibles : [insérer].\nRéservations, droits et conditions proposées : [insérer].\nCoûts complets, échéances, trésorerie non engagée et obligations : [insérer].\n\nPrécisez qui achète le service, qui apporte chaque contribution, qui en bénéficie et pourquoi chaque participant pourrait préférer l’arrangement complet à sa solution de rechange. Repérez les preuves manquantes d’accord réel. Une case cochée ne vaut pas consentement; une machine libre ne vaut pas réservation.\n\nÉtablissez un compte du service dans une seule monnaie et un calendrier des encaissements/décaissements. Séparez la facture de la commande initiale du client. Comptez l’avance une seule fois dans le prix total. Distinguez contribution prévue, fonds disponibles avant paiement, recettes encaissées et capital de départ. Incluez capacité partagée, conditions d’échec/remboursement et obligations impayées.\n\nConcluez : étayé, échec ou non établi pour les conditions modélisées. En cas de blocage, proposez un arrangement révisé concret et les preuves qui permettraient de l’éprouver. N’inventez ni acheteur volontaire, ni financement, ni vente réelle."}}, {"id": "AI4", "lesson": "L5–L7", "title": {"en": "Challenge the claim and repair the method", "fr": "Contester l’affirmation et corriger la méthode"}, "text": {"en": "Review the proposed continuity result as a skeptical checker. Your goal is to find a consequential unsupported claim or counterexample and help repair it.\n\nOriginal frozen promise and test conditions: [insert].\nProducer’s conclusion: [insert].\nSource records, actual outputs, receiving evidence, commitments and cash history: [insert].\n\nFor each material conclusion, name the evidence required, the evidence actually available, and any contradiction or missing link. Check actual content and acceptance, not merely matching counts, hashes or a favorable summary. Look for altered obligations, double-booked capacity, delayed money, unpaid failure duties and shared assumptions between producer and checker.\n\nKeep separate verdicts for outcome, service feasibility and market evidence. State the setting and independence precisely. A separate AI answer is a challenge, not an external certification. If you cannot inspect or execute something, say what remains unverified.\n\nChoose the most decisive objection. Propose a concrete repair and a fresh test that could falsify it, with expected positive and negative results. Preserve the failed attempt and its costs. Do not let a new successful branch overwrite the old failure or borrow its money without an explicit ledger. Return the claim/evidence table, decisive objection, repair and scoped verdict.", "fr": "Examinez le résultat de continuité proposé comme un vérificateur sceptique. Cherchez une affirmation importante non étayée ou un contre-exemple, puis aidez à corriger la méthode.\n\nEngagement initial figé et conditions d’essai : [insérer].\nConclusion du producteur : [insérer].\nDossiers sources, résultats produits, preuves de réception, engagements et historique des fonds : [insérer].\n\nPour chaque conclusion importante, précisez les preuves requises, celles disponibles et toute contradiction ou lacune. Vérifiez le contenu et l’acceptation, pas uniquement des totaux, empreintes ou résumés favorables. Recherchez obligations modifiées, double réservation, argent tardif, devoirs impayés après échec et hypothèses communes au producteur et au vérificateur.\n\nDistinguez les verdicts sur résultat, faisabilité du service et preuves de marché. Décrivez précisément le cadre et l’indépendance. Une seconde réponse d’IA aide à contester; elle ne constitue pas une certification externe. Si vous ne pouvez pas examiner ou exécuter quelque chose, précisez ce qui reste non vérifié.\n\nChoisissez l’objection décisive. Proposez une correction concrète et un nouvel essai susceptible de la réfuter, avec résultats positifs et négatifs attendus. Conservez l’échec et ses coûts. Une branche réussie ne doit pas effacer l’échec ni utiliser son argent sans compte explicite. Renvoyez le tableau affirmation/preuve, l’objection, la correction et le verdict délimité."}}, {"id": "AI5", "lesson": "L6–L8", "title": {"en": "Test a different next use", "fr": "Tester un nouvel usage"}, "text": {"en": "Help me test whether a capability retained from one continuity case makes a different useful task easier or newly possible.\n\nCompleted case, accepted scope, failures and unsettled obligations: [insert].\nReusable artifact, version, rights and verified limits: [insert].\nProposed new recipient/product/deadline: [insert].\nBest credible alternative for the new task: [insert].\n\nSpecify what is genuinely different about the new task and freeze its acceptance criteria before adapting the artifact. Design a fair with/without comparison that gives both approaches equivalent source information, permissions and resources. Include acquisition, adaptation, integration, verification and operating costs.\n\nConstruct the smallest useful adaptation you can from the supplied material. State how it will be tested. Measure accepted results, total work and cost; identify confounders and uncertainty. If comparison data are missing, keep the causal benefit not established.\n\nSeparate learned knowledge, reusable machinery, relationships and actually earned uncommitted money. Do not count projected margin as cash or spend funds committed to the earlier case. Preserve failed transfers. Return the new task, concrete adaptation, comparison protocol, evidence needed and decision rule. Do not claim a flywheel benefit before the comparison supports it.", "fr": "Aidez-moi à vérifier si une capacité conservée d’un cas de continuité facilite ou rend possible une autre tâche utile.\n\nCas terminé, périmètre accepté, échecs et obligations non réglées : [insérer].\nÉlément réutilisable, version, droits et limites vérifiées : [insérer].\nNouveau destinataire/produit/délai envisagé : [insérer].\nMeilleure solution de rechange crédible : [insérer].\n\nPrécisez ce qui change réellement dans la nouvelle tâche et fixez ses critères d’acceptation avant l’adaptation. Concevez une comparaison équitable avec et sans la capacité, donnant aux deux méthodes des informations, droits et ressources équivalents. Comptez acquisition, adaptation, intégration, vérification et fonctionnement.\n\nConstruisez la plus petite adaptation utile à partir des éléments fournis. Précisez son essai. Mesurez résultats acceptés, travail total et coûts; relevez facteurs de confusion et incertitudes. En l’absence de comparaison, gardez l’avantage causal non établi.\n\nDistinguez connaissances acquises, moyens réutilisables, relations et argent réellement gagné et non engagé. Une marge prévue ne vaut pas trésorerie disponible; ne dépensez pas les fonds dus au cas précédent. Conservez les transferts échoués. Renvoyez la nouvelle tâche, l’adaptation concrète, le protocole comparatif, les preuves requises et la règle de décision. N’affirmez pas de bénéfice de la boucle cumulative avant que la comparaison l’étaye."}}], "sources": {"C1": {"kind": "supplied_paper", "author": "Vincent Boucher", "title": "CONTINUITY Ω", "edition": "Research edition 1.1.1", "date": "6 November 2026", "original_filename": "CONTINUITY_OMEGA (1) copy.pdf", "archive_path": "03_Original_Papers/C1_CONTINUITY_OMEGA_Research_EN.pdf", "sha256": "dfaca5515877058ca215f8c778cdbd3699757f6a930eed5356b693feaf48ee11"}, "C2": {"kind": "supplied_paper", "author": "Vince const knownFields=new Set();
for(const kind of ['learner','workbook','facilitator','quick_reference'])for(const page of COURSE[kind].en.pages)page.blocks.forEach((b,i)=>{const k=kind+'_'+page.id+'_'+i;if(b.type==='field')knownFields.add(k);if(b.type==='table')b.rows.forEach((r,ri)=>r.forEach((v,ci)=>{if(!String(v).trim())knownFields.add(k+'_'+ri+'_'+ci)}))});
const defaultState=()=>({schema:'continuity-masterclass-101/v1',lang:'en',answers:{},choices:{},complete:[]});
function validateState(x){if(!x||x.schema!=='continuity-masterclass-101/v1'||!['en','fr'].includes(x.lang)||!x.answers||typeof x.answers!=='object'||Array.isArray(x.answers)||!x.choices||typeof x.choices!=='object'||Array.isArray(x.choices)||!Array.isArray(x.complete))throw Error('Invalid notebook');const out=defaultState();out.lang=x.lang;for(const [k,v]of Object.entries(x.answers)){if(!knownFields.has(k)||typeof v!=='string'||v.length>20000)throw Error('Invalid field');out.answers[k]=v}for(const[k,v]of Object.entries(x.choices)){const q=COURSE.quiz.find(q=>q.id===k);if(!q||!Number.isInteger(v)||v<0||v>=q.options.en.length)throw Error('Invalid choice');out.choices[k]=v}if(x.complete.some(v=>!/^L[1-8]$/.test(v)))throw Error('Invalid lesson');out.complete=[...new Set(x.complete)];return out}
let state=defaultState(),canSave=true,view='learner',lesson='O',query='';
try{const old=localStorage.getItem(STORAGE);if(old)state=validateState(JSON.parse(old));localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){canSave=false}
let calc={fee:5600,cost:5000,prepay:4700,cash:1200,advance:0};
const t=k=>L[state.lang][k]||k;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));canSave=true}catch(e){canSave=false}$('savestatus').textContent=t(canSave?'saved':'unsaved')}
function updateChrome(){document.documentElement.lang=state.lang;document.title=(state.lang==='en'?'CONTINUITY Ω · MasterClass 101':'CONTINUITÉ Ω · Masterclass 101');$('tagline').textContent=t('tagline');$('badge').textContent=t('badge');$('searchlabel').textContent=t('search');$('search').placeholder=t('searchph');$('downloads-shortcut').textContent=t('downloads');$('print').textContent=t('print');$('navtitle').textContent=t('nav');$('lessontitle').textContent=t('lessons');$('notebooklabel').textContent=t('notebook');for(const id of ['export','import','reset'])$(id).textContent=t(id);$('lang-en').setAttribute('aria-pressed',state.lang==='en');$('lang-fr').setAttribute('aria-pressed',state.lang==='fr');$('progressnote').textContent=t('progressnote');$('progresslabel').textContent=state.complete.length+'/8 '+t('progress');$('progress').value=state.complete.length;$('savestatus').textContent=t(canSave?'saved':'unsaved');$('nav').innerHTML=['learner','workbook','quiz','facilitator','prompts','calculator','sources'].map(v=>`<button type="button" data-view="${v}" aria-pressed="${view===v}">${esc(t(v))}</button>`).join('');$('lessons').innerHTML=['O',...Array.from({length:8},(_,i)=>'L'+(i+1)),'REF','all'].map(id=>{const name=id==='O'?t('orientation'):id==='REF'?t('reference'):id==='all'?t('all'):id+' · '+LESSONS[state.lang][Number(id.slice(1))-1];return `<div class="lessonrow"><button type="button" data-lesson="${id}" aria-pressed="${lesson===id}">${esc(name)}</button>${/^L/.test(id)?`<input type="checkbox" data-complete="${id}" ${state.complete.includes(id)?'checked':''} aria-label="${esc(name)} — ${esc(state.lang==='en'?'mark complete':'marquer comme terminée')}">`:''}</div>`}).join('')}
function fieldHTML(key,label,prompt='',lines=3){return `<div class="field"><label for="${esc(key)}">${rich(label)}</label>${prompt?`<span class="help" id="${esc(key)}_help">${rich(prompt)}</span>`:''}<textarea id="${esc(key)}" data-answer="${esc(key)}" rows="${Math.max(2,lines)}" maxlength="20000" ${prompt?`aria-describedby="${esc(key)}_help"`:''}>${esc(state.answers[key]||'')}</textarea></div>`}
function renderBlock(b,i,page,kind){const key=kind+'_'+page.id+'_'+i;switch(b.type){case'p':return `<p${b.role==='source_note'?' class="source-note"':''}>${rich(b.text)}</p>`;case'heading':return `<h3>${rich(b.text)}</h3>`;case'bullets':case'numbered':{const tag=b.type==='bullets'?'ul':'ol';return `<${tag}>${b.items.map(x=>'<li>'+rich(x)+'</li>').join('')}</${tag}>`};case'callout':return `<div class="callout"><strong>${rich(b.label)}</strong><p>${rich(b.text)}</p></div>`;case'field':return fieldHTML(key,b.label,b.prompt,b.lines);case'figure':return `<figure><img src="06_Visuals/${esc(b.name)}_${state.lang}.svg" alt="${esc(b.caption||b.name.replaceAll('_',' '))}" loading="lazy"><figcaption>${rich(b.caption||'')}</figcaption></figure>`;case'table':return `<div class="tablewrap" tabindex="0" role="region" aria-label="${esc(page.title)} — ${state.lang==='en'?'table':'tableau'}"><table><thead><tr>${b.headers.map(h=>'<th scope="col">'+rich(h)+'</th>').join('')}</tr></thead><tbody>${b.rows.map((r,ri)=>'<tr>'+r.map((v,ci)=>{if(String(v).trim())return '<td>'+rich(v)+'</td>';const id=key+'_'+ri+'_'+ci;return `<td><textarea rows="2" maxlength="20000" data-answer="${id}" aria-label="${esc(page.title+' / '+b.headers[ci]+' / '+(ri+1))}">${esc(state.answers[id]||'')}</textarea></td>`}).join('')+'</tr>').join('')}</tbody></table></div>`;default:return''}}
function searchable(p){return JSON.stringify(p).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function renderDocument(kind){const d=COURSE[kind][state.lang];let pages=d.pages.filter(p=>lesson==='all'||p.lesson===lesson);if(query&&kind==='learner'){const q=query.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();pages=d.pages.filter(p=>searchable(p).includes(q))}const notice=kind==='workbook'?t('savefields'):kind==='facilitator'?t('facnotice'):t('start');let html=`<div class="notice">${esc(notice)}</div>`;if(query&&kind==='learner')html+=`<p class="small">${esc(t('results'))}: “${esc(query)}” · ${pages.length}</p>`;if(!pages.length)return html+`<div class="page empty">${esc(query?t('none'):t('empty'))}</div>`;html+=pages.map(p=>`<article class="page" id="${kind}_${p.id}"><div class="kicker">${esc(p.kicker||p.lesson)}</div><h2>${rich(p.title)}</h2>${p.blocks.map((b,i)=>renderBlock(b,i,p,kind)).join('')}</article>`).join('');if(kind==='learner'||kind==='workbook'){html+='<div class="actions no-print">'+(kind==='learner'?`<button class="primary" type="button" data-view="workbook">${esc(t('exercise'))}</button>`:`<button type="button" data-view="learner">${esc(t('read'))}</button><button type="button" data-view="facilitator">${esc(t('answers'))}</button>`);const order=['O','L1','L2','L3','L4','L5','L6','L7','L8'];const n=order.indexOf(lesson);if(n>0)html+=`<button type="button" data-lesson="${order[n-1]}">← ${esc(t('previous'))}</button>`;if(n>=0&&n<8)html+=`<button type="button" data-lesson="${order[n+1]}">${esc(t('next'))} →</button>`;html+='</div>'}return html}
function renderQuiz(){let count=0,correct=0;for(const q of COURSE.quiz){if(Object.hasOwn(state.choices,q.id)){count++;if(state.choices[q.id]===q.correct_index)correct++}}let html=`<div class="notice">${esc(t('quizintro'))}</div><section class="page"><div class="kicker">12 ${state.lang==='en'?'questions':'questions'}</div><h2>${esc(t('quiz'))}</h2><p><strong>${correct} ${esc(t('score'))}</strong> · ${12-count} ${esc(t('unanswered'))}</p><button type="button" id="quizclear">${esc(t('quizclear'))}</button></section>`;for(const q of COURSE.quiz){const chosen=state.choices[q.id];const answered=Number.isInteger(chosen);html+=`<section class="page"><div class="kicker">${q.id} / ${q.lesson}</div><fieldset class="quizitem"><legend>${esc(q.question[state.lang])}</legend>${q.options[state.lang].map((o,i)=>`<label class="option"><input type="radio" name="${q.id}" value="${i}" data-quiz="${q.id}" ${chosen===i?'checked':''}><span>${String.fromCharCode(65+i)}. ${esc(o)}</span></label>`).join('')}</fieldset><div class="${answered?'feedback'+(chosen===q.correct_index?'':' review'):'small'}" aria-live="polite">${answered?`<strong>${esc(t(chosen===q.correct_index?'correct':'review'))}</strong> ${esc(q.explanation[state.lang])}`:esc(t('choice'))}</div></section>`}return html}
function renderPrompts(){return `<div class="notice">${esc(t('promptintro'))}</div>`+COURSE.prompts.map(p=>`<section class="page"><div class="kicker">${p.id} / ${p.lesson}</div><h2>${esc(p.title[state.lang])}</h2><div class="prompt" id="prompt_${p.id}">${esc(p.text[state.lang])}</div><div class="actions"><button type="button" class="primary copybutton" data-copy="${p.id}">${esc(t('copy'))}</button><span class="small" id="copy_${p.id}" role="status"></span></div></section>`).join('')}
function calculate(c){if(Object.values(c).some(v=>!Number.isFinite(v)||v<0)||c.advance>c.fee||c.prepay>c.cost)return null;return{contribution:c.fee-c.cost,gap:Math.max(0,c.prepay-c.cash-c.advance),balance:c.fee-c.advance,ending:c.cash+c.fee-c.cost}}
function calcOutput(){const r=calculate(calc);if(!r)return `<p class="error">${esc(t('invalid'))}</p>`;const money=v=>new Intl.NumberFormat(state.lang==='fr'?'fr-CA':'en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:2}).format(v);return `<div class="metrics">${Object.entries(r).map(([k,v])=>`<div class="metric"><span>${esc(t(k))}</span><strong>${esc(money(v))}</strong></div>`).join('')}</div><p class="small" style="margin-top:18px">${esc(t('caption'))}</p>`}
function renderCalculator(){return `<section class="page"><div class="kicker">L4 / CAD</div><h2>${esc(t('calculator'))}</h2><p>${esc(t('calcintro'))}</p><form id="calcform"><div class="calculator">${Object.entries(calc).map(([k,v])=>`<div><label for="calc_${k}">${esc(t(k))}</label><input type="number" min="0" step="0.01" required id="calc_${k}" data-calc="${k}" value="${v}"></div>`).join('')}</div><div class="actions"><button type="submit" class="primary">${esc(t('calclabel'))}</button><button type="button" id="funded">${esc(t('funded'))}</button><button type="button" id="unfunded">${esc(t('initial'))}</button></div></form><div id="calcoutput" aria-live="polite" style="margin-top:24px">${calcOutput()}</div><div class="callout"><p>${esc(t('fundednote'))}</p></div><button type="button" data-go="L4">${esc(t('readmore'))}</button></section>`}
const fileLabel=k=>({en:{complete:'Complete reading edition',learner:'Learner guide',workbook:'Fillable workbook',facilitator:'Facilitator guide and answers',quick_reference:'Two-page quick reference',slides:'Teaching slides',prompts:'AI prompt kit'},fr:{complete:'Édition de lecture complète',learner:'Guide de l’apprenant',workbook:'Cahier remplissable',facilitator:'Guide d’animation et corrigés',quick_reference:'Aide-mémoire de deux pages',slides:'Diapositives de formation',prompts:'Prompts pour l’IA'}}[state.lang][k]);
function renderSources(){let html=`<section class="page"><div class="kicker">PDF · DOCX · PPTX · TXT</div><h2>${esc(t('downloads'))}</h2><p>${esc(t('downloadintro'))}</p><p class="small">${esc(t('pdfnote'))}</p>`;for(const kind of ['complete','learner','workbook','facilitator','quick_reference','slides','prompts']){html+=`<h3>${esc(fileLabel(kind))}</h3><div class="actions">`+Object.entries(COURSE.files[state.lang][kind]).map(([fmt,path])=>`<a href="${esc(path)}" download>${fmt.toUpperCase()} · ${esc(fileLabel(kind))}</a>`).join('')+'</div>'}html+=`<p class="small" style="margin-top:25px">${esc(t('local'))}</p></section><section class="page"><div class="kicker">7 November / novembre 2026</div><h2>${esc(t('evidence'))}</h2><p>${esc(t('sourceintro'))}</p><p><a href="SOURCE_REGISTER.json">SOURCE_REGISTER.json</a> · <a href="05_Source_Evidence/audit.md">${state.lang==='en'?'Repository audit':'Audit du dépôt'}</a> · <a href="SHA256SUMS.txt">SHA256SUMS.txt</a></p>`;for(const [id,s]of Object.entries(COURSE.sources)){const title=s['title_'+state.lang]||s.title||id;let path=s.archive_path;if(!path&&s.local_path&&s.local_path.startsWith('continuity_masterclass/research/'))path='05_Source_Evidence/'+s.local_path.slice('continuity_masterclass/research/'.length);html+=`<div class="sourceitem"><strong>${esc(id+' · '+title)}</strong>${s.author?esc(s.author)+' · ':''}${esc(s.edition||'')}${s.version?`<div class="small">${esc(s.version)}</div>`:''}<div>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(t('open'))}</a>`:''}${path?` ${s.url?'· ':''}<a href="${esc(path)}">${esc(t('archived'))}</a>`:''}</div></div>`}return html+'</section>'}
function render(){updateChrome();$('main').innerHTML=(['learner','workbook','facilitator'].includes(view)?renderDocument(view):view==='quiz'?renderQuiz():view==='prompts'?renderPrompts():view==='calculator'?renderCalculator():renderSources())+`<p class="end">CONTINUITY Ω / MasterClass 101 · ${state.lang==='en'?'Course edition 1.0 · Learning materials, not an operational verification or certification.':'Édition pédagogique 1.0 · Ressources d’apprentissage, sans vérification opérationnelle ni certification.'}</p>`}
function navigate(nextView,nextLesson=lesson){view=nextView;lesson=nextLesson;query='';$('search').value='';render();$('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'})}
function downloadJSON(){const blob=new Blob([JSON.stringify({...state,exported_at:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=t('exportname');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)navigate(b.dataset.view);if(b.dataset.lesson)navigate(b.dataset.lesson==='REF'&&!['workbook','facilitator'].includes(view)?'sources':['learner','workbook','facilitator'].includes(view)?view:'learner',b.dataset.lesson);if(b.dataset.go)navigate('learner',b.dataset.go);if(b.dataset.copy){const p=COURSE.prompts.find(x=>x.id===b.dataset.copy);try{if(!navigator.clipboard)throw Error('No clipboard');await navigator.clipboard.writeText(p.text[state.lang]);$('copy_'+p.id).textContent=t('copied')}catch(e){$('copy_'+p.id).textContent=t('copyfail');const range=document.createRange();range.selectNodeContents($('prompt_'+p.id));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range)}}if(b.id==='quizclear'){state.choices={};save();render()}if(b.id==='funded'||b.id==='unfunded'){calc={fee:5600,cost:5000,prepay:4700,cash:1200,advance:b.id==='funded'?3500:0};render()}});
document.addEventListener('input',e=>{if(e.target.dataset.answer){state.answers[e.target.dataset.answer]=e.target.value;save()}if(e.target.dataset.calc){calc[e.target.dataset.calc]=e.target.value===''?NaN:Number(e.target.value);$('calcoutput').innerHTML=calcOutput()}});
document.addEventListener('change',e=>{if(e.target.dataset.complete){const id=e.target.dataset.complete;state.complete=e.target.checked?[...new Set([...state.complete,id])]:state.complete.filter(x=>x!==id);save();updateChrome()}if(e.target.dataset.quiz){const id=e.target.dataset.quiz;state.choices[id]=Number(e.target.value);save();const y=window.scrollY;render();const selected=document.querySelector(`input[data-quiz="${id}"]:checked`);if(selected)selected.focus({preventScroll:true});window.scrollTo(0,y)}});
document.addEventListener('submit',e=>{if(e.target.id==='calcform'){e.preventDefault();$('calcoutput').innerHTML=calcOutput()}});
for(const lang of ['en','fr'])$('lang-'+lang).addEventListener('click',()=>{state.lang=lang;save();render()});
$('search').addEventListener('input',e=>{query=e.target.value.trim();view='learner';render()});
$('downloads-shortcut').addEventListener('click',()=>navigate('sources'));
$('print').addEventListener('click',()=>window.print());
$('export').addEventListener('click',downloadJSON);
$('import').addEventListener('click',()=>$('importfile').click());
$('importfile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('Too large');const candidate=validateState(JSON.parse(await file.text()));state=candidate;save();render();$('savestatus').textContent=t('importok')+' '+t(canSave?'saved':'unsaved')}catch(err){$('savestatus').textContent=t('importfail')}e.target.value=''});
$('reset').addEventListener('click',()=>{if(window.confirm(t('resetconfirm'))){const lang=state.lang;state=defaultState();state.lang=lang;save();render()}});
render();
</script></body></html>
