name: Validate dedicated copy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record job start
        run: echo "AGI_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify copied identities
        run: python3 scripts/verify_copy.py
      - name: Test synthetic prototype and bilingual reader
        run: python3 -m unittest discover -s tests -p 'test_continuity*.py' -v
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify preserved publication
        run: python3 docs/continuity-omega-paper/verify.py
      - name: Package preserved reading companion
        run: python3 scripts/package_continuity_reading.py --output "$RUNNER_TEMP/continuity-companion"
